# Insight engine defaults. `evallab insights init` copies this file to the
# state directory ($EVALLAB_INSIGHTS_STATE, default ~/.local/state/evallab-insights);
# edit that copy, not this one. A running engine re-reads it at the start of every
# tick (a file that fails validation is reported in status and the previous
# values stay in force); routes.yaml is read at start only.
schema_version: 1

# What the engine reads. Globs expand ~ and $VARS. Newer, higher-priority
# sections are extracted first. Files larger than max_bytes are read up to
# max_bytes (the cut is recorded on the source).
sources:
  - family: coordinator-logs
    kind: findings_log
    priority: 90
    globs:
      - ~/Developer/research-context/bridge/*/FINDINGS*.md
      - ~/Developer/research-context/bridge/*/MORNING-REPORT*.md
      - ~/Developer/research-context/bridge/*/morning-report*.md
      - ~/Developer/research-context/bridge/*/morning-results.md
    max_age_days: 30
  - family: lane-reports
    kind: report
    priority: 70
    globs:
      - ~/Developer/research-context/bridge/*/*/raw/*/report.md
      - ~/Developer/research-context/bridge/*/raw/*/report.md
    max_age_days: 21
  - family: results-reports
    kind: report
    priority: 60
    globs:
      - ~/Developer/eval-lab-results/*/*/report.md
      - ~/Developer/eval-lab-results/*/*/REPORT.md
      - ~/Developer/eval-lab-results/*/*/RESULTS.md
    max_age_days: 21
  - family: line-scoreboards
    kind: receipt
    priority: 60
    globs:
      - ~/Developer/eval-lab-results/*/*/scoreboard.json
      - ~/Developer/eval-lab-results/*/*/*/scoreboard.json
    max_bytes: 200000
    max_age_days: 21
  - family: experiment-results
    kind: readme
    priority: 40
    globs:
      - ~/Developer/eval-lab/.worktrees/insights-readonly/research/experiments/*/RESULTS.md
      - ~/Developer/eval-lab/.worktrees/insights-readonly/research/experiments/*/README.md
    max_age_days: 21

# Explicit files (backtests use these to freeze a log at a cutoff line).
overrides: []

tick_seconds: 300
max_concurrent_passes: 3
# Committed experiment results are read from an engine-owned detached worktree
# that the engine fast-forwards to origin/main (the primary checkout can lag).
repo_mirror:
  repo: ~/Developer/eval-lab
  path: ~/Developer/eval-lab/.worktrees/insights-readonly
  refresh_minutes: 60

# A provider whose usage window is at or above this percent is skipped. The gap
# to 100% is left for Peter's own sessions on the same subscriptions.
max_provider_used_percent: 75
# Do not start a worker at critical memory pressure, or at warn pressure when
# free memory is below this percentage. Absolute swap used is not a veto: block
# only when the engine measures more than this much swap growth over 5 minutes.
host_min_memory_level: 15
host_max_swap_growth_gb: 2
board_top_n: 12

# Workers may read their own pass, source roots and the read-only mirror. Extra
# roots are optional. flag annotates imported claims/cards; reject drops output.
allowed_read_roots: []
scope_policy: flag

lenses:
  extractor:
    cooldown_minutes: 2
    daily_cap: 120
    batch_size: 10
    max_pack_chars: 80000
    # Backfill runs on two sources at once; each pass claims its own sections.
    # (Only extractor and skeptic accept max_parallel > 1.)
    max_parallel: 2
  # Systematic review: every experiment is read skeptically, not just "new claims".
  # An experiment is queued when its current claims differ from what the skeptic
  # last reviewed (new or changed), most open signals first, then most claims,
  # then newest. Each pass takes up to experiments_per_pass experiments with all
  # their non-failed claims (pack limits still apply) and their open signals.
  # Coverage is recorded only when a pass succeeds; a failed pass leaves it alone.
  # max_parallel > 1 runs passes on disjoint experiments at the same time.
  skeptic:
    cooldown_minutes: 30
    daily_cap: 16
    experiments_per_pass: 3
    max_parallel: 2
  connector:
    cooldown_minutes: 90
    daily_cap: 8
    min_new_claims: 10
  anomaly:
    cooldown_minutes: 120
    daily_cap: 6
    min_open_signals: 3
  theorist:
    cooldown_minutes: 180
    daily_cap: 4
    min_new_insights: 5
  ideator:
    cooldown_minutes: 240
    daily_cap: 4
    min_new_insights: 6
  referee:
    cooldown_minutes: 5
    daily_cap: 40
    min_pending: 1
    # Cards are added only while the exact rendered pack stays within budget.
    max_pack_chars: 240000
  synthesizer:
    cooldown_minutes: 120
    daily_cap: 8
    min_new_insights: 3
  rederiver:
    cooldown_minutes: 60
    daily_cap: 10
    min_new_claims: 10
    batch_size: 12
  # Hidden corrupted twins continuously test the referee. Uses extractor's route.
  twinmaker:
    cooldown_minutes: 720
    daily_cap: 2
    min_new_insights: 4
    batch_size: 2
