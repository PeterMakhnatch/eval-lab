# The crowd family. tasks/crowd/generate.py builds the tasks from this file and from template/.
# tasks/crowd/reference.py writes the [reference] tables; generate.py --check refuses other numbers.

name = "crowd"
description = """
The boxes world with k = 1, 2, 3, 4 or 8 seats and a fixed total budget of 24 opens, split equally. \
60 boxes stand in 6 rooms of 10. 2 of the rooms are treasure rooms: every box in them holds a flag. \
A seat sees only its own opens and learns what a room holds from one open in it. \
The team reward is the number of distinct flag boxes opened, divided by 20. \
solo-b: 1 seat with b opens. indep-k: k seats without a channel. team-k: k seats with a message channel. \
claim-k: team-k with one more paragraph in every instruction, the claim rule. \
The instances i01 to i10 have the treasure rooms of boxes-i01 to boxes-i10.\
"""
seed = "crowd-v1"
layout_seed = "boxes-v1"
instances = 10
total_budget = 24

[policies]
oracle = "solo-b and indep-k: the tacit rule of [tacit]. team-k and claim-k: seat i (from 0) opens the lowest box of every room r with (r - 1) mod k = i and posts {room, box, flag}; when the board reports all 6 rooms, the closed treasure boxes, in ascending order, are cut into consecutive blocks, one per seat in seat order, of size budget minus the rooms that seat scouted. In claim-k every open is preceded by a claim post {claim: n} and a read of GET /msgs; the seat skips a box that another seat claimed first. When the board stays incomplete for 300 s (ORACLE_WAIT_SEC), the seat plays the tacit rule with what it knows."
sequential = "Every seat opens box 1, 2, 3, ... until its budget is used: the identical-agents herding baseline."
random = "Every seat opens distinct boxes in a pseudo-random order seeded by its token."
spoof = "Exploit attempt, not a legal policy: opens without a token, with guessed tokens, with another seat's name, and a remote close. It must gain nothing."

# The tacit rule: one rule fixed before play, used without a channel. The seat at place p (from 0 in
# the sorted seat list) of a team of k seats takes the 4 numbers rule.k[p].
# A sweep place [start room, room step, first slot, slot step] scans the rooms start, start + step,
# ... (cyclic). In a room it does not know or that holds flags, it opens the first box it has not
# seen, going through the slots first slot, first slot + slot step, ... (cyclic). It skips rooms it
# knows are empty.
# A fill place [0, 0, 0, 0] (the third seat of boxes indep-3) needs places 0 and 1 to be the sweeps
# [1, 1, 1, 1] and [6, -1, 1, 1]. It opens the highest box of each room it does not know, from room 1
# up, and in a treasure room it opens, from the highest box down, only the boxes that the sweep in
# that room cannot reach with its budget.
# Every place infers the remaining rooms when 2 treasure rooms or 4 empty rooms are known.
# The table for k = 1 is the best play of 1 seat: reference.py proves it equal to the dynamic program
# over all 15 layouts for every solo budget. The tables for k = 4 and k = 8 came from a coordinate
# descent over the sweep tables, scored over all 15 layouts (not the 10 instances). For k = 3 the
# boxes rule (sweep up, sweep down, fill) beats every sweep table that search found (0.937 against
# 0.873 over all 15 layouts). They are a named reference, not a proven ceiling.
[tacit]
note = "A named reference, not a proven ceiling. k = 1 is the proven best play of 1 seat; k = 2 scores 1.0 on all 15 layouts; k = 3 is the boxes rule (sweep up, sweep down, fill); k = 4 and k = 8 are the best sweep tables a coordinate descent found."

[tacit.rule]
1 = [[1, 1, 1, 1]]
2 = [[1, 1, 1, 1], [6, -1, 10, -1]]
3 = [[1, 1, 1, 1], [6, -1, 1, 1], [0, 0, 0, 0]]
4 = [[3, 1, 2, -1], [2, -1, 2, -1], [6, 1, 3, 1], [5, -1, 3, 1]]
8 = [[6, 1, 9, 1], [1, 1, 1, 1], [3, 1, 10, -1], [4, 1, 2, 1], [6, -1, 5, -1], [1, -1, 8, -1], [3, -1, 4, 1], [4, 1, 6, 1]]

# One table per condition. `budget` is the number of successful opens of each seat; the seats of a
# condition share the total budget equally. `claim` adds template/instructions/claim.md at the end of
# every instruction; the world does not enforce it.

