name: mcp-wheelhouse-platform

on:
  pull_request:
    paths:
      - src/evallab/mcp_substrate.py
      - tests/test_mcp_substrate.py
      - .github/workflows/mcp-wheelhouse-platform.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-cp312-wheelhouse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Install uv 0.9.24 from PyPI
        run: |
          python3 -m pip install --user uv==0.9.24
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: uv python install 3.12
      - run: uv sync --locked --group dev
      - name: Stage actual CPython 3.12 manylinux cffi wheel
        run: |
          mkdir -p /tmp/mcp-linux-cffi /tmp/fastmcp3_wheelhouse
          python3 -m pip download --only-binary=:all: --no-deps --dest /tmp/mcp-linux-cffi --platform manylinux_2_17_x86_64 --python-version 312 cffi==2.1.1
          python3 -m pip download --only-binary=:all: --no-deps --dest /tmp/fastmcp3_wheelhouse fastmcp==3.4.7
          sha256sum /tmp/mcp-linux-cffi/cffi-2.1.1-*.whl | grep '^c1453022f490d2459a11819d83ad1d586e9ff65a12ac3e705ffebd46d3685dcf'
      - name: Verify platform lock derives selected cffi hash
        run: uv run --no-sync pytest tests/test_mcp_substrate.py -k linux_cp312_manylinux_cffi_hash_is_selected_from_wheel_bytes -n0
