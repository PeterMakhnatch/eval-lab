[project]
name = "ceo-bench"
version = "0.1.0"
description = "CEO-Bench harness-run to Harbor-trial bridge (isolated SQLCipher dependency)"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    # sqlcipher3-binary ships prebuilt wheels for Linux x86_64 only; sqlcipher3
    # ships them for macOS + Windows. Split by platform so both get a wheel.
    # (Same split as upstream ceobench-src's pyproject.)
    "sqlcipher3-binary>=0.6.0 ; sys_platform == 'linux'",
    "sqlcipher3>=0.6.2 ; sys_platform != 'linux'",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ceo_bench"]
