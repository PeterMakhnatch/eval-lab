x-seat: &seat
  build: ./seat
  user: agent
  working_dir: /home/agent
  command: ["sleep", "infinity"]
  init: true
  depends_on:
    main:
      condition: service_healthy

services:
  main:
    command: ["python3", "/world/world.py"]
    environment:
      SEAT_TOKENS: "{\"89a38c1fb9b0a8c124edcd5169168d4a\": \"builder\", \"dcb651e319aacef7837081a57b64dfef\": \"planner\", \"e1f42589b2f5d543307a372823f62525\": \"verifier\"}"
    networks:
      planner-world:
        aliases: [world]
      builder-world:
        aliases: [world]
      verifier-world:
        aliases: [world]
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health', timeout=2)"]
      interval: 2s
      timeout: 5s
      retries: 15
      start_period: 2s
  planner:
    <<: *seat
    networks: [planner-world]
    environment:
      SEAT: "planner"
      SEAT_TOKEN: "dcb651e319aacef7837081a57b64dfef"
      WORLD: "http://world:8080"
  builder:
    <<: *seat
    networks: [builder-world]
    environment:
      SEAT: "builder"
      SEAT_TOKEN: "89a38c1fb9b0a8c124edcd5169168d4a"
      WORLD: "http://world:8080"
  verifier:
    <<: *seat
    networks: [verifier-world]
    environment:
      SEAT: "verifier"
      SEAT_TOKEN: "e1f42589b2f5d543307a372823f62525"
      WORLD: "http://world:8080"

networks:
  planner-world:
    internal: true
    enable_ipv4: false
    enable_ipv6: true
  builder-world:
    internal: true
    enable_ipv4: false
    enable_ipv6: true
  verifier-world:
    internal: true
    enable_ipv4: false
    enable_ipv6: true
