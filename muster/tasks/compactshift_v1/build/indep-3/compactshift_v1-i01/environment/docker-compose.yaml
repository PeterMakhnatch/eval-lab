x-seat: &seat
  build: ./seat
  user: agent
  working_dir: /home/agent
  command: ["sleep", "infinity"]
  init: true
  depends_on:
    main:
      condition: service_healthy

services:
  main:
    command: ["python3", "/world/world.py"]
    environment:
      SEAT_TOKENS: "{\"17fd0a73f7725f9c462a0711950d4b40\": \"verifier\", \"4e2e849ee03c786c8551e7d8dee5960d\": \"builder\", \"53c5db1b5a8600b8dbdb823483a9788d\": \"planner\"}"
    networks:
      planner-world:
        aliases: [world]
      builder-world:
        aliases: [world]
      verifier-world:
        aliases: [world]
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health', timeout=2)"]
      interval: 2s
      timeout: 5s
      retries: 15
      start_period: 2s
  planner:
    <<: *seat
    networks: [planner-world]
    environment:
      SEAT: "planner"
      SEAT_TOKEN: "53c5db1b5a8600b8dbdb823483a9788d"
      WORLD: "http://world:8080"
  builder:
    <<: *seat
    networks: [builder-world]
    environment:
      SEAT: "builder"
      SEAT_TOKEN: "4e2e849ee03c786c8551e7d8dee5960d"
      WORLD: "http://world:8080"
  verifier:
    <<: *seat
    networks: [verifier-world]
    environment:
      SEAT: "verifier"
      SEAT_TOKEN: "17fd0a73f7725f9c462a0711950d4b40"
      WORLD: "http://world:8080"

networks:
  planner-world:
    internal: true
    enable_ipv4: false
    enable_ipv6: true
  builder-world:
    internal: true
    enable_ipv4: false
    enable_ipv6: true
  verifier-world:
    internal: true
    enable_ipv4: false
    enable_ipv6: true
