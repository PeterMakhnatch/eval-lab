schema_version = "1.4"
artifacts = ["/logs/world/events.jsonl"]

[task]
name = "muster/replan_v1-i06"
description = "replan_v1-i06, condition solo-x3: 1 solo seat across all 72 records, 9 commits per seat, adapt to mid-flight Epoch 2 replan without committing stale Epoch 1 records."
keywords = ["seats", "multi-agent", "muster"]

[metadata]
family = "replan_v1"
condition = "solo-x3"
instance = 6
seats_count = 1
channel = false
notices = false
epoch_fence = false
oracle_reward = 1.0
exploits = ["spoof"]

[verifier]
timeout_sec = 120.0

[agent]
timeout_sec = 600.0

[environment]
build_timeout_sec = 600.0

[environment.env]
COMPOSE_BAKE = "false"

[agents.p1]
