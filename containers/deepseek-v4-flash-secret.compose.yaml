services:
  main:
    environment:
      DEEPSEEK_API_KEY: evallab-proxy-placeholder
      MSWEA_API_KEY: evallab-proxy-placeholder
      DEEPSEEK_BASE_URL: http://deepseek-secret-proxy:8080
      OPENAI_BASE_URL: http://deepseek-secret-proxy:8080
      OPENAI_API_BASE: http://deepseek-secret-proxy:8080
    depends_on:
      deepseek-secret-proxy:
        condition: service_healthy

  deepseek-secret-proxy:
    image: python:3.12.11-slim@sha256:47ae396f09c1303b8653019811a8498470603d7ffefc29cb07c88f1f8cb3d19f
    user: "${EVALLAB_PROXY_UID:?}:${EVALLAB_PROXY_GID:?}"
    command: ["python", "/opt/evallab/deepseek_secret_proxy.py"]
    networks:
      - default
      - workbench-internal
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
      EVALLAB_DEEPSEEK_SECRET_PATH: /run/secrets/evallab_deepseek_api_key
      EVALLAB_DEEPSEEK_UPSTREAM: ${EVALLAB_DEEPSEEK_UPSTREAM:-https://api.deepseek.com}
      EVALLAB_DEEPSEEK_PROXY_CAPABILITY: ${EVALLAB_DEEPSEEK_PROXY_CAPABILITY:?proxy capability required}
      EVALLAB_DEEPSEEK_ATTEMPT_ID: ${EVALLAB_DEEPSEEK_ATTEMPT_ID:?attempt identity required}
      EVALLAB_DEEPSEEK_USAGE_FILE: /run/evallab/deepseek-proxy-usage.json
      EVALLAB_DEEPSEEK_ALLOWED_MODEL: ${EVALLAB_DEEPSEEK_ALLOWED_MODEL:-deepseek-v4-flash}
      EVALLAB_DEEPSEEK_MAX_REQUESTS: ${EVALLAB_DEEPSEEK_MAX_REQUESTS:?request ceiling required}
      EVALLAB_DEEPSEEK_MAX_INPUT_TOKENS: ${EVALLAB_DEEPSEEK_MAX_INPUT_TOKENS:?input-token ceiling required}
      EVALLAB_DEEPSEEK_MAX_OUTPUT_TOKENS: ${EVALLAB_DEEPSEEK_MAX_OUTPUT_TOKENS:?output-token ceiling required}
      EVALLAB_DEEPSEEK_MAX_TOTAL_TOKENS: ${EVALLAB_DEEPSEEK_MAX_TOTAL_TOKENS:?total-token ceiling required}
      EVALLAB_DEEPSEEK_MAX_COST_MICROS: ${EVALLAB_DEEPSEEK_MAX_COST_MICROS:?cost ceiling required}
      EVALLAB_DEEPSEEK_CAPABILITY_EXPIRES_AT: ${EVALLAB_DEEPSEEK_CAPABILITY_EXPIRES_AT:?capability expiry required}
      EVALLAB_DEEPSEEK_INPUT_COST_MICROS_PER_MILLION: ${EVALLAB_DEEPSEEK_INPUT_COST_MICROS_PER_MILLION:-280000}
      EVALLAB_DEEPSEEK_OUTPUT_COST_MICROS_PER_MILLION: ${EVALLAB_DEEPSEEK_OUTPUT_COST_MICROS_PER_MILLION:-420000}
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    volumes:
      - "${EVALLAB_DEEPSEEK_PROXY_SCRIPT:?proxy script path required}:/opt/evallab/deepseek_secret_proxy.py:ro"
      - "${EVALLAB_DEEPSEEK_SECRET_FILE:?DeepSeek secret file path required}:/run/secrets/evallab_deepseek_api_key:ro"
      - "${EVALLAB_DEEPSEEK_USAGE_DIR:?proxy usage directory required}:/run/evallab:rw"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=2)",
        ]
      interval: 2s
      timeout: 2s
      retries: 15
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

networks:
  workbench-internal:
    internal: true
