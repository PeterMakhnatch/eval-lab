volumes:
  evallab-operator-state:

services:
  operator-state-init:
    image: busybox:1.37
    user: "0:0"
    network_mode: none
    restart: "no"
    profiles: ["manual"]
    read_only: true
    volumes:
      - evallab-operator-state:/var/lib/evallab-operator
    command:
      - sh
      - -c
      - mkdir -p /var/lib/evallab-operator && chown 65532:65532 /var/lib/evallab-operator && chmod 0700 /var/lib/evallab-operator
  continuous-operator:
    build:
      context: ../..
      dockerfile: containers/continuous-operator/Dockerfile
    restart: "no"
    profiles: ["manual"]
    user: "65532:65532"
    read_only: true
    depends_on:
      operator-state-init:
        condition: service_completed_successfully
    environment:
      EVAL_LAB_OPERATOR_STATE: /var/lib/evallab-operator
    volumes:
      # Confined named volume: kill latch, leases, budget, and audit survive restart.
      # Do not mount this volume over /run/secrets; the MAC key is outside writable state.
      - evallab-operator-state:/var/lib/evallab-operator
    secrets:
      - source: evallab-hmac
        target: evallab-hmac
        uid: "65532"
        gid: "65532"
        mode: 0440
    tmpfs:
      # Scratch only. Operator state must not live on tmpfs.
      - /tmp:mode=0700
    command: ["validate", "--state-dir", "/var/lib/evallab-operator"]

secrets:
  evallab-hmac:
    external: true
