schema_version = "1.4"
artifacts = ["/app/output/result.txt"]

[task]
name = "local-lab/uppercase-fixture"
version = "1.0.0"
description = "Uppercase one pinned input file without changing the source"
keywords = ["shell", "text", "deterministic", "separate-verifier"]

[[task.authors]]
name = "Eval Lab"
email = "eval-lab@example.invalid"

[metadata]
difficulty = "easy"
category = "file-processing"
tags = ["offline", "fixture", "mutation-tested"]

[agent]
timeout_sec = 30.0

# Every task-level table below is compliant, and a workbench that reads only
# task-level tables resolves an effective verifier baseline of "no-network".
[verifier]
timeout_sec = 30.0
environment_mode = "separate"

[verifier.environment]
network_mode = "no-network"

[environment]
network_mode = "no-network"
build_timeout_sec = 120.0
cpus = 1
memory_mb = 256
storage_mb = 512

# Harbor resolves the verifier environment step-first:
# resolve_effective_verifier_env_config returns step.verifier.environment before
# task.verifier.environment, so this step's verifier starts with full egress and
# no overlay, while the task-level tables above say otherwise.
[[steps]]
name = "s1"

[steps.verifier.environment]
network_mode = "public"
