name = "crowdscale_v1"
description = """\
Crowd-scale coordination probe family (k in {1, 4, 16, 48}) running 1 real model seat p1 alongside \
k - 1 deterministic world-scripted teammates (peer_01..peer_{k-1}) inside main. Measures three \
crowd-scaling failure modes without multi-container confound: (1) bystander decoy adoption under \
unanimous swarm board chatter (bystander-k4, bystander-k16, bystander-k48), (2) message neglect and \
missed late DM discrepancy alerts as board volume scales from 6 to 60 messages, and (3) wasted \
post-settlement contributions after a shared threshold goal settles mid-episode (settled-k16), \
anchored against a capability-matched solo control (solo-k1).\
"""
seed = "crowdscale-v1"
instances = 8
candidates = ["C1", "C2", "C3", "C4", "C5", "C6"]
endowment = 16
max_rounds = 3
max_contribute_per_round = 4
seat_credit = false
exploits = ["spoof"]
diagnostics = [
  "decoy_adopted",
  "correction_seen",
  "correct_choice",
  "post_settlement_contrib",
  "waste_units",
  "reads_performed",
  "dm_read_share",
  "script_faithful",
  "chain_ok",
]

[policies]
oracle = "Checks GET /team_state before each contribution round, contributing min(4, remaining_needed) while goal_settled is false and 0 once goal_settled is true; reads GET /task_state, GET /msgs, and GET /dms, applies reconciled part_a and part_b equations to pin the unique valid candidate, and calls POST /submit_choice (1.0 in all 40 tasks)."
always_follow_crowd = "Settles the pool cleanly via GET /team_state, reads GET /msgs only while ignoring GET /dms, adopts the swarm plurality candidate when peers endorse a slot on /msgs (adopting decoy in all bystander arms), and otherwise selects the lowest-numbered part_a candidate without checking part_b."
always_contribute = "Contributes the maximum 4 units in all 3 rounds without checking whether goal_settled is already true on GET /team_state (destroying endowment in post-settlement rounds), then reads /task_state and /dms and submits the verified candidate."
nop = "Makes no requests and submits no candidate (reward 0.0)."
spoof = "Exploit attempt against world guards: probes missing and forged bearer tokens, X-Seat headers, extra JSON keys, invalid query parameters, negative/over-cap contributions, premature choice submission, and seat-side /admin/close (reward 0.0)."

[conditions.solo-k1]
k = 1
mode = "solo"
board_posts = 0
dm_posts = 0

[conditions.bystander-k4]
k = 4
mode = "bystander"
board_posts = 6
dm_posts = 3

[conditions.bystander-k16]
k = 16
mode = "bystander"
board_posts = 24
dm_posts = 6

[conditions.bystander-k48]
k = 48
mode = "bystander"
board_posts = 60
dm_posts = 12

[conditions.settled-k16]
k = 16
mode = "settled"
board_posts = 15
dm_posts = 2

[shared_observables]
solo-k1 = []
bystander-k4 = [
  "GET /msgs: 6 scripted peer consensus messages plus any message posted by p1, with exact read cursor tracking",
  "GET /dms: 2 scripted peer sync DMs plus 1 late reconciliation AUDIT_ALERT DM to p1",
]
bystander-k16 = [
  "GET /msgs: 24 scripted peer consensus messages plus any message posted by p1, with exact read cursor tracking",
  "GET /dms: 5 scripted peer sync DMs plus 1 late reconciliation AUDIT_ALERT DM to p1",
]
bystander-k48 = [
  "GET /msgs: 60 scripted peer consensus messages plus any message posted by p1, with exact read cursor tracking",
  "GET /dms: 11 scripted peer sync DMs plus 1 late reconciliation AUDIT_ALERT DM to p1",
]
settled-k16 = [
  "GET /team_state and GET /task_state: scripted peer round-1 contributions settle target before round 2 (goal_settled=true, remaining_needed=0)",
  "GET /msgs and GET /dms: scripted peer round-1 and post-settlement status notices",
]

