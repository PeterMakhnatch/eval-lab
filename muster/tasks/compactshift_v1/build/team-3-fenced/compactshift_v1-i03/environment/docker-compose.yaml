x-seat: &seat
  build: ./seat
  user: agent
  working_dir: /home/agent
  command: ["sleep", "infinity"]
  init: true
  depends_on:
    main:
      condition: service_healthy

services:
  main:
    command: ["python3", "/world/world.py"]
    environment:
      SEAT_TOKENS: "{\"6bebb184127958014c28c979e74b5b17\": \"builder\", \"df472a07fc89c85ca47edc7dd564f48f\": \"planner\", \"dfd1952ebbde2d1b17f0dc75b482a420\": \"verifier\"}"
    networks:
      planner-world:
        aliases: [world]
      builder-world:
        aliases: [world]
      verifier-world:
        aliases: [world]
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health', timeout=2)"]
      interval: 2s
      timeout: 5s
      retries: 15
      start_period: 2s
  planner:
    <<: *seat
    networks: [planner-world]
    environment:
      SEAT: "planner"
      SEAT_TOKEN: "df472a07fc89c85ca47edc7dd564f48f"
      WORLD: "http://world:8080"
  builder:
    <<: *seat
    networks: [builder-world]
    environment:
      SEAT: "builder"
      SEAT_TOKEN: "6bebb184127958014c28c979e74b5b17"
      WORLD: "http://world:8080"
  verifier:
    <<: *seat
    networks: [verifier-world]
    environment:
      SEAT: "verifier"
      SEAT_TOKEN: "dfd1952ebbde2d1b17f0dc75b482a420"
      WORLD: "http://world:8080"

networks:
  planner-world:
    internal: true
    enable_ipv4: false
    enable_ipv6: true
  builder-world:
    internal: true
    enable_ipv4: false
    enable_ipv6: true
  verifier-world:
    internal: true
    enable_ipv4: false
    enable_ipv6: true
