schema_version = "1.4"
artifacts = ["/logs/world/events.jsonl"]

[task]
name = "muster/horde-i05"
description = "horde-i05, condition zones-16: 16 seats with a message channel and the zones rule, 6 opens per seat (96 in total), look for the flags in 240 boxes."
