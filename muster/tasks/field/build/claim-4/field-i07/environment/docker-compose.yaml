x-seat: &seat
  build: ./seat
  user: agent
  working_dir: /home/agent
  command: ["sleep", "infinity"]
  init: true
  depends_on:
    main:
      condition: service_healthy

services:
  main:
    command: ["python3", "/world/world.py"]
    environment:
      SEAT_TOKENS: "{\"76066f047fb02e257eb8892aedbf3e36\": \"p1\", \"bb8f2a29e56bf771ced1ba105d114744\": \"p3\", \"da4d906204635bf802d34c6928f92a6d\": \"p2\", \"da651ecedb1d328325caef1d172652c8\": \"p4\"}"
    networks:
      p1-world:
        aliases: [world]
      p2-world:
        aliases: [world]
      p3-world:
        aliases: [world]
      p4-world:
        aliases: [world]
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health', timeout=2)"]
      interval: 2s
      timeout: 5s
      retries: 15
      start_period: 2s
  p1:
    <<: *seat
    networks: [p1-world]
    environment:
      SEAT: "p1"
      SEAT_TOKEN: "76066f047fb02e257eb8892aedbf3e36"
      WORLD: "http://world:8080"
  p2:
    <<: *seat
    networks: [p2-world]
    environment:
      SEAT: "p2"
      SEAT_TOKEN: "da4d906204635bf802d34c6928f92a6d"
      WORLD: "http://world:8080"
  p3:
    <<: *seat
    networks: [p3-world]
    environment:
      SEAT: "p3"
      SEAT_TOKEN: "bb8f2a29e56bf771ced1ba105d114744"
      WORLD: "http://world:8080"
  p4:
    <<: *seat
    networks: [p4-world]
    environment:
      SEAT: "p4"
      SEAT_TOKEN: "da651ecedb1d328325caef1d172652c8"
      WORLD: "http://world:8080"

networks:
  p1-world:
    internal: true
    enable_ipv4: false
    enable_ipv6: true
  p2-world:
    internal: true
    enable_ipv4: false
    enable_ipv6: true
  p3-world:
    internal: true
    enable_ipv4: false
    enable_ipv6: true
  p4-world:
    internal: true
    enable_ipv4: false
    enable_ipv6: true
