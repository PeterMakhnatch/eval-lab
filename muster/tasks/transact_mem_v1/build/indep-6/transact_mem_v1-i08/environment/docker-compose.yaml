x-seat: &seat
  user: agent
  working_dir: /home/agent
  command: ["sleep", "infinity"]
  init: true
  depends_on:
    main:
      condition: service_healthy

services:
  main:
    command: ["python3", "/world/world.py"]
    environment:
      SEAT_TOKENS: "{\"25ae9bed6f36ba0b5eedfb183a83a89d\": \"lead\", \"8934328e7378fd2bbafbd193d0a47d5e\": \"s2\", \"b369aedaa7e34817bcac93c5832db3f3\": \"auditor\", \"c77eb6eca1db2f7b1589f1cf0b15036d\": \"s3\", \"eb1ad1e1f3a7d995d7bc867ea55f0b89\": \"s4\", \"f84f27631456590600fb58a237ed2fba\": \"s1\"}"
    networks:
      lead-world:
        aliases: [world]
      s1-world:
        aliases: [world]
      s2-world:
        aliases: [world]
      s3-world:
        aliases: [world]
      s4-world:
        aliases: [world]
      auditor-world:
        aliases: [world]
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health', timeout=2)"]
      interval: 2s
      timeout: 5s
      retries: 15
      start_period: 2s
  lead:
    <<: *seat
    build: ./seat_lead
    networks: [lead-world]
    environment:
      SEAT: "lead"
      SEAT_TOKEN: "25ae9bed6f36ba0b5eedfb183a83a89d"
      WORLD: "http://world:8080"
  s1:
    <<: *seat
    build: ./seat_s1
    networks: [s1-world]
    environment:
      SEAT: "s1"
      SEAT_TOKEN: "f84f27631456590600fb58a237ed2fba"
      WORLD: "http://world:8080"
  s2:
    <<: *seat
    build: ./seat_s2
    networks: [s2-world]
    environment:
      SEAT: "s2"
      SEAT_TOKEN: "8934328e7378fd2bbafbd193d0a47d5e"
      WORLD: "http://world:8080"
  s3:
    <<: *seat
    build: ./seat_s3
    networks: [s3-world]
    environment:
      SEAT: "s3"
      SEAT_TOKEN: "c77eb6eca1db2f7b1589f1cf0b15036d"
      WORLD: "http://world:8080"
  s4:
    <<: *seat
    build: ./seat_s4
    networks: [s4-world]
    environment:
      SEAT: "s4"
      SEAT_TOKEN: "eb1ad1e1f3a7d995d7bc867ea55f0b89"
      WORLD: "http://world:8080"
  auditor:
    <<: *seat
    build: ./seat_auditor
    networks: [auditor-world]
    environment:
      SEAT: "auditor"
      SEAT_TOKEN: "b369aedaa7e34817bcac93c5832db3f3"
      WORLD: "http://world:8080"

networks:
  lead-world:
    internal: true
    enable_ipv4: false
    enable_ipv6: true
  s1-world:
    internal: true
    enable_ipv4: false
    enable_ipv6: true
  s2-world:
    internal: true
    enable_ipv4: false
    enable_ipv6: true
  s3-world:
    internal: true
    enable_ipv4: false
    enable_ipv6: true
  s4-world:
    internal: true
    enable_ipv4: false
    enable_ipv6: true
  auditor-world:
    internal: true
    enable_ipv4: false
    enable_ipv6: true
