name: ci-experiment

# TEMPORARY timing experiment for the CI speed work (2026-11-11). Never merge.
on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

env:
  UV_HTTP_RETRIES: "5"

jobs:
  exp:
    name: exp (${{ matrix.variant }})
    env:
      UV_COMPILE_BYTECODE: ${{ matrix.bytecode }}
      PYTEST_ADDOPTS: ${{ matrix.addopts }}
    runs-on: ubuntu-latest
    # HAR-260 added the Harbor-gated suites the main step could only skip, so the
    # native step now runs 33 files instead of 20. On run 41421757708 the job took
    # 6.3-7.3 min against the old 10 min cap; the wider cap keeps a hang bounded
    # without cutting a slower Python or runner off mid-suite.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - {variant: "s1of2", shard: "1/2", bytecode: "0", addopts: "", native_n: "0"}
          - {variant: "s2of2", shard: "2/2", bytecode: "0", addopts: "", native_n: "0"}
          - {variant: "s1of4", shard: "1/4", bytecode: "0", addopts: "", native_n: "0"}
          - {variant: "s2of4", shard: "2/4", bytecode: "0", addopts: "", native_n: "0"}
          - {variant: "s3of4", shard: "3/4", bytecode: "0", addopts: "", native_n: "0"}
          - {variant: "s4of4", shard: "4/4", bytecode: "0", addopts: "", native_n: "0"}
          - {variant: "s1of6", shard: "1/6", bytecode: "0", addopts: "", native_n: "0"}
          - {variant: "s2of6", shard: "2/6", bytecode: "0", addopts: "", native_n: "0"}
          - {variant: "s3of6", shard: "3/6", bytecode: "0", addopts: "", native_n: "0"}
          - {variant: "s4of6", shard: "4/6", bytecode: "0", addopts: "", native_n: "0"}
          - {variant: "s5of6", shard: "5/6", bytecode: "0", addopts: "", native_n: "0"}
          - {variant: "s6of6", shard: "6/6", bytecode: "0", addopts: "", native_n: "0"}
    # HAR-297: the catalog, verdict and z2-table suites run only against a live
    # database; without this service they skip on every CI run. Files are sharded
    # by path hash, so every matrix row needs its own service container.
    services:
      postgres:
        image: postgres:18.4-alpine3.24
        env:
          POSTGRES_DB: evallab
          POSTGRES_USER: evallab
          POSTGRES_PASSWORD: local-development-only
        ports:
          - 54329:5432
        options: >-
          --health-cmd "pg_isready -U evallab -d evallab"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install uv 0.9.24 from PyPI
        run: |
          python3 -m pip install --user uv==0.9.24
          echo "$HOME/.local/bin" >> $GITHUB_PATH
      - name: Install Python 3.12
        # HAR-330: same asset outage as the lint job. tools/mimoagent-harbor stays
        # pinned to 3.12 even on the 3.14 row, so both interpreters are provisioned.
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: |
            3.12
            3.12
      - run: |
          echo "UV_PYTHON=3.12" >> $GITHUB_ENV
          echo "UV_PYTHON_PREFERENCE=only-system" >> $GITHUB_ENV
      - name: Cache locked Python packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        env:
          SEGMENT_DOWNLOAD_TIMEOUT_MINS: 2
        with:
          path: ~/.cache/uv
          key: uv-0.9.24-${{ runner.os }}-${{ runner.arch }}-3.12-test-${{ hashFiles('uv.lock', 'tools/mimoagent-harbor/uv.lock', '.github/workflows/ci.yml') }}
      - name: Sync with benchmark, lance and inspect test dependencies (fastmcp, cryptography, lancedb, inspect-ai)
        run: uv sync --locked --no-group observability --group benchmarks --group lance --group inspect
      - name: Initialise live catalog schema
        # Beyond the fixtures' throwaway databases, some live tests (attach, verdicts,
        # dashboard queries) read the default catalog database, which is empty on a
        # fresh service container.
        env:
          DATABASE_URL: postgresql://evallab:local-development-only@localhost:54329/evallab
        run: uv run --no-sync evallab db init
      - name: Expose the runner PostgreSQL server binaries
        # The ubuntu runner image ships PostgreSQL under /usr/lib/postgresql/<major>/bin
        # but not on PATH, so the corpus-queue tests that need initdb and pg_ctl skip.
        run: |
          dir=$(ls -d /usr/lib/postgresql/*/bin | sort -V | tail -n 1)
          echo "$dir" >> "$GITHUB_PATH"
          "$dir/initdb" --version
      - name: Full test suite
        env:
          DATABASE_URL: postgresql://evallab:local-development-only@localhost:54329/evallab
          EVALLAB_RUN_POSTGRES_TESTS: "1"
        run: uv run --no-sync pytest --shard ${{ matrix.shard }} --junitxml=full-suite.xml
      - name: Full-suite skip reason census
        run: uv run --no-sync python scripts/ci/check_harbor_skips.py --report-only full-suite.xml
      - if: false
        run: uv run --no-sync python -m evallab.smoke --docker-free
      - name: Native Harbor diff, regrade and observability contracts
        run: |
          uv sync --locked --no-group observability --group benchmarks --group lance --extra laminar
          uv run --no-sync python -c 'import harbor.job_diff'
          # HAR-271: tools/mimoagent-harbor needs a 3.12 interpreter even on the
          # 3.14 matrix row; the worker tests spawn tools/mimoagent-harbor/.venv.
          uv sync --project tools/mimoagent-harbor --locked --python 3.12
          # The real RewardKit fixture uses Harbor v0.24.0 source, not its wheel.
          git init /tmp/harbor024/repo
          git -C /tmp/harbor024/repo remote add origin https://github.com/laude-institute/harbor.git
          git -C /tmp/harbor024/repo fetch --depth=1 origin b53b8134e1241686dca7759af188f987ecc48e8b
          git -C /tmp/harbor024/repo checkout --detach FETCH_HEAD
          # Every file listed here skips (or covers only its stubs) when Harbor is
          # absent, so the main pytest step cannot exercise it. HAR-260:
          # tests/test_quality_gates.py::test_every_harbor_gated_test_file_runs_in_the_native_harbor_step
          # fails when a Harbor-gated test file is missing from this list. `-rA`
          # puts every test's PASSED/SKIPPED status in the log: dots plus one
          # aggregate count cannot show that a gated file really ran.
          uv run --no-sync pytest --shard ${{ matrix.shard }} -n ${{ matrix.native_n }} -rA \
            --junitxml=harbor-native.xml \
            tests/test_job_diff.py tests/test_regrade.py \
            tests/test_harbor_laminar.py tests/test_mimoagent_worker.py \
            tests/test_mimoagent_stops.py tests/test_mimoagent_trajectory.py \
            tests/test_execution_contracts.py \
            tests/test_harbor_docker.py tests/test_harbor_modal.py tests/test_egress_lock.py \
            tests/test_ref_subset_modal.py tests/test_qa_task_modal.py tests/test_upstream_grader.py \
            tests/test_heldout_v7_native.py tests/test_phase2_native_generation.py \
            tests/test_candidate_runner.py tests/test_candidate_port.py \
            tests/test_harbor_host_isolation.py tests/test_host_isolation_compose.py \
            tests/test_agent_network_policy.py \
            tests/test_cloud_trace_export.py tests/test_harbor_analyze_reader.py \
            tests/test_heldout_v7_rounds.py tests/test_campaign_execution.py \
            tests/test_mimoagent_clean_options.py tests/test_harbor024_agent_kwargs.py \
            tests/test_task_workbench.py tests/test_tb4_fingerprints.py \
            tests/test_harbor_daytona.py tests/test_integrity_reward.py
          uv run --no-sync python scripts/ci/check_harbor_skips.py harbor-native.xml

