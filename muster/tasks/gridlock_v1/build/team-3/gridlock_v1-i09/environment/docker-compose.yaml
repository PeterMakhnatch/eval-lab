x-seat: &seat
  build: ./seat
  user: agent
  working_dir: /home/agent
  command: ["sleep", "infinity"]
  init: true
  depends_on:
    main:
      condition: service_healthy

services:
  main:
    command: ["python3", "/world/world.py"]
    environment:
      SEAT_TOKENS: "{\"26c28162d8b49374757fd0493564027a\": \"p2\", \"62097f36adf322d3289fa27af32d885c\": \"p1\", \"cf9cc9ded13144aa25d468b39e89566a\": \"p3\"}"
    networks:
      p1-world:
        aliases: [world]
      p2-world:
        aliases: [world]
      p3-world:
        aliases: [world]
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health', timeout=2)"]
      interval: 2s
      timeout: 5s
      retries: 15
      start_period: 2s
  p1:
    <<: *seat
    networks: [p1-world]
    environment:
      SEAT: "p1"
      SEAT_TOKEN: "62097f36adf322d3289fa27af32d885c"
      WORLD: "http://world:8080"
  p2:
    <<: *seat
    networks: [p2-world]
    environment:
      SEAT: "p2"
      SEAT_TOKEN: "26c28162d8b49374757fd0493564027a"
      WORLD: "http://world:8080"
  p3:
    <<: *seat
    networks: [p3-world]
    environment:
      SEAT: "p3"
      SEAT_TOKEN: "cf9cc9ded13144aa25d468b39e89566a"
      WORLD: "http://world:8080"

networks:
  p1-world:
    internal: true
    enable_ipv4: false
    enable_ipv6: true
  p2-world:
    internal: true
    enable_ipv4: false
    enable_ipv6: true
  p3-world:
    internal: true
    enable_ipv4: false
    enable_ipv6: true
