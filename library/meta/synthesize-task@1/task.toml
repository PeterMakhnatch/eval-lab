schema_version = "1.4"
artifacts = [
    "/app/output/task",
]

[task]
name = "local-lab/synthesize-task"
version = "1.0.0"
description = "Synthesize an evaluation task package from specification, skeleton, and exemplar"
keywords = ["meta-task", "authoring", "task-synthesis", "pytest", "separate-verifier"]

[[task.authors]]
name = "Peter Makhnatch"
email = "p.makhnatch@gmail.com"

[metadata]
difficulty = "medium"
category = "meta"
tags = ["meta-task", "synthesis", "authoring"]

[verifier]
timeout_sec = 60.0
environment_mode = "separate"
collect = []

[agent]
timeout_sec = 180.0

[environment]
network_mode = "public"
build_timeout_sec = 300.0
os = "linux"
cpus = 1
memory_mb = 512
storage_mb = 2048
mcp_servers = []
