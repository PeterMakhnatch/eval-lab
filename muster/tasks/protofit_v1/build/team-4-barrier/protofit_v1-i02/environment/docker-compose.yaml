x-seat: &seat
  user: agent
  working_dir: /home/agent
  command: ["sleep", "infinity"]
  init: true
  depends_on:
    main:
      condition: service_healthy

services:
  main:
    command: ["python3", "/world/world.py"]
    environment:
      SEAT_TOKENS: "{\"0a12ec6a531e68d63cc16ebc50777b0c\": \"p1\", \"98bf70f9af91e2dbd2eb24d7d8934f85\": \"p3\", \"bf2ed2210b503e80952b9353e774e762\": \"p4\", \"bffaba4a96a1c56f6f221b10cf345e5a\": \"p2\"}"
    networks:
      p1-world:
        aliases: [world]
      p2-world:
        aliases: [world]
      p3-world:
        aliases: [world]
      p4-world:
        aliases: [world]
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health', timeout=2)"]
      interval: 2s
      timeout: 5s
      retries: 15
      start_period: 2s
  p1:
    <<: *seat
    build: ./seat_p1
    networks: [p1-world]
    environment:
      SEAT: "p1"
      SEAT_TOKEN: "0a12ec6a531e68d63cc16ebc50777b0c"
      WORLD: "http://world:8080"
  p2:
    <<: *seat
    build: ./seat_p2
    networks: [p2-world]
    environment:
      SEAT: "p2"
      SEAT_TOKEN: "bffaba4a96a1c56f6f221b10cf345e5a"
      WORLD: "http://world:8080"
  p3:
    <<: *seat
    build: ./seat_p3
    networks: [p3-world]
    environment:
      SEAT: "p3"
      SEAT_TOKEN: "98bf70f9af91e2dbd2eb24d7d8934f85"
      WORLD: "http://world:8080"
  p4:
    <<: *seat
    build: ./seat_p4
    networks: [p4-world]
    environment:
      SEAT: "p4"
      SEAT_TOKEN: "bf2ed2210b503e80952b9353e774e762"
      WORLD: "http://world:8080"

networks:
  p1-world:
    internal: true
    enable_ipv4: false
    enable_ipv6: true
  p2-world:
    internal: true
    enable_ipv4: false
    enable_ipv6: true
  p3-world:
    internal: true
    enable_ipv4: false
    enable_ipv6: true
  p4-world:
    internal: true
    enable_ipv4: false
    enable_ipv6: true
