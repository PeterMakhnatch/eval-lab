[common]
REGISTER = '''- `GET /register`: the shared register: at most @SLOTS@ lines, 1 line for each key. There are enough lines for a register from which every clerk can answer each of its questions right. Each line has its status, its `at` and the clerk who wrote it last. The reply also has the number of free lines, the phase, and the `version` of the register. The version goes up by 1 with each change of the register. Every clerk can read the register.
'''
WRITING = '''

## Writing phase

- `POST /put` with `{"key": "<site or zone>", "status": "<status>", "at": <n>}` writes the register line of that key. It replaces the line of that key if there is one, whoever wrote it and whatever its time. The entry must be one of your own reports. 1 other form is allowed: the status `disputed` with the key and the `at` of one of your own site reports. A new key needs a free line: when the register is full the reply has status 409 and nothing changes. You can make @PUTS@ puts. Each put that is not refused uses 1, also when it writes a line that is already there. A put that is refused uses none.
- `POST /drop` with `{"key": "<site or zone>"}` removes a line that you wrote last. You cannot remove a line that another clerk wrote last.
- `POST /ready` with `{"version": <n>}` says that you are done with the register as it is at version `<n>`. If the register has another version by then, the reply has status 409 and the current version. Each change of the register removes the ready mark of every clerk. The writing phase ends when every clerk is ready at the same version. When the ready is accepted, the reply says if the writing phase has ended, and if not, which clerks are not ready.
- If you stop before the writing phase ends, you cannot answer your questions.
- After the writing phase the register cannot change.
'''

[probe]
TEAM = "Clerks @OTHERS@ also work on this survey."
PHASES = "The team keeps 1 shared register. The work has 2 phases: first the writing phase, then the answering phase. Nobody sees a question before the answering phase."
RULESLINES = ", the number of register lines"
ASKS = "The list is empty in the writing phase."
FROM = " and the lines of the register"
SCORE = "The team is scored on the questions of every clerk."

[reader]
TEAM = "Clerks @OTHERS@ also work on this survey."
PHASES = "The team keeps 1 shared register. The writing phase is over: a clerk who had your seat before you wrote your part of the register. The register cannot change. With your own reports, it is enough to answer each of your questions right."
RULESLINES = ", the number of register lines"
ASKS = ""
FROM = " and the lines of the register"
SCORE = "The team is scored on the questions of every clerk."

