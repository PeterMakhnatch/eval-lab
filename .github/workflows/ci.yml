name: quality

on:
  pull_request:
    # Include retargeting: stacked PRs may change base without a new head commit.
    types: [opened, synchronize, reopened, edited]
  merge_group:
    types: [checks_requested]
  push:
    branches: [main, "integrate/**"]
  workflow_dispatch:

permissions:
  contents: read

# cancel-in-progress stays false even for pull_request: this workflow publishes
# `quality-required`, whose gate fails whenever `lint` or `test` is cancelled
# (agents/CHECKS.md), so cancelling a run publishes a failed required check for
# a commit whose verdict a sibling run is still producing (HAR-232). The group
# keys non-PR runs by run_id so every main push run keeps its own group and is
# never replaced (HAR-234); PR runs share one group per pull request, where
# GitHub may only replace a pending, superseded run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: false

env:
  # uv retries index HTTP requests 3 times by default; a single PyPI blip must
  # not fail a sync (HAR-252, mcp-wheelhouse-platform run 41387496649).
  UV_HTTP_RETRIES: "5"

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install uv 0.9.24 from PyPI
        run: |
          python3 -m pip install --user uv==0.9.24
          echo "$HOME/.local/bin" >> $GITHUB_PATH
      - name: Install Python 3.12
        run: |
          uv python install 3.12
          echo "UV_PYTHON=3.12" >> $GITHUB_ENV
      - name: Cache locked Python packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        env:
          SEGMENT_DOWNLOAD_TIMEOUT_MINS: 2
        with:
          path: ~/.cache/uv
          key: uv-0.9.24-${{ runner.os }}-${{ runner.arch }}-3.12-lint-${{ hashFiles('uv.lock', '.github/workflows/ci.yml') }}
          restore-keys: uv-0.9.24-${{ runner.os }}-${{ runner.arch }}-3.12-test-${{ hashFiles('uv.lock', '.github/workflows/ci.yml') }}
      - run: uv sync --locked --no-group observability
      - run: uv run --no-sync ruff check .
      - name: Documentation front-matter and index freshness
        run: uv run --no-sync python -m evallab.docindex check
      - name: Repository map freshness
        run: uv run --no-sync python -m evallab.repomap check
      - name: Governance contracts and frozen root
        run: uv run --no-sync python -m evallab.governance check
      - name: Clean-checkout task registry and inventory audit
        run: uv run --no-sync evallab registry audit --json
      - name: Statistical lessons freshness and lineage
        run: uv run --no-sync python -m evallab.lessons

  test:
    runs-on: ubuntu-latest
    # HAR-260 added the Harbor-gated suites the main step could only skip, so the
    # native step now runs 33 files instead of 20. On run 41421757708 the job took
    # 6.3-7.3 min against the old 10 min cap; the wider cap keeps a hang bounded
    # without cutting a slower Python or runner off mid-suite.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.14"]
        shard: ["1/2", "2/2"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install uv 0.9.24 from PyPI
        run: |
          python3 -m pip install --user uv==0.9.24
          echo "$HOME/.local/bin" >> $GITHUB_PATH
      - name: Install Python ${{ matrix.python-version }}
        run: |
          uv python install ${{ matrix.python-version }}
          echo "UV_PYTHON=${{ matrix.python-version }}" >> $GITHUB_ENV
      - name: Cache locked Python packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        env:
          SEGMENT_DOWNLOAD_TIMEOUT_MINS: 2
        with:
          path: ~/.cache/uv
          key: uv-0.9.24-${{ runner.os }}-${{ runner.arch }}-${{ matrix.python-version }}-test-${{ hashFiles('uv.lock', '.github/workflows/ci.yml') }}
      - name: Sync with benchmark and lance test dependencies (fastmcp, cryptography, lancedb)
        run: uv sync --locked --no-group observability --group benchmarks --group lance
      - name: Full test suite
        run: uv run --no-sync pytest --shard ${{ matrix.shard }}
      - if: matrix.python-version == '3.12' && matrix.shard == '1/2'
        run: uv run --no-sync python -m evallab.smoke --docker-free
      - name: Native Harbor diff, regrade and observability contracts
        run: |
          uv sync --locked --no-group observability --group benchmarks --group lance --extra laminar
          uv run --no-sync python -c 'import harbor.job_diff'
          # Every file listed here skips (or covers only its stubs) when Harbor is
          # absent, so the main pytest step cannot exercise it. HAR-260:
          # tests/test_quality_gates.py::test_every_harbor_gated_test_file_runs_in_the_native_harbor_step
          # fails when a Harbor-gated test file is missing from this list.
          uv run --no-sync pytest --shard ${{ matrix.shard }} -n 0 -v \
            tests/test_job_diff.py tests/test_regrade.py \
            tests/test_harbor_laminar.py tests/test_mimoagent_worker.py \
            tests/test_mimoagent_stops.py tests/test_mimoagent_trajectory.py \
            tests/test_execution_contracts.py \
            tests/test_native_telemetry.py tests/test_credential_bridge.py \
            tests/test_harbor_docker.py tests/test_harbor_modal.py tests/test_egress_lock.py \
            tests/test_ref_subset_modal.py tests/test_qa_task_modal.py tests/test_upstream_grader.py \
            tests/test_heldout_v7_native.py tests/test_phase2_native_generation.py \
            tests/test_candidate_runner.py tests/test_candidate_port.py \
            tests/test_harbor_trace_inputs.py \
            tests/test_harbor_host_isolation.py tests/test_host_isolation_compose.py \
            tests/test_agent_network_policy.py \
            tests/test_cloud_trace_export.py tests/test_harbor_analyze_reader.py \
            tests/test_heldout_v7_rounds.py tests/test_campaign_execution.py \
            tests/test_mimoagent_clean_options.py tests/test_harbor024_agent_kwargs.py \
            tests/test_auditor_sft_data.py tests/test_antigravity_bridge.py \
            tests/test_task_workbench.py tests/test_tb4_fingerprints.py

  quality-required:
    name: quality-required
    needs: [lint, test]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 1
    permissions: {}
    steps:
      - name: Require successful quality jobs
        env:
          LINT_RESULT: ${{ needs.lint.result }}
          TEST_RESULT: ${{ needs.test.result }}
        run: |
          printf 'lint=%s test=%s\n' "$LINT_RESULT" "$TEST_RESULT"
          [[ "$LINT_RESULT" == success && "$TEST_RESULT" == success ]]
