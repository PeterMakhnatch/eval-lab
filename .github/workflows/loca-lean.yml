name: loca-lean

on:
  push:
    paths:
      - "library/benchmarks/loca-lean-v1/**"
      - ".github/workflows/loca-lean.yml"
  pull_request:
    paths:
      - "library/benchmarks/loca-lean-v1/**"
      - ".github/workflows/loca-lean.yml"

jobs:
  canary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Exercise lean LOCA contract
        run: python3 library/benchmarks/loca-lean-v1/ci_contract.py
      - name: Reject committed generated output
        run: |
          test -z "$(git ls-files 'library/benchmarks/loca-bench/tasks/*')"
          test -z "$(git ls-files 'library/benchmarks/loca-lean-v1/tasks/*')"
