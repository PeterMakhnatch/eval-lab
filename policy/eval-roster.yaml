# Historical eval selection snapshot recorded 2026-09-03, retained by PR364.
# Not current execution authorization, agent routing, or interactive model policy.
# The values below remain unchanged for provenance; do not copy them into live
# queue/canary settings merely to make the advisory roster comparison pass.
# Current selections require Peter's explicit approval and the existing policy
# gates. See agents/CONTEXT-HUB.md §7 for the reconciliation procedure.
version: 1
updated: 2026-09-03
updated_by: peter

# ── What runs the trials ──────────────────────────────────────────────────
trial:
  agent: zai-opencode
  model: zai/glm-5.3-flash
  harness: harbor
  harness_path: ~/Developer/agent-evals/harbor

# ── What simulates the user & verifies (τ-style benchmarks) ───────────────
simulator:
  provider: zai-coding-plan
  base_url: https://api.z.ai/api/coding/paas/v4
  model: glm-5.3-flash
  note: >
    τ³ reward is partly LLM-judged. Pin the assertion model identity with the
    trial record; never compare across different assertion models.

# ── What we evaluate on ───────────────────────────────────────────────────
benchmark:
  primary: sierra-research/tau3-bench
  primary_path: ~/Developer/agent-evals/harbor/adapters/tau3-bench/
  registry: harbor-hub

# ── Historical trial exclusions (not current provider availability) ──────────
banned_for_trials:
  - codex        # credits=0, hard-stop lockout at window exhaustion
  - deepseek     # balance 0 since 2026-08-31
  - cursor-cli   # no quota snapshots, unverifiable allowance

# ── Free local controls (never billable) ──────────────────────────────────
free_controls: [oracle, nop]
