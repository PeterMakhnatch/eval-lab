x-seat: &seat
  build: ./seat
  user: agent
  working_dir: /home/agent
  command: ["sleep", "infinity"]
  init: true
  depends_on:
    main:
      condition: service_healthy

services:
  main:
    command: ["python3", "/world/world.py"]
    environment:
      SEAT_TOKENS: "{\"8c1d433142144b768badc1392c0fa7b3\": \"verifier\", \"ab86f1265c638bafd4e918fbfc0aeaf2\": \"planner\", \"c0f9606eb2bca881e5122e88af9f3715\": \"builder\"}"
    networks:
      planner-world:
        aliases: [world]
      builder-world:
        aliases: [world]
      verifier-world:
        aliases: [world]
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health', timeout=2)"]
      interval: 2s
      timeout: 5s
      retries: 15
      start_period: 2s
  planner:
    <<: *seat
    networks: [planner-world]
    environment:
      SEAT: "planner"
      SEAT_TOKEN: "ab86f1265c638bafd4e918fbfc0aeaf2"
      WORLD: "http://world:8080"
  builder:
    <<: *seat
    networks: [builder-world]
    environment:
      SEAT: "builder"
      SEAT_TOKEN: "c0f9606eb2bca881e5122e88af9f3715"
      WORLD: "http://world:8080"
  verifier:
    <<: *seat
    networks: [verifier-world]
    environment:
      SEAT: "verifier"
      SEAT_TOKEN: "8c1d433142144b768badc1392c0fa7b3"
      WORLD: "http://world:8080"

networks:
  planner-world:
    internal: true
    enable_ipv4: false
    enable_ipv6: true
  builder-world:
    internal: true
    enable_ipv4: false
    enable_ipv6: true
  verifier-world:
    internal: true
    enable_ipv4: false
    enable_ipv6: true
