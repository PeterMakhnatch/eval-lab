x-seat: &seat
  build: ./seat
  user: agent
  working_dir: /home/agent
  command: ["sleep", "infinity"]
  init: true
  depends_on:
    main:
      condition: service_healthy

services:
  main:
    command: ["python3", "/world/world.py"]
    environment:
      SEAT_TOKENS: "{\"6af1db2e6b0589c28e00a597fca4297e\": \"p1\", \"b7b53f9e99ca8109e3f4a0d01f7ccfe5\": \"p3\", \"d0fb729adfccb42668b5b9983aabaca7\": \"p2\"}"
    networks:
      p1-world:
        aliases: [world]
      p2-world:
        aliases: [world]
      p3-world:
        aliases: [world]
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health', timeout=2)"]
      interval: 2s
      timeout: 5s
      retries: 15
      start_period: 2s
  p1:
    <<: *seat
    networks: [p1-world]
    environment:
      SEAT: "p1"
      SEAT_TOKEN: "6af1db2e6b0589c28e00a597fca4297e"
      WORLD: "http://world:8080"
  p2:
    <<: *seat
    networks: [p2-world]
    environment:
      SEAT: "p2"
      SEAT_TOKEN: "d0fb729adfccb42668b5b9983aabaca7"
      WORLD: "http://world:8080"
  p3:
    <<: *seat
    networks: [p3-world]
    environment:
      SEAT: "p3"
      SEAT_TOKEN: "b7b53f9e99ca8109e3f4a0d01f7ccfe5"
      WORLD: "http://world:8080"

networks:
  p1-world:
    internal: true
    enable_ipv4: false
    enable_ipv6: true
  p2-world:
    internal: true
    enable_ipv4: false
    enable_ipv6: true
  p3-world:
    internal: true
    enable_ipv4: false
    enable_ipv6: true
