x-seat: &seat
  build: ./seat
  user: agent
  working_dir: /home/agent
  command: ["sleep", "infinity"]
  init: true
  depends_on:
    main:
      condition: service_healthy

services:
  main:
    command: ["python3", "/world/world.py"]
    environment:
      SEAT_TOKENS: "{\"0109aed6323a0685fa6b006d7059c141\": \"acct_b\", \"cc5b923d29f715235a1399a5eb08ac18\": \"auditor\", \"e9a1b16efbdacd580035e8328063a1c4\": \"acct_a\"}"
    networks:
      acct_a-world:
        aliases: [world]
      acct_b-world:
        aliases: [world]
      auditor-world:
        aliases: [world]
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health', timeout=2)"]
      interval: 2s
      timeout: 5s
      retries: 15
      start_period: 2s
  acct_a:
    <<: *seat
    networks: [acct_a-world]
    environment:
      SEAT: "acct_a"
      SEAT_TOKEN: "e9a1b16efbdacd580035e8328063a1c4"
      WORLD: "http://world:8080"
  acct_b:
    <<: *seat
    networks: [acct_b-world]
    environment:
      SEAT: "acct_b"
      SEAT_TOKEN: "0109aed6323a0685fa6b006d7059c141"
      WORLD: "http://world:8080"
  auditor:
    <<: *seat
    networks: [auditor-world]
    environment:
      SEAT: "auditor"
      SEAT_TOKEN: "cc5b923d29f715235a1399a5eb08ac18"
      WORLD: "http://world:8080"

networks:
  acct_a-world:
    internal: true
    enable_ipv4: false
    enable_ipv6: true
  acct_b-world:
    internal: true
    enable_ipv4: false
    enable_ipv6: true
  auditor-world:
    internal: true
    enable_ipv4: false
    enable_ipv6: true
