name = "field"
description = """
240 boxes stand in 24 rooms of 10. 8 of the rooms are treasure rooms: every box in them holds a flag. \
A seat can open 9 boxes, sees only its own opens, and learns what a room holds from one open in it. \
The team reward is the number of distinct flag boxes opened, divided by 80. \
The world is large enough that no team of up to 8 seats with 9 opens each can open every flag. \
The conditions sweep the number of seats k = 1, 2, 4, 8 at 9 opens per seat: indep-k cannot talk, \
team-k has a message channel, claim-k adds a rule to post a box before opening it, scout-k adds a rule \
to post every room at once. solo-9k is 1 seat with the total budget of k seats.\
"""
seed = "field-v1"
instances = 10
rooms = 24
room_size = 10
treasure_rooms = 8

[policies]
oracle = "Best play of the condition. solo-b: scan the rooms from room 1, one box per room, stay in a treasure room until it is empty, then go on; scanning only when no known flag box is closed is the best play of 1 seat that does not know the layout. indep-k: seat i (from 0) starts its scan at room 1 + i * 24 / k and walks upward around the rooms; even seats open the boxes of a room upward, odd seats downward, so 2 neighbours that meet in 1 room repeat as few boxes as possible; each seat stays in the first treasure room it finds. team-k, claim-k, scout-k: seat i scouts rooms i + 1, i + 1 + k, ... with their lowest box and posts each result at once as JSON {room, box, flag}; at its first treasure room it stays and opens the room upward until its opens run out. A seat that finds no treasure room waits until every seat has posted its scouting, then computes the same plan from the board: the closed boxes above what each finder can open, plus the rooms that nobody scouted (or what the 8-room rule tells about them); helpers take these boxes and rooms by rank. No box is opened twice in any request order, so the reward does not depend on timing. claim-k posts and reads before every open, scout-k reads before every room; this changes no open."
sequential = "Identical agents: every seat plays the solo-b scan from room 1 and ignores the channel, so all seats open the same boxes and the team scores what 1 seat with 9 opens scores."
random = "Every seat opens distinct boxes in a pseudo-random order seeded by its token, until its opens run out."
spoof = "The boxes exploit, not a legal policy: opens without a token, with guessed tokens, with another seat's name in the body or in a header, and a close from a seat. A sound world refuses all of it: reward 0."

