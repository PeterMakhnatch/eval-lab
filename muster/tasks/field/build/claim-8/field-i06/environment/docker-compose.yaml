x-seat: &seat
  build: ./seat
  user: agent
  working_dir: /home/agent
  command: ["sleep", "infinity"]
  init: true
  depends_on:
    main:
      condition: service_healthy

services:
  main:
    command: ["python3", "/world/world.py"]
    environment:
      SEAT_TOKENS: "{\"2b4efe46790154b63b82dd44070c2e01\": \"p3\", \"493efd991af93654d240d7b7f1e52024\": \"p5\", \"6c8706910218c8d792f900effd67887a\": \"p1\", \"752a79f3a5af4909751b44988f5751fd\": \"p6\", \"9ab2e73a3d8675d80ddbf09eb9f93fb1\": \"p2\", \"a9b1fdef33de5384f6d75f302e8bffeb\": \"p4\", \"c0202ca9cd129488d787f891f349cdf5\": \"p8\", \"dc1e7718766d1add88e7280241da2918\": \"p7\"}"
    networks:
      p1-world:
        aliases: [world]
      p2-world:
        aliases: [world]
      p3-world:
        aliases: [world]
      p4-world:
        aliases: [world]
      p5-world:
        aliases: [world]
      p6-world:
        aliases: [world]
      p7-world:
        aliases: [world]
      p8-world:
        aliases: [world]
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health', timeout=2)"]
      interval: 2s
      timeout: 5s
      retries: 15
      start_period: 2s
  p1:
    <<: *seat
    networks: [p1-world]
    environment:
      SEAT: "p1"
      SEAT_TOKEN: "6c8706910218c8d792f900effd67887a"
      WORLD: "http://world:8080"
  p2:
    <<: *seat
    networks: [p2-world]
    environment:
      SEAT: "p2"
      SEAT_TOKEN: "9ab2e73a3d8675d80ddbf09eb9f93fb1"
      WORLD: "http://world:8080"
  p3:
    <<: *seat
    networks: [p3-world]
    environment:
      SEAT: "p3"
      SEAT_TOKEN: "2b4efe46790154b63b82dd44070c2e01"
      WORLD: "http://world:8080"
  p4:
    <<: *seat
    networks: [p4-world]
    environment:
      SEAT: "p4"
      SEAT_TOKEN: "a9b1fdef33de5384f6d75f302e8bffeb"
      WORLD: "http://world:8080"
  p5:
    <<: *seat
    networks: [p5-world]
    environment:
      SEAT: "p5"
      SEAT_TOKEN: "493efd991af93654d240d7b7f1e52024"
      WORLD: "http://world:8080"
  p6:
    <<: *seat
    networks: [p6-world]
    environment:
      SEAT: "p6"
      SEAT_TOKEN: "752a79f3a5af4909751b44988f5751fd"
      WORLD: "http://world:8080"
  p7:
    <<: *seat
    networks: [p7-world]
    environment:
      SEAT: "p7"
      SEAT_TOKEN: "dc1e7718766d1add88e7280241da2918"
      WORLD: "http://world:8080"
  p8:
    <<: *seat
    networks: [p8-world]
    environment:
      SEAT: "p8"
      SEAT_TOKEN: "c0202ca9cd129488d787f891f349cdf5"
      WORLD: "http://world:8080"

networks:
  p1-world:
    internal: true
    enable_ipv4: false
    enable_ipv6: true
  p2-world:
    internal: true
    enable_ipv4: false
    enable_ipv6: true
  p3-world:
    internal: true
    enable_ipv4: false
    enable_ipv6: true
  p4-world:
    internal: true
    enable_ipv4: false
    enable_ipv6: true
  p5-world:
    internal: true
    enable_ipv4: false
    enable_ipv6: true
  p6-world:
    internal: true
    enable_ipv4: false
    enable_ipv6: true
  p7-world:
    internal: true
    enable_ipv4: false
    enable_ipv6: true
  p8-world:
    internal: true
    enable_ipv4: false
    enable_ipv6: true
