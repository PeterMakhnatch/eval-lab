name: MCP Recovery Benchmark CI

on:
  pull_request:
    paths:
      - "library/benchmarks/mcp-recovery-v1/**"
      - "scripts/mcp_recovery/**"
      - "tests/test_mcp_recovery_v1.py"
      - ".github/workflows/mcp-recovery.yml"
  push:
    branches:
      - main
    paths:
      - "library/benchmarks/mcp-recovery-v1/**"
      - "scripts/mcp_recovery/**"
      - "tests/test_mcp_recovery_v1.py"
      - ".github/workflows/mcp-recovery.yml"

jobs:
  test-mcp-recovery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          pip install pytest pyyaml
      - name: Run CI Contract
        run: |
          python3 library/benchmarks/mcp-recovery-v1/ci_contract.py
      - name: Run Focused Tests
        run: |
          PYTHONPATH=src pytest tests/test_mcp_recovery_v1.py
      - name: Materialize and Plan Workbench Candidate
        run: |
          python3 library/benchmarks/mcp-recovery-v1/materialize.py --seed 42
          PYTHONPATH=src python3 -m evallab.task_workbench plan \
            --source-uri https://github.com/PeterMakhnatch/eval-lab \
            --source-ref local/mcp-recovery@1.0 \
            --license MIT \
            derived/harbor-tasks/mcp-recovery/*/*
