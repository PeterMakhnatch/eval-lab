name: quality

on:
  pull_request:
    # Include retargeting: stacked PRs may change base without a new head commit.
    types: [opened, synchronize, reopened, edited]
  merge_group:
    types: [checks_requested]
  push:
    branches: [main, "integrate/**"]
  workflow_dispatch:

permissions:
  contents: read

# cancel-in-progress stays false even for pull_request: this workflow publishes
# `quality-required`, whose gate fails whenever `lint` or `test` is cancelled
# (agents/CHECKS.md), so cancelling a run publishes a failed required check for
# a commit whose verdict a sibling run is still producing (HAR-232). The group
# keys non-PR runs by run_id so every main push run keeps its own group and is
# never replaced (HAR-234); PR runs share one group per pull request, where
# GitHub may only replace a pending, superseded run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: false

env:
  # uv retries index HTTP requests 3 times by default; a single PyPI blip must
  # not fail a sync (HAR-252, mcp-wheelhouse-platform run 41387496649).
  UV_HTTP_RETRIES: "5"

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install uv 0.9.24 from PyPI
        run: |
          python3 -m pip install --user uv==0.9.24
          echo "$HOME/.local/bin" >> $GITHUB_PATH
      - name: Install Python 3.12
        # HAR-330: GitHub began serving 504 for the cpython-3.12.12+20251217
        # linux x86_64 python-build-standalone asset, so uv's managed
        # interpreter download failed both 1/2 test shards on run 42567901536.
        # setup-python resolves the runner toolcache before any download;
        # only-system makes a missing interpreter fail here instead of uv
        # downloading a managed build mid-run.
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - run: |
          echo "UV_PYTHON=3.12" >> $GITHUB_ENV
          echo "UV_PYTHON_PREFERENCE=only-system" >> $GITHUB_ENV
      - name: Cache locked Python packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        env:
          SEGMENT_DOWNLOAD_TIMEOUT_MINS: 2
        with:
          path: ~/.cache/uv
          key: uv-0.9.24-${{ runner.os }}-${{ runner.arch }}-3.12-lint-${{ hashFiles('uv.lock', '.github/workflows/ci.yml') }}
          restore-keys: uv-0.9.24-${{ runner.os }}-${{ runner.arch }}-3.12-test-${{ hashFiles('uv.lock', '.github/workflows/ci.yml') }}
      - run: uv sync --locked --no-group observability
      - run: uv run --no-sync ruff check .
      - name: Governance contracts and frozen root
        run: uv run --no-sync python -m evallab.governance check
      - name: Clean-checkout task registry and inventory audit
        run: uv run --no-sync evallab registry audit --json
      - name: Statistical lessons freshness and lineage
        run: uv run --no-sync python -m evallab.lessons
      - name: Explain private line replay availability (not a gate result)
        run: |
          if [ ! -d "$HOME/Developer/eval-lab-results/line/replay-v1" ]; then
            echo "line gate: replay data unavailable, run locally" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "line gate: exact-head local pre-merge receipt required; CI does not run the private gate" | tee -a "$GITHUB_STEP_SUMMARY"
          fi

  test:
    runs-on: ubuntu-latest
    # Discover every test once per shard with the native dependencies installed.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.14"]
        shard: ["1/2", "2/2"]
    # HAR-297: the catalog, verdict and z2-table suites run only against a live
    # database; without this service they skip on every CI run. Files are sharded
    # by path hash, so every matrix row needs its own service container.
    services:
      postgres:
        image: postgres:18.4-alpine3.24
        env:
          POSTGRES_DB: evallab
          POSTGRES_USER: evallab
          POSTGRES_PASSWORD: local-development-only
        ports:
          - 54329:5432
        options: >-
          --health-cmd "pg_isready -U evallab -d evallab"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install uv 0.9.24 from PyPI
        run: |
          python3 -m pip install --user uv==0.9.24
          echo "$HOME/.local/bin" >> $GITHUB_PATH
      - name: Install Python ${{ matrix.python-version }}
        # HAR-330: same asset outage as the lint job. tools/mimoagent-harbor stays
        # pinned to 3.12 even on the 3.14 row, so both interpreters are provisioned.
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: |
            ${{ matrix.python-version }}
            3.12
      - run: |
          echo "UV_PYTHON=${{ matrix.python-version }}" >> $GITHUB_ENV
          echo "UV_PYTHON_PREFERENCE=only-system" >> $GITHUB_ENV
      - name: Cache locked Python packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        env:
          SEGMENT_DOWNLOAD_TIMEOUT_MINS: 2
        with:
          path: ~/.cache/uv
          key: uv-0.9.24-${{ runner.os }}-${{ runner.arch }}-${{ matrix.python-version }}-test-${{ hashFiles('uv.lock', 'tools/mimoagent-harbor/uv.lock', '.github/workflows/ci.yml') }}
      - name: Prepare native tools before discovery
        run: |
          # The worker suites use this project's pinned Python 3.12 interpreter.
          uv sync --project tools/mimoagent-harbor --locked --python 3.12
          # The real RewardKit fixture needs the matching Harbor source tree.
          git init /tmp/harbor024/repo
          git -C /tmp/harbor024/repo remote add origin https://github.com/laude-institute/harbor.git
          git -C /tmp/harbor024/repo fetch --depth=1 origin b53b8134e1241686dca7759af188f987ecc48e8b
          git -C /tmp/harbor024/repo checkout --detach FETCH_HEAD
      - name: Sync native test dependencies
        run: |
          uv sync --locked --no-group observability --group benchmarks --group lance --group inspect --extra laminar
          uv run --no-sync python -c 'import harbor.job_diff'
      - name: Initialise live catalog schema
        # Beyond the fixtures' throwaway databases, some live tests (attach, verdicts,
        # dashboard queries) read the default catalog database, which is empty on a
        # fresh service container.
        env:
          DATABASE_URL: postgresql://evallab:local-development-only@localhost:54329/evallab
        run: uv run --no-sync evallab db init
      - name: Expose the runner PostgreSQL server binaries
        # The ubuntu runner image ships PostgreSQL under /usr/lib/postgresql/<major>/bin
        # but not on PATH, so the corpus-queue tests that need initdb and pg_ctl skip.
        run: |
          dir=$(ls -d /usr/lib/postgresql/*/bin | sort -V | tail -n 1)
          echo "$dir" >> "$GITHUB_PATH"
          "$dir/initdb" --version
      - name: Full test suite
        env:
          DATABASE_URL: postgresql://evallab:local-development-only@localhost:54329/evallab
          EVALLAB_RUN_POSTGRES_TESTS: "1"
        run: uv run --no-sync pytest --shard ${{ matrix.shard }} --junitxml=full-suite.xml
      - name: Full-suite skip reason census
        run: uv run --no-sync python scripts/ci/check_harbor_skips.py full-suite.xml
      - if: matrix.python-version == '3.12' && matrix.shard == '1/2'
        run: uv run --no-sync python -m evallab.smoke --docker-free

  quality-required:
    name: quality-required
    needs: [lint, test]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 1
    permissions: {}
    steps:
      - name: Require successful quality jobs
        env:
          LINT_RESULT: ${{ needs.lint.result }}
          TEST_RESULT: ${{ needs.test.result }}
        run: |
          printf 'lint=%s test=%s\n' "$LINT_RESULT" "$TEST_RESULT"
          [[ "$LINT_RESULT" == success && "$TEST_RESULT" == success ]]
