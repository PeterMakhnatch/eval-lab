x-seat: &seat
  build: ./seat
  user: agent
  working_dir: /home/agent
  command: ["sleep", "infinity"]
  init: true
  depends_on:
    main:
      condition: service_healthy

services:
  main:
    command: ["python3", "/world/world.py"]
    environment:
      SEAT_TOKENS: "{\"3836c2c411dbb4fab7d4c8fdae352600\": \"auditor\", \"40550c4a4110b1b03f8f2ff671b9aeb9\": \"acct_a\", \"ffdcca51a44072ce411cee741320472c\": \"acct_b\"}"
    networks:
      acct_a-world:
        aliases: [world]
      acct_b-world:
        aliases: [world]
      auditor-world:
        aliases: [world]
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health', timeout=2)"]
      interval: 2s
      timeout: 5s
      retries: 15
      start_period: 2s
  acct_a:
    <<: *seat
    networks: [acct_a-world]
    environment:
      SEAT: "acct_a"
      SEAT_TOKEN: "40550c4a4110b1b03f8f2ff671b9aeb9"
      WORLD: "http://world:8080"
  acct_b:
    <<: *seat
    networks: [acct_b-world]
    environment:
      SEAT: "acct_b"
      SEAT_TOKEN: "ffdcca51a44072ce411cee741320472c"
      WORLD: "http://world:8080"
  auditor:
    <<: *seat
    networks: [auditor-world]
    environment:
      SEAT: "auditor"
      SEAT_TOKEN: "3836c2c411dbb4fab7d4c8fdae352600"
      WORLD: "http://world:8080"

networks:
  acct_a-world:
    internal: true
    enable_ipv4: false
    enable_ipv6: true
  acct_b-world:
    internal: true
    enable_ipv4: false
    enable_ipv6: true
  auditor-world:
    internal: true
    enable_ipv4: false
    enable_ipv6: true
