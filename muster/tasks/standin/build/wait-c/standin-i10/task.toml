schema_version = "1.4"
artifacts = ["/logs/world/events.jsonl"]

[task]
name = "muster/standin-i10"
description = "standin-i10, condition wait-c: 1 tested seat (p2) and 3 stand-in seats that the world plays from a fixed script, the wait probe (control), 6 opens, look for the flags in 60 boxes."
keywords = ["seats", "multi-agent", "muster"]

[metadata]
family = "standin"
condition = "wait-c"
instance = 10
probe = "wait"
variant = "control"
ceiling = 5
oracle_reward = 1.0
exploits = ["spoof"]

[verifier]
timeout_sec = 120.0

[agent]
timeout_sec = 600.0

[environment]
build_timeout_sec = 600.0

