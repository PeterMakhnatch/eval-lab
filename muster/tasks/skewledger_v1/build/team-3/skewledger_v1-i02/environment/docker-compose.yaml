x-seat: &seat
  build: ./seat
  user: agent
  working_dir: /home/agent
  command: ["sleep", "infinity"]
  init: true
  depends_on:
    main:
      condition: service_healthy

services:
  main:
    command: ["python3", "/world/world.py"]
    environment:
      SEAT_TOKENS: "{\"5b453b41c77e76302ff09b06cc7f760b\": \"acct_a\", \"6bcecd87350b2354f6a253d184747d41\": \"acct_b\", \"c96f1883f711f9fd780bbe56b8caca03\": \"auditor\"}"
    networks:
      acct_a-world:
        aliases: [world]
      acct_b-world:
        aliases: [world]
      auditor-world:
        aliases: [world]
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health', timeout=2)"]
      interval: 2s
      timeout: 5s
      retries: 15
      start_period: 2s
  acct_a:
    <<: *seat
    networks: [acct_a-world]
    environment:
      SEAT: "acct_a"
      SEAT_TOKEN: "5b453b41c77e76302ff09b06cc7f760b"
      WORLD: "http://world:8080"
  acct_b:
    <<: *seat
    networks: [acct_b-world]
    environment:
      SEAT: "acct_b"
      SEAT_TOKEN: "6bcecd87350b2354f6a253d184747d41"
      WORLD: "http://world:8080"
  auditor:
    <<: *seat
    networks: [auditor-world]
    environment:
      SEAT: "auditor"
      SEAT_TOKEN: "c96f1883f711f9fd780bbe56b8caca03"
      WORLD: "http://world:8080"

networks:
  acct_a-world:
    internal: true
    enable_ipv4: false
    enable_ipv6: true
  acct_b-world:
    internal: true
    enable_ipv4: false
    enable_ipv6: true
  auditor-world:
    internal: true
    enable_ipv4: false
    enable_ipv6: true
