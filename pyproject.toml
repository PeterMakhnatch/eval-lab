[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "eval-lab"
version = "0.1.0"
description = "Evaluation research in real environments, using Harbor as the execution engine"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.5.5",
    "psycopg[binary]>=3.2,<4",
    "pyarrow>=25.0.1",
    "pydantic>=2.13.4",
    "pyyaml>=6.0.3",
]

[project.optional-dependencies]
verifier = [
    "llm-verifier>=0.2.0",
]

[project.scripts]
evallab = "evallab.cli:main"
harbor-lab = "evallab.cli:legacy_main"

[dependency-groups]
dev = [
    "pytest>=8.4,<9",
    "ruff>=0.12,<1",
    "hypothesis>=6.100,<7",
    "lancedb>=0.37,<1",
]
observability = [
    "harbor-atif2otel>=0.1.0",
    "opentelemetry-exporter-otlp>=1.38.0",
    "opentelemetry-proto>=1.38.0",
    "opentelemetry-sdk>=1.38.0",
    "openinference-instrumentation-dspy>=0.1.0",
    "openinference-instrumentation-litellm>=0.1.0",
]

[tool.uv]
default-groups = ["dev", "observability"]

[tool.hatch.build.targets.wheel]
packages = ["src/evallab"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = [
    "tests",
    "dashboard/tests",
    "research/analysis/tests",
    "research/calibration/tests",
    "research/experiments/tests",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [
    "library/adapters/*/generated",
    "library/tasks/terminal-bench-html-js-filter", "library/curated",
    "library/external/terminal-bench-v3.0.0",
    # Promoted evidence is a verbatim record of what an agent produced. Its
    # digests are pinned in each bundle's PROMOTION.json, so linting or
    # reformatting it would falsify the record rather than improve it.
    "research/evidence/runs",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"library/tasks/query-optimize/**" = ["B011", "B905"]
