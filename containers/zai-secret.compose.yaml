services:
  main:
    environment:
      ZAI_CODING_PLAN_API_KEY: ${EVALLAB_ZAI_PROXY_CAPABILITY:?proxy capability required}
      ZAI_API_KEY: ${EVALLAB_ZAI_PROXY_CAPABILITY:?proxy capability required}
      ZAI_BASE_URL: http://zai-secret-proxy:8080/api/paas/v4
      OPENAI_BASE_URL: http://zai-secret-proxy:8080/api/paas/v4
      OPENAI_API_BASE: http://zai-secret-proxy:8080/api/paas/v4
    depends_on:
      zai-secret-proxy:
        condition: service_healthy

  zai-secret-proxy:
    image: python:3.12.11-slim@sha256:47ae396f09c1303b8653019811a8498470603d7ffefc29cb07c88f1f8cb3d19f
    user: "${EVALLAB_PROXY_UID:?}:${EVALLAB_PROXY_GID:?}"
    command: ["python", "/opt/evallab/zai_secret_proxy.py"]
    networks:
      - default
      - workbench-internal
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
      EVALLAB_ZAI_SECRET_PATH: /run/secrets/evallab_zai_api_key
      EVALLAB_ZAI_UPSTREAM: ${EVALLAB_ZAI_UPSTREAM:-https://api.z.ai}
      EVALLAB_ZAI_PROXY_CAPABILITY: ${EVALLAB_ZAI_PROXY_CAPABILITY:?proxy capability required}
      EVALLAB_ZAI_ATTEMPT_ID: ${EVALLAB_ZAI_ATTEMPT_ID:?attempt identity required}
      EVALLAB_ZAI_USAGE_FILE: /run/evallab/zai-proxy-usage.json
      EVALLAB_ZAI_MAX_REQUESTS: ${EVALLAB_ZAI_MAX_REQUESTS:?request ceiling required}
      EVALLAB_ZAI_MAX_INPUT_TOKENS: ${EVALLAB_ZAI_MAX_INPUT_TOKENS:?input-token ceiling required}
      EVALLAB_ZAI_MAX_OUTPUT_TOKENS: ${EVALLAB_ZAI_MAX_OUTPUT_TOKENS:?output-token ceiling required}
      EVALLAB_ZAI_MAX_TOTAL_TOKENS: ${EVALLAB_ZAI_MAX_TOTAL_TOKENS:?total-token ceiling required}
      EVALLAB_ZAI_MAX_COST_MICROS: ${EVALLAB_ZAI_MAX_COST_MICROS:?cost ceiling required}
      EVALLAB_ZAI_INPUT_COST_MICROS_PER_MILLION: ${EVALLAB_ZAI_INPUT_COST_MICROS_PER_MILLION:?input pricing required}
      EVALLAB_ZAI_OUTPUT_COST_MICROS_PER_MILLION: ${EVALLAB_ZAI_OUTPUT_COST_MICROS_PER_MILLION:?output pricing required}
      EVALLAB_ZAI_CAPABILITY_EXPIRES_AT: ${EVALLAB_ZAI_CAPABILITY_EXPIRES_AT:?capability expiry required}
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    volumes:
      - "${EVALLAB_ZAI_PROXY_SCRIPT:?proxy script path required}:/opt/evallab/zai_secret_proxy.py:ro"
      - "${EVALLAB_ZAI_SECRET_FILE:?Z.ai secret file path required}:/run/secrets/evallab_zai_api_key:ro"
      - "${EVALLAB_ZAI_USAGE_DIR:?proxy usage directory required}:/run/evallab:rw"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=2)",
        ]
      interval: 2s
      timeout: 2s
      retries: 15
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

networks:
  workbench-internal:
    internal: true
