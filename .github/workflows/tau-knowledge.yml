name: tau-knowledge-lean

on:
  pull_request:
    branches: [main]
    paths:
      - "library/benchmarks/tau-knowledge/**"
      - "scripts/tau_knowledge/**"
      - "tests/test_tau_knowledge_lean.py"
      - "tests/test_task_workbench.py"
      - "src/evallab/task_workbench.py"
      - ".github/workflows/tau-knowledge.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  canary-controls:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Reject committed generated corpus
        run: |
          python3 -c 'import subprocess,sys; p=subprocess.check_output(["git","ls-files"],text=True).splitlines(); bad=[x for x in p if x.startswith(("library/benchmarks/tau-knowledge/generated/","library/benchmarks/tau-knowledge/evidence/trials/","library/benchmarks/tau-knowledge/evidence/luna/")) or (x.startswith("library/benchmarks/tau-knowledge/") and x.endswith(".parquet"))]; print("forbidden tracked paths:", bad); sys.exit(bool(bad))'
      - name: Install uv
        run: |
          python3 -m pip install --user uv==0.9.24
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          uv tool install "harbor==0.21.0"
      - name: Pin tau2 source and Harbor adapter
        run: |
          git clone --depth 1 --branch v1.0.1 https://github.com/sierra-research/tau2-bench.git "$RUNNER_TEMP/tau2-bench"
          git -C "$RUNNER_TEMP/tau2-bench" checkout fc0055dc4e0a316c3f83133267fbd6faaa770992
          git clone --filter=blob:none https://github.com/harbor-framework/harbor.git "$RUNNER_TEMP/harbor"
          git -C "$RUNNER_TEMP/harbor" checkout 636a2d0295d3ee233666bcd7d77fa81f7f090a19
      - name: Materialize canary and prove deterministic regeneration
        env:
          TAU2_BENCH_ROOT: ${{ runner.temp }}/tau2-bench
          TAU3_BENCH_ADAPTER_ROOT: ${{ runner.temp }}/harbor
        run: |
          mkdir -p derived/harbor-tasks/tau
          python3 scripts/tau_knowledge/materialize.py --task-id task_001 --output-root "$GITHUB_WORKSPACE/derived/harbor-tasks/tau" > "$RUNNER_TEMP/task-root.txt"
          task_root="$(cat "$RUNNER_TEMP/task-root.txt")"
          cp -a "$task_root" "$RUNNER_TEMP/tau-first"
          python3 scripts/tau_knowledge/materialize.py --task-id task_001 --output-root "$GITHUB_WORKSPACE/derived/harbor-tasks/tau" --overwrite > /dev/null
          diff -ru "$RUNNER_TEMP/tau-first" "$task_root"
          test -f "$task_root/tau3-banking_knowledge-task-001/task.toml"
          echo "TASK_PATH=$task_root/tau3-banking_knowledge-task-001" >> "$GITHUB_ENV"
      - name: Freeze workbench plan
        id: plan
        run: |
          set -euo pipefail
          mkdir -p artifacts/tau
          uv run python -m evallab.task_workbench plan "$TASK_PATH" \
            --source-uri "https://github.com/sierra-research/tau2-bench" \
            --source-ref "fc0055dc4e0a316c3f83133267fbd6faaa770992" \
            --license "MIT" \
            --zone "01-external" \
            --credential OPENAI_API_KEY \
            | tee artifacts/tau/plan.json
          candidate_id="$(jq -r '.candidate.candidate_id' artifacts/tau/plan.json)"
          test -n "$candidate_id"
          test "$candidate_id" != null
          echo "candidate_id=$candidate_id" >> "$GITHUB_OUTPUT"
      - name: Run complete workbench controls
        env:
          OPENAI_API_KEY: ci-unused-marker
          OPENAI_BASE_URL: http://127.0.0.1:9/v1
        run: |
          set -euo pipefail
          uv run python -m evallab.task_workbench check "$TASK_PATH" \
            --source-uri "https://github.com/sierra-research/tau2-bench" \
            --source-ref "fc0055dc4e0a316c3f83133267fbd6faaa770992" \
            --license "MIT" \
            --zone "01-external" \
            --credential OPENAI_API_KEY \
            --run-controls \
            | tee artifacts/tau/check.json
          test "$(jq -r '.disposition' artifacts/tau/check.json)" = "certified_for_review"
      - name: Write workbench certification packet
        env:
          CANDIDATE_ID: ${{ steps.plan.outputs.candidate_id }}
        run: |
          set -euo pipefail
          controls="runs/task-workbench/${CANDIDATE_ID}/controls.json"
          packet_root="research/registration/candidates/ci/${GITHUB_RUN_ID}/tau-task-001"
          test -s "$controls"
          uv run python -m evallab.task_workbench packet "$TASK_PATH" \
            --source-uri "https://github.com/sierra-research/tau2-bench" \
            --source-ref "fc0055dc4e0a316c3f83133267fbd6faaa770992" \
            --license "MIT" \
            --zone "01-external" \
            --credential OPENAI_API_KEY \
            --controls "$controls" \
            --output-root "$packet_root" \
            | tee artifacts/tau/packet.json
          test "$(jq -r '.disposition' artifacts/tau/packet.json)" = "certified_for_review"
      - name: Produce durable exact-task controls
        env:
          OPENAI_API_KEY: ci-unused-marker
          OPENAI_BASE_URL: http://127.0.0.1:9/v1
        run: |
          set -euo pipefail
          jobs="research/evidence/runs"
          task_dataset="$(dirname "$TASK_PATH")"
          task_name="$(basename "$TASK_PATH")"
          oracle_job="tau-task-001-registry-oracle-${GITHUB_RUN_ID}"
          nop_job="tau-task-001-registry-nop-${GITHUB_RUN_ID}"
          harbor run --path "$task_dataset" --include-task-name "$task_name" \
            --agent oracle --env docker --job-name "$oracle_job" --jobs-dir "$jobs" \
            --n-concurrent 1 --n-attempts 1 --yes
          harbor run --path "$task_dataset" --include-task-name "$task_name" \
            --agent nop --env docker --job-name "$nop_job" --jobs-dir "$jobs" \
            --n-concurrent 1 --n-attempts 1 --yes
          python3 scripts/agentabstain/assert_reward.py "$jobs/$oracle_job" 1
          python3 scripts/agentabstain/assert_reward.py "$jobs/$nop_job" 0
      - name: Upload review packet and retained evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: tau-task-001-workbench
          path: |
            artifacts/tau/
            runs/task-workbench/${{ steps.plan.outputs.candidate_id }}/controls.json
            runs/task-workbench/${{ steps.plan.outputs.candidate_id }}/jobs/
            research/registration/candidates/ci/${{ github.run_id }}/tau-task-001/
            research/evidence/runs/tau-task-001-registry-oracle-${{ github.run_id }}/
            research/evidence/runs/tau-task-001-registry-nop-${{ github.run_id }}/
          if-no-files-found: error
