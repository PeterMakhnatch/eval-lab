name: mcp-funcdag-v1

on:
  push:
    branches: [main]
    paths:
      - "library/benchmarks/mcp-funcdag-v1/**"
      - "scripts/mcp_funcdag/**"
      - "tests/test_mcp_funcdag_v1.py"
      - ".github/workflows/mcp-funcdag.yml"
  pull_request:
    branches: [main]
    paths:
      - "library/benchmarks/mcp-funcdag-v1/**"
      - "scripts/mcp_funcdag/**"
      - "tests/test_mcp_funcdag_v1.py"
      - ".github/workflows/mcp-funcdag.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  certify-workbench-and-controls:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Reject committed generated task corpus
        run: |
          python3 -c 'import subprocess, sys; p = subprocess.check_output(["git", "ls-files"], text=True).splitlines(); bad = [x for x in p if x.startswith(("derived/harbor-tasks/mcp-funcdag/", "library/benchmarks/mcp-funcdag-v1/derived/"))]; print("forbidden tracked paths:", bad); sys.exit(bool(bad))'
      - name: Install uv 0.9.24
        run: |
          python3 -m pip install --user uv==0.9.24
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Install Python 3.12
        run: |
          uv python install 3.12
          echo "UV_PYTHON=3.12" >> "$GITHUB_ENV"
      - name: Install Harbor 0.21.0
        run: uv tool install "harbor==0.21.0"
      - name: Run CI contract (regeneration, oracle, NOP, mutants)
        run: uv run python library/benchmarks/mcp-funcdag-v1/ci_contract.py
      - name: Run focused pytest suite
        run: uv run pytest tests/test_mcp_funcdag_v1.py -v
      - name: Materialize Campaign 0 calibration tasks
        run: |
          mkdir -p derived/harbor-tasks/mcp-funcdag
          uv run python library/benchmarks/mcp-funcdag-v1/materialize.py
      - name: Task workbench plan and check (baseline cell)
        id: workbench_plan
        run: |
          set -euo pipefail
          task_dir="$(find derived/harbor-tasks/mcp-funcdag -type d -name "mcp-funcdag-baseline-seed42" | head -n 1)"
          test -d "$task_dir"
          echo "task_dir=$task_dir" >> "$GITHUB_ENV"
          mkdir -p artifacts/workbench
          uv run python -m evallab.task_workbench plan "$task_dir" \
            --repo-root . \
            --source-uri "eval-lab/synthetic/mcp-funcdag-v1" \
            --source-ref "1.0.0" \
            --license "Apache-2.0" \
            --zone "03-synthetic" \
            | tee artifacts/workbench/plan.json
          candidate_id="$(jq -r '.candidate.candidate_id' artifacts/workbench/plan.json)"
          test "$candidate_id" != null
          echo "candidate_id=$candidate_id" >> "$GITHUB_OUTPUT"
      - name: Run fixed Harbor workbench controls
        env:
          CANDIDATE_ID: ${{ steps.workbench_plan.outputs.candidate_id }}
        run: |
          set -euo pipefail
          uv run python -m evallab.task_workbench check "$task_dir" \
            --repo-root . \
            --source-uri "eval-lab/synthetic/mcp-funcdag-v1" \
            --source-ref "1.0.0" \
            --license "Apache-2.0" \
            --zone "03-synthetic" \
            --run-controls \
            | tee artifacts/workbench/check.json
      - name: Write certification packet
        env:
          CANDIDATE_ID: ${{ steps.workbench_plan.outputs.candidate_id }}
        run: |
          set -euo pipefail
          controls="runs/task-workbench/${CANDIDATE_ID}/controls.json"
          packet_root="research/registration/candidates/ci/${GITHUB_RUN_ID}/mcp-funcdag"
          test -s "$controls"
          uv run python -m evallab.task_workbench packet "$task_dir" \
            --repo-root . \
            --source-uri "eval-lab/synthetic/mcp-funcdag-v1" \
            --source-ref "1.0.0" \
            --license "Apache-2.0" \
            --zone "03-synthetic" \
            --controls "$controls" \
            --output-root "$packet_root" \
            | tee artifacts/workbench/packet.json
          test "$(jq -r '.disposition' artifacts/workbench/packet.json)" = "certified_for_review"
      - name: Verify workbench control outputs
        env:
          CANDIDATE_ID: ${{ steps.workbench_plan.outputs.candidate_id }}
        run: |
          set -euo pipefail
          controls_file="runs/task-workbench/${CANDIDATE_ID}/controls.json"
          uv run python - <<PY
          import json
          data = json.loads(open("${controls_file}").read())
          for item in data.get("observations", []):
              cid = item.get("control_id")
              rew = item.get("reward")
              print(f"Workbench control {cid}: reward = {rew}")
              if "oracle" in cid:
                  assert rew == 1.0, f"Control {cid} reward != 1.0"
              elif "nop" in cid or "adversarial" in cid:
                  assert rew == 0.0, f"Control {cid} reward != 0.0"
          print("All workbench fixed controls verified with exact expected rewards.")
          PY
      - name: Run Harbor oracle and NOP trials on exact baseline task
        run: |
          set -euo pipefail
          harbor trial start -p "$task_dir" -a oracle --trials-dir /tmp/harbor-oracle-smoke
          harbor trial start -p "$task_dir" -a nop --trials-dir /tmp/harbor-nop-smoke
          uv run python - <<'PY'
          import json
          from pathlib import Path

          oracle_res = json.loads(next(Path("/tmp/harbor-oracle-smoke").glob("**/result.json")).read_text())
          assert oracle_res.get("reward") == 1.0 or oracle_res.get("rewards", {}).get("reward") == 1.0, f"Oracle reward != 1.0: {oracle_res}"
          nop_res = json.loads(next(Path("/tmp/harbor-nop-smoke").glob("**/result.json")).read_text())
          assert nop_res.get("reward") == 0.0 or nop_res.get("rewards", {}).get("reward") == 0.0, f"NOP reward != 0.0: {nop_res}"
          print("Durable Harbor oracle (1.0) and NOP (0.0) smoke assertions passed.")
          PY
      - name: Upload review packet and retained evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mcp-funcdag-workbench-evidence
          path: |
            artifacts/workbench/
            research/registration/candidates/ci/${{ github.run_id }}/
            runs/task-workbench/
            /tmp/harbor-*-smoke/
          if-no-files-found: ignore
