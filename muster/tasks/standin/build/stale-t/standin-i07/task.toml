description = "standin-i07, condition stale-t: 1 tested seat (p2) and 3 stand-in seats that the world plays from a fixed script, the stale probe (trap), 6 opens, look for the flags in 60 boxes."
keywords = ["seats", "multi-agent", "muster"]

