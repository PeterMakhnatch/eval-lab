x-seat: &seat
  build: ./seat
  user: agent
  working_dir: /home/agent
  command: ["sleep", "infinity"]
  init: true
  depends_on:
    main:
      condition: service_healthy

services:
  main:
    command: ["python3", "/world/world.py"]
    environment:
      SEAT_TOKENS: "{\"1b8ef0be650c3231f4e80fe4332ff8b9\": \"p6\", \"291143aa31eebdc1768c1428a17912cc\": \"p2\", \"2bcab0e5d7ec89c905ff9113f0f414fc\": \"p8\", \"708226718798618a65c01eefca3ece03\": \"p4\", \"a1a38ae92becee9107691cf6baec2147\": \"p7\", \"a8a83103fb897891a5f606a0ab93c59f\": \"p3\", \"eda01e419571aa69af17b4ca4309cec2\": \"p5\", \"f026d5de3c16c7aac03c7eb73757388f\": \"p1\"}"
    networks:
      p1-world:
        aliases: [world]
      p2-world:
        aliases: [world]
      p3-world:
        aliases: [world]
      p4-world:
        aliases: [world]
      p5-world:
        aliases: [world]
      p6-world:
        aliases: [world]
      p7-world:
        aliases: [world]
      p8-world:
        aliases: [world]
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health', timeout=2)"]
      interval: 2s
      timeout: 5s
      retries: 15
      start_period: 2s
  p1:
    <<: *seat
    networks: [p1-world]
    environment:
      SEAT: "p1"
      SEAT_TOKEN: "f026d5de3c16c7aac03c7eb73757388f"
      WORLD: "http://world:8080"
  p2:
    <<: *seat
    networks: [p2-world]
    environment:
      SEAT: "p2"
      SEAT_TOKEN: "291143aa31eebdc1768c1428a17912cc"
      WORLD: "http://world:8080"
  p3:
    <<: *seat
    networks: [p3-world]
    environment:
      SEAT: "p3"
      SEAT_TOKEN: "a8a83103fb897891a5f606a0ab93c59f"
      WORLD: "http://world:8080"
  p4:
    <<: *seat
    networks: [p4-world]
    environment:
      SEAT: "p4"
      SEAT_TOKEN: "708226718798618a65c01eefca3ece03"
      WORLD: "http://world:8080"
  p5:
    <<: *seat
    networks: [p5-world]
    environment:
      SEAT: "p5"
      SEAT_TOKEN: "eda01e419571aa69af17b4ca4309cec2"
      WORLD: "http://world:8080"
  p6:
    <<: *seat
    networks: [p6-world]
    environment:
      SEAT: "p6"
      SEAT_TOKEN: "1b8ef0be650c3231f4e80fe4332ff8b9"
      WORLD: "http://world:8080"
  p7:
    <<: *seat
    networks: [p7-world]
    environment:
      SEAT: "p7"
      SEAT_TOKEN: "a1a38ae92becee9107691cf6baec2147"
      WORLD: "http://world:8080"
  p8:
    <<: *seat
    networks: [p8-world]
    environment:
      SEAT: "p8"
      SEAT_TOKEN: "2bcab0e5d7ec89c905ff9113f0f414fc"
      WORLD: "http://world:8080"

networks:
  p1-world:
    internal: true
    enable_ipv4: false
    enable_ipv6: true
  p2-world:
    internal: true
    enable_ipv4: false
    enable_ipv6: true
  p3-world:
    internal: true
    enable_ipv4: false
    enable_ipv6: true
  p4-world:
    internal: true
    enable_ipv4: false
    enable_ipv6: true
  p5-world:
    internal: true
    enable_ipv4: false
    enable_ipv6: true
  p6-world:
    internal: true
    enable_ipv4: false
    enable_ipv6: true
  p7-world:
    internal: true
    enable_ipv4: false
    enable_ipv6: true
  p8-world:
    internal: true
    enable_ipv4: false
    enable_ipv6: true
