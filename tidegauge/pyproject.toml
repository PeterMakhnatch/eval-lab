[project]
name = "tidegauge"
version = "0.1.0"
description = "Honest numbers for Harbor runs: audit, error bars, paired comparison and run planning for Harbor job directories. Deterministic, no LLM, standard library only."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
authors = [{ name = "Peter Makhnatch" }]
keywords = ["harbor", "agents", "evals", "benchmarks", "statistics", "terminal-bench"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering",
  "Topic :: Software Development :: Testing",
]
dependencies = []

[project.scripts]
tidegauge = "tidegauge.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tidegauge"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
# E501: the formatter wraps code; long message strings stay on one line.
# RUF001: "×" in messages is intended. SIM905: the exception table reads better as text.
ignore = ["E501", "RUF001", "SIM905"]

[tool.ruff.lint.isort]
known-first-party = ["tidegauge"]
known-local-folder = ["harbor_fixture"]
