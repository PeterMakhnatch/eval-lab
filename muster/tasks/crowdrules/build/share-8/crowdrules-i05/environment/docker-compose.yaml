x-seat: &seat
  build: ./seat
  user: agent
  working_dir: /home/agent
  command: ["sleep", "infinity"]
  init: true
  depends_on:
    main:
      condition: service_healthy

services:
  main:
    command: ["python3", "/world/world.py"]
    environment:
      SEAT_TOKENS: "{\"2e6be1de1bbe8e5134369a8de2090b77\": \"p7\", \"518408108c0e09fe12535d9b851c88fc\": \"p8\", \"7f1c7bab67e52109f8811229e999a0d6\": \"p2\", \"82bf426f38243789e8db6169479d9321\": \"p3\", \"86b07a7b648ca4795c66bf0ea5761f2f\": \"p5\", \"b30ae2755c0f7322ca954ccddc1e2b03\": \"p4\", \"bb9ab43466853289df005200763a2461\": \"p6\", \"bbd55fd220427927cf30d409ae9673e1\": \"p1\"}"
    networks:
      p1-world:
        aliases: [world]
      p2-world:
        aliases: [world]
      p3-world:
        aliases: [world]
      p4-world:
        aliases: [world]
      p5-world:
        aliases: [world]
      p6-world:
        aliases: [world]
      p7-world:
        aliases: [world]
      p8-world:
        aliases: [world]
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health', timeout=2)"]
      interval: 2s
      timeout: 5s
      retries: 15
      start_period: 2s
  p1:
    <<: *seat
    networks: [p1-world]
    environment:
      SEAT: "p1"
      SEAT_TOKEN: "bbd55fd220427927cf30d409ae9673e1"
      WORLD: "http://world:8080"
  p2:
    <<: *seat
    networks: [p2-world]
    environment:
      SEAT: "p2"
      SEAT_TOKEN: "7f1c7bab67e52109f8811229e999a0d6"
      WORLD: "http://world:8080"
  p3:
    <<: *seat
    networks: [p3-world]
    environment:
      SEAT: "p3"
      SEAT_TOKEN: "82bf426f38243789e8db6169479d9321"
      WORLD: "http://world:8080"
  p4:
    <<: *seat
    networks: [p4-world]
    environment:
      SEAT: "p4"
      SEAT_TOKEN: "b30ae2755c0f7322ca954ccddc1e2b03"
      WORLD: "http://world:8080"
  p5:
    <<: *seat
    networks: [p5-world]
    environment:
      SEAT: "p5"
      SEAT_TOKEN: "86b07a7b648ca4795c66bf0ea5761f2f"
      WORLD: "http://world:8080"
  p6:
    <<: *seat
    networks: [p6-world]
    environment:
      SEAT: "p6"
      SEAT_TOKEN: "bb9ab43466853289df005200763a2461"
      WORLD: "http://world:8080"
  p7:
    <<: *seat
    networks: [p7-world]
    environment:
      SEAT: "p7"
      SEAT_TOKEN: "2e6be1de1bbe8e5134369a8de2090b77"
      WORLD: "http://world:8080"
  p8:
    <<: *seat
    networks: [p8-world]
    environment:
      SEAT: "p8"
      SEAT_TOKEN: "518408108c0e09fe12535d9b851c88fc"
      WORLD: "http://world:8080"

networks:
  p1-world:
    internal: true
    enable_ipv4: false
    enable_ipv6: true
  p2-world:
    internal: true
    enable_ipv4: false
    enable_ipv6: true
  p3-world:
    internal: true
    enable_ipv4: false
    enable_ipv6: true
  p4-world:
    internal: true
    enable_ipv4: false
    enable_ipv6: true
  p5-world:
    internal: true
    enable_ipv4: false
    enable_ipv6: true
  p6-world:
    internal: true
    enable_ipv4: false
    enable_ipv6: true
  p7-world:
    internal: true
    enable_ipv4: false
    enable_ipv6: true
  p8-world:
    internal: true
    enable_ipv4: false
    enable_ipv6: true
