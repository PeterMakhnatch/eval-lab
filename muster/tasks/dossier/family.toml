name = "dossier"
description = """
Clerks survey sites and keep a small shared register of reports.
The register freezes before the questions become visible.
The probe arm uses correct world-played clerks; the reader arm starts with a sufficient register.
The solo arm gives one clerk every report; the team arm uses concurrent clerks.
The committed card.json (muster card dossier --write) is the reference.
"""
seed = "dossier-v3.2"
instances = 10
facets = ["share", "scarce", "gone", "cascade", "dispute", "mix"]
arms = ["probe", "reader", "solo", "team"]
policies = ["oracle", "pooler", "hoarder", "idle"]
known_limits = [
    "It does not show that any model fails. Only a run can show that. `share`, `scarce` and `gone` are close to rule following and are the calibration floor; `dispute`, `cascade` and `mix` are where the prior work suggests lost points.",
    "It tests a structured store with given times. Free-text notes and long histories (what the handover papers study) need a real reader and are not in this version.",
    "A failure can have other causes than a missing team-memory behaviour: a wrong reading of the rule (the `solo` arm separates it), a reading mistake with a perfect register (the `reader` arm separates it), tool calls sent in 1 batch before any reply is read (the step join of `muster events` separates it).",
    "The world checks that a line is one of the writer's own reports. So the family cannot see a clerk that would invent evidence; it does not test honesty.",
    "Team closure needs every clerk to keep polling until writing closes. A delayed unconditional put can overwrite a newer line after another clerk stops. The card covers its explored schedules, not arbitrary starvation.",
]

[skills]
pool = "Store reports that decide watch-list sites."
select = "Keep keys that the watch list needs."
tombstone = "Store and read withdrawals."
cascade = "Store and apply zone closures."
dispute = "Store and read same-time conflicts."

[needs]
share = ["pool"]
scarce = ["pool", "select"]
gone = ["pool", "tombstone"]
cascade = ["pool", "cascade"]
dispute = ["pool", "dispute"]
mix = ["pool", "select", "tombstone", "cascade", "dispute"]
