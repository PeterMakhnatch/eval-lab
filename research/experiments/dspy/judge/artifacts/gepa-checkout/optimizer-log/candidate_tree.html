e.g., logs + deploys + metrics). A WRONG mechanism tied to specific\n   evidence across files can still count as grounded. A document that only\n   pastes raw logs/deploy rows under a heading WITHOUT tying a causal claim\n   across distinct evidence files is NOT grounded \u2014 answer no. Reserve \"no\"\n   for vague assertion with no specific cross-referenced citations (or pure\n   evidence dumps).\n\n2. causal_reasoning.identifies_the_mechanism: Answer yes only if the document\n   explicitly names the 32-workers vs 10-connection contention with 5000ms\n   acquire timeouts producing checkout 500s. Generic \"a change hit a limit\"\n   wording, or merely pasting raw log lines under a \"Root Cause\" heading\n   without stating the mechanism, is a no.\n\n3. causal_reasoning.rules_out_the_decoy: Answer yes only if the document\n   UNAMBIGUOUSLY and CONSISTENTLY rejects the payments vendor using concrete\n   evidence \u2014 timing (advisory began ~14:20, after the 500s started), flat\n   ~130ms latency, or successful (200) vendor calls \u2014 and preferably in the\n   document's own analytical voice. Merely noting the advisory happened is a\n   no. A chat log where an on-call first says \"probably them\" and later\n   retracts it is NOT a clean rejection: if the document leaves any hedging\n   or \"keeping the vendor theory\" line standing without an explicit, final\n   rejection backed by timing/latency/200 evidence, answer no. When the\n   rejection appears only inside pasted chat in a document that otherwise\n   never commits to ruling the vendor out, answer no.\n\n4. causal_reasoning.separates_contributing_factors: Answer yes when the\n   document has a contributing-factors list whose items are substantive and\n   DISTINCT from the causal claim itself \u2014 e.g., no pool alert, uncoupled\n   pool/worker sizing in review/CI, no canary, slow hypothesis discard,\n   restarts before rollback, no load-shed/admission control, missing capacity\n   planning, autoscaling off how pool saturation with recovery upon\n   rollback to 8 workers). Fabricated supporting evidence for a CORRECT\n   mechanism is judged under invents_evidence, not here.\n\n8. evidence_fidelity.misstates_a_fact: Answer yes if ANY supplied time,\n   count, version, config value, or metric reading is materially\n   contradicted \u2014 including misreading metric values. Example: reading\n   `checkout_requests` of ~1200/5min as a \"surge\" when that is the\n   pre-incident baseline materially misstates the evidence \u2014 answer yes.\n   Matching times (14:02 deploy, 14:09 page, 15:31 rollback, 15:38\n   mitigation) do not excuse a contradicted metric interpretation elsewhere.\n\n9. action_quality.actions_are_actionable: Answer yes when actions name\n   concrete changes with owners, targets, or objectively checkable completion\n   conditions (a startup assertion, an alert, a config flag, a specific\n   runbook edit all qualify even without named owners). Answer no when\n   actions are vague (\"tighten the wording\", a config listing that \"should be\n   reviewed\") with no checkable condition anywhere. If Corrective Actions is\n   \"TBD\", missing, or only a configuration listing, answer no for every\n   positive action criterion (actions_are_actionable, actions_trace_to_findings,\n   closes_the_detection_gap, fixes_the_capacity_coupling).\n\n10. action_quality.actions_trace_to_findings: Answer yes only when\n    substantive actions address causes or contributing factors actually\n    established earlier IN THE DOCUMENT (even if that cause is wrong \u2014 the\n    trace is internal consistency). If no substantive findings/actions exist,\n    or actions connect only to generic filler, answer no.\n\n11. action_quality.closes_the_detection_gap: Answer yes ONLY if an action\n    concretely names detection of pool saturation or connection-acquire wait\n    (e.g., \"Alert on pool saturation and acquire wait\", or alerting on\n    `db_pool_wait_p99_ms`). Merely importing a generic or invented monitor\n    ID, or adding a dashboard screenshot, does not satisfy this.\n    Autoscaling or load-shedding actions alone do not close the detection gap.\n\n12. action_quality.fixes_the_capacity_coupling: Answer yes only if an action\n    couples pool sizing to worker count (e.g., startup assertion\n    `workers <= max_connections`, or \"derive pool size from worker count or\n    fail startup on mismatch\"). A load-shed threshold referencing workers is\n    NOT capacity coupling.\n\n13. action_quality.proposes_unsupported_work: Answer yes only when material\n    work is premised on an UNSUPPORTED CAUSE OR RISK \u2014 e.g., vendor failover,\n    circuit breakers around the vendor, or timeout reductions justified by\n    vendor degradation the facts contradict; autoscaling or a warm standby\n    region premised on a (contradicted) traffic-spike cause; or unrelated\n    work like TLS changes, ledger-db resizing, or a service rewrite. Actions\n    tracing to the pool/worker findings are NOT unsupported work. If no\n    material work is proposed at all, answer no.\n\nStrategy: work criterion by criterion; quote the document text in each\nrationale; for negated criteria report whether the flaw is present without\ninverting; when a section is absent, mislabeled (its content does not match\nits heading, e.g., chat logs under \"Contributing Factors\" or alert noise\nunder \"Open Questions\"), or \"TBD\", answer the corresponding criteria no with\nthat as the rationale."}}];
const DOT = `digraph G {
    rankdir=TB;
    node [style=filled, shape=circle, fontsize=14, width=0.6, height=0.6];
    0 [label="0\\n(0.82)", fillcolor=lightgray, tooltip=" "];
    1 [label="1\\n(0.89)", fillcolor=lightgray, tooltip=" "];
    2 [label="2\\n(0.98)", fillcolor=cyan, tooltip=" "];
    3 [label="3\\n(0.98)", fillcolor=orange, tooltip=" "];
    4 [label="4\\n(0.96)", fillcolor=lightgray, tooltip=" "];
    0 -> 1;
    1 -> 2;
    2 -> 3;
    3 -> 4;
}`;

const nodeMap = {};
NODES.forEach(n => { nodeMap[n.idx] = n; });

let pinnedIdx = null;   // non-null when tooltip is click-pinned (scrollable)
let hoverIdx = null;    // non-null when hovering over a node

function renderTooltip(idx) {
  const n = nodeMap[idx];
  if (!n) return "";
  let roleBadge = "";
  if (n.role === "Best") roleBadge = '<span class="role-badge role-best">BEST</span>';
  else if (n.role === "Pareto Front") roleBadge = '<span class="role-badge role-pareto">PARETO</span>';
  else if (n.role === "Seed") roleBadge = '<span class="role-badge role-seed">SEED</span>';

  let comps = "";
  for (const [name, text] of Object.entries(n.components)) {
    const escaped = text.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
    comps += '<div class="tt-comp-name">' + name + '</div><div class="tt-comp-text">' + escaped + '</div>';
  }

  return '<div class="tt-header">Candidate ' + n.idx + roleBadge + '</div>' +
    '<div class="tt-meta">Score: <strong>' + n.score + '</strong>&nbsp;&nbsp;|&nbsp;&nbsp;Parent(s): ' + n.parents +
    '</div><div class="tt-hint">' + (pinnedIdx === idx ? 'Click node again to dismiss' : 'Click to pin &amp; scroll') + '</div>' +
    comps;
}

function positionTooltip(x, y) {
  const tt = document.getElementById("tooltip");
  let tx = x + 16, ty = y + 16;
  const r = tt.getBoundingClientRect();
  if (tx + r.width > window.innerWidth - 8) tx = x - r.width - 16;
  if (ty + r.height > window.innerHeight - 8) ty = y - r.height - 16;
  if (tx < 8) tx = 8;
  if (ty < 8) ty = 8;
  tt.style.left = tx + "px";
  tt.style.top = ty + "px";
}

function showTooltip(idx, x, y) {
  const tt = document.getElementById("tooltip");
  tt.innerHTML = renderTooltip(idx);
  tt.style.display = "block";
  positionTooltip(x, y);
}

function hideTooltip() {
  pinnedIdx = null;
  hoverIdx = null;
  document.getElementById("tooltip").style.display = "none";
}

// Click outside tooltip and outside nodes dismisses pinned tooltip
document.addEventListener("mousedown", function(e) {
  const tt = document.getElementById("tooltip");
  if (pinnedIdx !== null && tt.style.display === "block"
      && !tt.contains(e.target) && !e.target.closest(".node")) {
    hideTooltip();
  }
});

async function render() {
  const { instance } = await import("https://cdn.jsdelivr.net/npm/@viz-js/viz@3.11.0/lib/viz-standalone.mjs");
  const viz = await instance();
  const svg = viz.renderSVGElement(DOT);
  const container = document.getElementById("graph-container");
  container.innerHTML = "";
  container.appendChild(svg);

  // Attach hover listeners and strip native <title> tooltips to avoid double tooltips
  svg.querySelectorAll(".node").forEach(node => {
    const title = node.querySelector("title");
    if (!title) return;
    const idx = parseInt(title.textContent, 10);
    if (isNaN(idx)) return;
    title.remove();  // remove native SVG tooltip
    node.style.cursor = "pointer";
    // Hover: show tooltip following the mouse (non-interactive)
    node.addEventListener("mouseenter", e => {
      if (pinnedIdx !== null) return;  // don't override a pinned tooltip
      hoverIdx = idx;
      showTooltip(idx, e.clientX, e.clientY);
    });
    node.addEventListener("mousemove", e => {
      if (pinnedIdx !== null || hoverIdx !== idx) return;
      positionTooltip(e.clientX, e.clientY);
    });
    node.addEventListener("mouseleave", () => {
      if (pinnedIdx !== null) return;
      hoverIdx = null;
      document.getElementById("tooltip").style.display = "none";
    });
    // Click: pin the tooltip so user can scroll it
    node.addEventListener("click", e => {
      e.stopPropagation();
      if (pinnedIdx === idx) { hideTooltip(); return; }
      pinnedIdx = idx;
      showTooltip(idx, e.clientX, e.clientY);
    });
  });
  // Also strip <title> from edges and the graph itself
  svg.querySelectorAll(".edge title").forEach(t => t.remove());
  const graphTitle = svg.querySelector(":scope > title");
  if (graphTitle) graphTitle.remove();
}

render().catch(err => {
  document.getElementById("graph-container").innerHTML =
    "<p style='color:red'>Failed to render graph: " + err.message + "</p>" +
    "<pre>" + DOT.replace(/</g,"&lt;") + "</pre>";
});
</script>
</body>
</html>
