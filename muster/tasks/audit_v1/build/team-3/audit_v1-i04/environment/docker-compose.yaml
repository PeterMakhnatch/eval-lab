x-seat: &seat
  user: agent
  working_dir: /home/agent
  command: ["sleep", "infinity"]
  init: true
  depends_on:
    main:
      condition: service_healthy

services:
  main:
    command: ["python3", "/world/world.py"]
    environment:
      SEAT_TOKENS: "{\"695c7b93b173675686fed9efe4cf9654\": \"p2\", \"dfd52f3f172175887c2cfb2fd9de8fc2\": \"p1\", \"efce7c5dc16d46c7e2181157d483df40\": \"p3\"}"
    networks:
      p1-world:
        aliases: [world]
      p2-world:
        aliases: [world]
      p3-world:
        aliases: [world]
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health', timeout=2)"]
      interval: 2s
      timeout: 5s
      retries: 15
      start_period: 2s
  p1:
    <<: *seat
    build: ./seat_p1
    networks: [p1-world]
    environment:
      SEAT: "p1"
      SEAT_TOKEN: "dfd52f3f172175887c2cfb2fd9de8fc2"
      WORLD: "http://world:8080"
  p2:
    <<: *seat
    build: ./seat_p2
    networks: [p2-world]
    environment:
      SEAT: "p2"
      SEAT_TOKEN: "695c7b93b173675686fed9efe4cf9654"
      WORLD: "http://world:8080"
  p3:
    <<: *seat
    build: ./seat_p3
    networks: [p3-world]
    environment:
      SEAT: "p3"
      SEAT_TOKEN: "efce7c5dc16d46c7e2181157d483df40"
      WORLD: "http://world:8080"

networks:
  p1-world:
    internal: true
    enable_ipv4: false
    enable_ipv6: true
  p2-world:
    internal: true
    enable_ipv4: false
    enable_ipv6: true
  p3-world:
    internal: true
    enable_ipv4: false
    enable_ipv6: true
