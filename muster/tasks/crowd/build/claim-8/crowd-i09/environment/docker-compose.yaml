x-seat: &seat
  build: ./seat
  user: agent
  working_dir: /home/agent
  command: ["sleep", "infinity"]
  init: true
  depends_on:
    main:
      condition: service_healthy

services:
  main:
    command: ["python3", "/world/world.py"]
    environment:
      SEAT_TOKENS: "{\"257d806b6370d02d7a5b5cd14bdf0008\": \"p3\", \"2b4f66c63ff48420a3bb513b0462e4d7\": \"p5\", \"2e40281cd560508b4a7bbeeda5e96047\": \"p7\", \"6996263daba8a7593b062683dc872782\": \"p4\", \"819f7a33d2ea4821d82a336ab9d9be8f\": \"p6\", \"a93a2f6cc345fc91f7a47a46f6a56017\": \"p2\", \"cc5857581b86dc036056a02d4ab76eb7\": \"p8\", \"d302090ff98e8fd1f17ec01ec719863f\": \"p1\"}"
    networks:
      p1-world:
        aliases: [world]
      p2-world:
        aliases: [world]
      p3-world:
        aliases: [world]
      p4-world:
        aliases: [world]
      p5-world:
        aliases: [world]
      p6-world:
        aliases: [world]
      p7-world:
        aliases: [world]
      p8-world:
        aliases: [world]
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health', timeout=2)"]
      interval: 2s
      timeout: 5s
      retries: 15
      start_period: 2s
  p1:
    <<: *seat
    networks: [p1-world]
    environment:
      SEAT: "p1"
      SEAT_TOKEN: "d302090ff98e8fd1f17ec01ec719863f"
      WORLD: "http://world:8080"
  p2:
    <<: *seat
    networks: [p2-world]
    environment:
      SEAT: "p2"
      SEAT_TOKEN: "a93a2f6cc345fc91f7a47a46f6a56017"
      WORLD: "http://world:8080"
  p3:
    <<: *seat
    networks: [p3-world]
    environment:
      SEAT: "p3"
      SEAT_TOKEN: "257d806b6370d02d7a5b5cd14bdf0008"
      WORLD: "http://world:8080"
  p4:
    <<: *seat
    networks: [p4-world]
    environment:
      SEAT: "p4"
      SEAT_TOKEN: "6996263daba8a7593b062683dc872782"
      WORLD: "http://world:8080"
  p5:
    <<: *seat
    networks: [p5-world]
    environment:
      SEAT: "p5"
      SEAT_TOKEN: "2b4f66c63ff48420a3bb513b0462e4d7"
      WORLD: "http://world:8080"
  p6:
    <<: *seat
    networks: [p6-world]
    environment:
      SEAT: "p6"
      SEAT_TOKEN: "819f7a33d2ea4821d82a336ab9d9be8f"
      WORLD: "http://world:8080"
  p7:
    <<: *seat
    networks: [p7-world]
    environment:
      SEAT: "p7"
      SEAT_TOKEN: "2e40281cd560508b4a7bbeeda5e96047"
      WORLD: "http://world:8080"
  p8:
    <<: *seat
    networks: [p8-world]
    environment:
      SEAT: "p8"
      SEAT_TOKEN: "cc5857581b86dc036056a02d4ab76eb7"
      WORLD: "http://world:8080"

networks:
  p1-world:
    internal: true
    enable_ipv4: false
    enable_ipv6: true
  p2-world:
    internal: true
    enable_ipv4: false
    enable_ipv6: true
  p3-world:
    internal: true
    enable_ipv4: false
    enable_ipv6: true
  p4-world:
    internal: true
    enable_ipv4: false
    enable_ipv6: true
  p5-world:
    internal: true
    enable_ipv4: false
    enable_ipv6: true
  p6-world:
    internal: true
    enable_ipv4: false
    enable_ipv6: true
  p7-world:
    internal: true
    enable_ipv4: false
    enable_ipv6: true
  p8-world:
    internal: true
    enable_ipv4: false
    enable_ipv6: true
