x-seat: &seat
  build: ./seat
  user: agent
  working_dir: /home/agent
  command: ["sleep", "infinity"]
  init: true
  depends_on:
    main:
      condition: service_healthy

services:
  main:
    command: ["python3", "/world/world.py"]
    environment:
      SEAT_TOKENS: "{\"17a6739d85dd2cbb22d7b7f2b097071e\": \"p8\", \"2a1df789f33dbefbc16022af6b872e42\": \"p5\", \"5305c2772c02697be49dfab2e6a14121\": \"p1\", \"5b2cb1168a997cd2f5f2a49017f51afb\": \"p4\", \"61e239465a078136e777869ca040b9ad\": \"p6\", \"93867a252dd594ad3a920487235919fc\": \"p7\", \"ea1d792bf986cc40657699ec77b6dafd\": \"p3\", \"efb15a39c8d6fafcbcb6a7f2fac7944c\": \"p2\"}"
    networks:
      p1-world:
        aliases: [world]
      p2-world:
        aliases: [world]
      p3-world:
        aliases: [world]
      p4-world:
        aliases: [world]
      p5-world:
        aliases: [world]
      p6-world:
        aliases: [world]
      p7-world:
        aliases: [world]
      p8-world:
        aliases: [world]
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health', timeout=2)"]
      interval: 2s
      timeout: 5s
      retries: 15
      start_period: 2s
  p1:
    <<: *seat
    networks: [p1-world]
    environment:
      SEAT: "p1"
      SEAT_TOKEN: "5305c2772c02697be49dfab2e6a14121"
      WORLD: "http://world:8080"
  p2:
    <<: *seat
    networks: [p2-world]
    environment:
      SEAT: "p2"
      SEAT_TOKEN: "efb15a39c8d6fafcbcb6a7f2fac7944c"
      WORLD: "http://world:8080"
  p3:
    <<: *seat
    networks: [p3-world]
    environment:
      SEAT: "p3"
      SEAT_TOKEN: "ea1d792bf986cc40657699ec77b6dafd"
      WORLD: "http://world:8080"
  p4:
    <<: *seat
    networks: [p4-world]
    environment:
      SEAT: "p4"
      SEAT_TOKEN: "5b2cb1168a997cd2f5f2a49017f51afb"
      WORLD: "http://world:8080"
  p5:
    <<: *seat
    networks: [p5-world]
    environment:
      SEAT: "p5"
      SEAT_TOKEN: "2a1df789f33dbefbc16022af6b872e42"
      WORLD: "http://world:8080"
  p6:
    <<: *seat
    networks: [p6-world]
    environment:
      SEAT: "p6"
      SEAT_TOKEN: "61e239465a078136e777869ca040b9ad"
      WORLD: "http://world:8080"
  p7:
    <<: *seat
    networks: [p7-world]
    environment:
      SEAT: "p7"
      SEAT_TOKEN: "93867a252dd594ad3a920487235919fc"
      WORLD: "http://world:8080"
  p8:
    <<: *seat
    networks: [p8-world]
    environment:
      SEAT: "p8"
      SEAT_TOKEN: "17a6739d85dd2cbb22d7b7f2b097071e"
      WORLD: "http://world:8080"

networks:
  p1-world:
    internal: true
    enable_ipv4: false
    enable_ipv6: true
  p2-world:
    internal: true
    enable_ipv4: false
    enable_ipv6: true
  p3-world:
    internal: true
    enable_ipv4: false
    enable_ipv6: true
  p4-world:
    internal: true
    enable_ipv4: false
    enable_ipv6: true
  p5-world:
    internal: true
    enable_ipv4: false
    enable_ipv6: true
  p6-world:
    internal: true
    enable_ipv4: false
    enable_ipv6: true
  p7-world:
    internal: true
    enable_ipv4: false
    enable_ipv6: true
  p8-world:
    internal: true
    enable_ipv4: false
    enable_ipv6: true
