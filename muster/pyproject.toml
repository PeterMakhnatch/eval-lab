[project]
name = "muster"
version = "0.1.0"
description = "Controls, task QA and honest measurement for multi-seat Harbor tasks"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [{ name = "Peter Makhnatch" }]
dependencies = []

[project.optional-dependencies]
# Only `muster run`/`muster matrix` start trials. They call the `harbor` command of
# olamlabs/harbor-multiagent, pinned here by commit.
run = ["harbor @ git+https://github.com/olamlabs/harbor-multiagent@6aeb609e31fd77e5f89ce3bcb018db8045520fb7"]

[project.scripts]
muster = "muster.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/muster"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["docker: starts real containers through the pinned harbor fork (opt in with MUSTER_DOCKER=1)"]

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["tasks/*/build"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501", "RUF001"]
