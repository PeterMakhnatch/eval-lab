# Tomorrow-ready OpenRouter/Daytona campaign across all 6 behavioral probe families (31 conditions, 300 tasks).
# Worktree paths below keep `campaign check` green on this branch; update cwd/tasks to ~/Developer/eval-lab after landing.
# NOT executed during $0 overnight systems work. Run preflight + companion live watch before starting:
#   mkdir -p ~/Developer/eval-lab-results/worldwatch-probes-v2-campaign/scored
#   PYTHONDONTWRITEBYTECODE=1 keys run -- uv run --no-sync python -m worldwatch preflight muster/tasks/{standing_v1,trustcal_v1,crowdscale_v1,stalehand_v1,orderladder_v1,claimlease_v1}/build --check-openrouter
#   PYTHONDONTWRITEBYTECODE=1 uv run --no-sync python -m worldwatch tail ~/Developer/eval-lab-results/worldwatch-probes-v2-campaign/scored --follow --stop-file ~/Developer/eval-lab-results/worldwatch-probes-v2-campaign/STOP --alerts ~/Developer/eval-lab-results/worldwatch-probes-v2-campaign/alerts.jsonl --html ~/Developer/eval-lab-results/worldwatch-probes-v2-campaign/dashboard.html
#   (One-shot check: worldwatch tail ~/Developer/eval-lab-results/worldwatch-probes-v2-campaign/scored --once --stop-file ~/Developer/eval-lab-results/worldwatch-probes-v2-campaign/STOP)

schema = "campaign-plan/v1"
id = "probes-six-families"
output_root = "~/Developer/eval-lab-results/worldwatch-probes-v2-campaign/scored"
state_root = "~/Developer/eval-lab-results/worldwatch-probes-v2-campaign/campaign-state"
max_trials_at_once = 8

[command]
argv = [
  "keys", "run", "--", "uv", "run", "--no-sync", "python", "-m", "muster", "run", "{tasks}",
  "--roster", "/Users/petermakhnatch/Developer/eval-lab-results/worldwatch-probes-2026-11-24/rosters/or-gemini-2.5-flash-lite.json",
  "--attempts", "{attempts}", "--concurrency", "{concurrency}", "--out", "{out}",
]
cwd = "/Users/petermakhnatch/Developer/eval-lab-wt/worldwatch-and-behavioral-probes"
env = { MUSTER_HARBOR = "{harbor}", PYTHONDONTWRITEBYTECODE = "1" }

[harbor]
program = "/Users/petermakhnatch/Developer/harbor-multiagent-muster/.venv/bin/harbor"
run_args = [
  "--env", "daytona", "--override-cpus", "2", "--override-memory-mb", "4096",
  "--ek", "dind_snapshot=muster-dind-mirror-v1",
]

[money]
provider = "openrouter"
probe = [
  "sh", "-c",
  '''keys run -- sh -c 'curl -s -m 30 https://openrouter.ai/api/v1/credits -H "Authorization: Bearer $OPENROUTER_API_KEY"' | python3 -c 'import json,sys; d=json.load(sys.stdin)["data"]; print(round(d["total_credits"]-d["total_usage"],2))' ''',
]
key_limit_probe = [
  "sh", "-c",
  '''keys run -- sh -c 'curl -s -m 30 https://openrouter.ai/api/v1/key -H "Authorization: Bearer $OPENROUTER_API_KEY"' | python3 -c 'import json,sys; d=json.load(sys.stdin)["data"]; lim=d["limit"]; eff=(d.get("effective_budget") or {}).get("remaining_usd"); vals=([d["limit_remaining"]] if lim is not None else [])+([eff] if eff is not None else []); ok=all(type(v) in (int,float) and v==v for v in vals); ok or sys.exit(1); print(max(0.0, round(min(vals), 4)) if vals else "none")' ''',
]
probe_timeout_seconds = 60
floor_usd = 4.50
cap_usd = 25.00
cap_roots = ["~/Developer/eval-lab-results/worldwatch-probes-v2-campaign/scored"]
unknown_seat_usd = 0.02
ledger = "~/Developer/eval-lab-results/worldwatch-probes-v2-campaign/spend-ledger.jsonl"

[watch]
poll_seconds = 15
max_arm_minutes = 60
stop_grace_seconds = 180
stop_file = "~/Developer/eval-lab-results/worldwatch-probes-v2-campaign/STOP"
no_reward_streak = 5

[[arms]]
name = "standing-none-ctrl"
tasks = "/Users/petermakhnatch/Developer/eval-lab-wt/worldwatch-and-behavioral-probes/muster/tasks/standing_v1/build/none-ctrl"
attempts = 1
reserve_usd = 0.40
rerun_reserve_usd = 0.20
expected_usd = 0.15

