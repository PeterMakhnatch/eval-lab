x-seat: &seat
  build: ./seat
  user: agent
  working_dir: /home/agent
  command: ["sleep", "infinity"]
  init: true
  depends_on:
    main:
      condition: service_healthy

services:
  main:
    command: ["python3", "/world/world.py"]
    environment:
      SEAT_TOKENS: "{\"4ed8a028e1a5e39542e3a2e4907a0ba2\": \"p3\", \"a7734e912595cc55a057b07a8de79c5f\": \"p2\", \"f06f975eac53251a694b73d22f3f227a\": \"p1\"}"
    networks:
      p1-world:
        aliases: [world]
      p2-world:
        aliases: [world]
      p3-world:
        aliases: [world]
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health', timeout=2)"]
      interval: 2s
      timeout: 5s
      retries: 15
      start_period: 2s
  p1:
    <<: *seat
    networks: [p1-world]
    environment:
      SEAT: "p1"
      SEAT_TOKEN: "f06f975eac53251a694b73d22f3f227a"
      WORLD: "http://world:8080"
  p2:
    <<: *seat
    networks: [p2-world]
    environment:
      SEAT: "p2"
      SEAT_TOKEN: "a7734e912595cc55a057b07a8de79c5f"
      WORLD: "http://world:8080"
  p3:
    <<: *seat
    networks: [p3-world]
    environment:
      SEAT: "p3"
      SEAT_TOKEN: "4ed8a028e1a5e39542e3a2e4907a0ba2"
      WORLD: "http://world:8080"

networks:
  p1-world:
    internal: true
    enable_ipv4: false
    enable_ipv6: true
  p2-world:
    internal: true
    enable_ipv4: false
    enable_ipv6: true
  p3-world:
    internal: true
    enable_ipv4: false
    enable_ipv6: true
