# Daytona admission-guard limits (HAR-144). Committed standing values.
#
# Sourced from live provider reads on 2026-10-01, not estimates:
# - Organization usage (quota + current use, us/container):
#   GET https://app.daytona.io/api/organizations/75ae5c7a-cc37-40e9-8f96-9bd4e8798e7b/usage
#   observed 2026-10-01T20:45:55Z. At that time the complete live inventory
#   was items[] with nextCursor null and usage 0 on all dimensions.
# - Per-sandbox caps corroborated from the dashboard limits page
#   (https://app.daytona.io/dashboard/limits, Tier 2, observed 2026-10-01T20:49Z):
#   4 CPU / 8 GiB RAM / 10 GiB disk per sandbox; GPU earth quota 10.
#   The live usage endpoint currently returns null for max per-sandbox values;
#   null is treated as unavailable and these dashboard caps are authoritative.
# - No separate concurrent-sandbox cap is exposed by the API or shown by the
#   dashboard, so none is asserted here (null): concurrency is reported from
#   live inventory, never refused against an invented ceiling.
#
# Wallet (https://app.daytona.io/dashboard/billing/wallet, observed
# 2026-10-01T20:49Z: free $185.15, paid $25.00, month spend $8.47) is a dated
# observation, NOT spending authorization and NOT live API credit headroom.
# The frontend billing wallet/tier endpoints return 401 for this API key even
# though the key carries read:billing/read:limits, so monetary_api is
# unavailable and no credit ceiling is invented. No plan/spend change.
#
# Only the verified us/container target+class pair is admitted. Any other
# region or sandbox class is refused instead of evaluated against fabricated
# caps. safety_fraction keeps a 20% headroom below quota on every dimension.
