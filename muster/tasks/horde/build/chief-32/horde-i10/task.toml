schema_version = "1.4"
artifacts = ["/logs/world/events.jsonl"]

[task]
name = "muster/horde-i10"
description = "horde-i10, condition chief-32: 32 seats with a message channel and the chief rule, 3 opens per seat (96 in total), look for the flags in 240 boxes."
keywords = ["seats", "multi-agent", "muster"]

[metadata]
family = "horde"
condition = "chief-32"
instance = 10
oracle_reward = 1.0
