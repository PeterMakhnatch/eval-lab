x-seat: &seat
  user: agent
  working_dir: /home/agent
  command: ["sleep", "infinity"]
  init: true
  depends_on:
    main:
      condition: service_healthy

services:
  main:
    command: ["python3", "/world/world.py"]
    environment:
      SEAT_TOKENS: "{\"2a707d2998db7bbaed192eca192f0624\": \"s1\", \"3e137241ce0f741fe03f79f2271465cc\": \"s2\", \"5ee11f82ea9719ecced6c4734f8abe7b\": \"auditor\", \"b9cabeae8c1a45255ea05eabb25af818\": \"lead\", \"d180df0dd22e36a233e52ff2226011bc\": \"s3\", \"f13f529e6aa38f562879469034b7d108\": \"s4\"}"
    networks:
      lead-world:
        aliases: [world]
      s1-world:
        aliases: [world]
      s2-world:
        aliases: [world]
      s3-world:
        aliases: [world]
      s4-world:
        aliases: [world]
      auditor-world:
        aliases: [world]
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health', timeout=2)"]
      interval: 2s
      timeout: 5s
      retries: 15
      start_period: 2s
  lead:
    <<: *seat
    build: ./seat_lead
    networks: [lead-world]
    environment:
      SEAT: "lead"
      SEAT_TOKEN: "b9cabeae8c1a45255ea05eabb25af818"
      WORLD: "http://world:8080"
  s1:
    <<: *seat
    build: ./seat_s1
    networks: [s1-world]
    environment:
      SEAT: "s1"
      SEAT_TOKEN: "2a707d2998db7bbaed192eca192f0624"
      WORLD: "http://world:8080"
  s2:
    <<: *seat
    build: ./seat_s2
    networks: [s2-world]
    environment:
      SEAT: "s2"
      SEAT_TOKEN: "3e137241ce0f741fe03f79f2271465cc"
      WORLD: "http://world:8080"
  s3:
    <<: *seat
    build: ./seat_s3
    networks: [s3-world]
    environment:
      SEAT: "s3"
      SEAT_TOKEN: "d180df0dd22e36a233e52ff2226011bc"
      WORLD: "http://world:8080"
  s4:
    <<: *seat
    build: ./seat_s4
    networks: [s4-world]
    environment:
      SEAT: "s4"
      SEAT_TOKEN: "f13f529e6aa38f562879469034b7d108"
      WORLD: "http://world:8080"
  auditor:
    <<: *seat
    build: ./seat_auditor
    networks: [auditor-world]
    environment:
      SEAT: "auditor"
      SEAT_TOKEN: "5ee11f82ea9719ecced6c4734f8abe7b"
      WORLD: "http://world:8080"

networks:
  lead-world:
    internal: true
    enable_ipv4: false
    enable_ipv6: true
  s1-world:
    internal: true
    enable_ipv4: false
    enable_ipv6: true
  s2-world:
    internal: true
    enable_ipv4: false
    enable_ipv6: true
  s3-world:
    internal: true
    enable_ipv4: false
    enable_ipv6: true
  s4-world:
    internal: true
    enable_ipv4: false
    enable_ipv6: true
  auditor-world:
    internal: true
    enable_ipv4: false
    enable_ipv6: true
