x-seat: &seat
  build: ./seat
  user: agent
  working_dir: /home/agent
  command: ["sleep", "infinity"]
  init: true
  depends_on:
    main:
      condition: service_healthy

services:
  main:
    command: ["python3", "/world/world.py"]
    environment:
      SEAT_TOKENS: "{\"f6afdfda6fbdc4f753b542d9aa8c5d27\": \"p2\"}"
    networks:
      p2-world:
        aliases: [world]
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health', timeout=2)"]
      interval: 2s
      timeout: 5s
      retries: 15
      start_period: 2s
  p2:
    <<: *seat
    networks: [p2-world]
    environment:
      SEAT: "p2"
      SEAT_TOKEN: "f6afdfda6fbdc4f753b542d9aa8c5d27"
      WORLD: "http://world:8080"

networks:
  p2-world:
    internal: true
    enable_ipv4: false
    enable_ipv6: true
