[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "eval-lab"
version = "0.1.0"
description = "Evaluation research in real environments, using Harbor as the execution engine"
license = "Apache-2.0"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "daytona>=0.210.0",
    # 2.0 rewrites the Python API and writes a one-way storage format that the
    # 1.5 checkouts still in use cannot read; migrate deliberately, not via lock refresh.
    "duckdb>=1.5.5,<2",
    "fastapi==0.141.1",
    # Native task execution is a core boundary, independent of trace export.
    "harbor[modal]==0.24.0",
    "huggingface-hub>=1.29.0",
    "psycopg[binary]>=3.2,<4",
    "pyarrow>=25.0.1",
    "pydantic>=2.13.4",
    "pytz>=2026.5",
    "pyyaml>=6.0.3",
    "tomlkit>=0.13,<1",
    "uvicorn>=0.54.0,<1",
]

[project.optional-dependencies]
laminar = [
    "lmnr==0.7.64",
]

[project.scripts]
evallab = "evallab.entry:main"

[dependency-groups]
# Dependencies required by the mcp-recovery-v1 benchmark family's certified runtime
# and its focused tests (AES-GCM evidence envelopes and the FastMCP sidecar). They
# are intentionally kept out of the base install: the benchmark provisions its own
# trusted wheelhouse in the Harbor container. The CI test matrix syncs this group so
# the contract tests can actually run.
benchmarks = [
    "cryptography>=41,<51",
    "fastmcp==3.4.7",
]
# Inspect log adapter and METR scout reader test dependencies. Out of the base
# install for the same reason as `benchmarks`; the CI test matrix syncs this
# group so the Inspect-gated tests run instead of skipping (HAR-287).
inspect = [
    # tests/test_html_js_filter_verifier.py imports the shipped html-js-filter
    # verifier and its solution from tmp_path copies; both parse HTML with
    # BeautifulSoup. Out of the base install for the same reason as inspect-ai.
    "beautifulsoup4>=4.13,<5",
    "inspect-ai==0.3.276",
]
dev = [
    # Pinned resolver pip is the immutable wheel-download engine for FastMCP
    # wheelhouse staging. Its wheel hash is committed in uv.lock; workflows sync
    # --locked so the exact executable resolver runs instead of a live
    # `uv run --with pip` resolution.
    "pip==26.1.2",
    "harbor-atif2otel>=0.1.0",
    "lmnr==0.7.64",
    "modal==1.6.2",
    "openai>=2,<3",
    "hypothesis>=6.100,<7",
    "pytest>=8.4,<10",
    "pytest-xdist>=3.8,<4",
    "ruff>=0.12,<1",
]
observability = [
    "harbor-atif2otel>=0.1.0",
    "lmnr==0.7.64",
    "opentelemetry-exporter-otlp>=1.38.0",
    "opentelemetry-proto>=1.38.0",
    "opentelemetry-sdk>=1.38.0",
    "openinference-instrumentation-dspy>=0.1.0",
    "openinference-instrumentation-litellm>=0.1.0",
]

[tool.uv]
default-groups = ["dev"]

[tool.hatch.build.targets.wheel]
packages = ["src/evallab"]

[tool.pytest.ini_options]
addopts = "-q -n 4 --dist loadscope --strict-markers"
markers = [
    "docs_consumer: reads repository documents; supports focused local checks",
]
testpaths = [
    "tests",
    "research/analysis/tests",
    "research/experiments/ov1104-detbench/test_length_metrics.py",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [
    "library/adapters/*/generated",
    "library/tasks/terminal-bench-html-js-filter",
    # Verbatim task verifiers are pinned by matrix verifier_digest; preserve their bytes.
    "library/tasks/release-branch-rescue",
    "library/tasks/experimental",
    "library/external/terminal-bench-v3.0.0",
    # Generated tau3-bench task code is vendored upstream; editing it would
    # desync the package from its source and invalidate registry digests.
    "library/tasks/tau3-retail-1",
    # Promoted evidence is a verbatim record of what an agent produced. Its
    # digests are pinned in each bundle's PROMOTION.json, so linting or
    # reformatting it would falsify the record rather than improve it.
    "research/evidence/runs",
]
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
    "library/tasks/query-optimize/**" = ["B011", "B905"]
    # HAR-169 integrity core + its in-image payload run on task-image interpreters
    # back to 3.7, so typing.* annotation forms stay (UP006/UP035/UP045).
    "src/evallab/integrity_reward_core.py" = ["UP006", "UP035", "UP045"]
    "src/evallab/heldout_verifier.py" = ["UP032"]

[tool.ty.rules]
# Optional dependency groups (observability) are absent in some checked
# environments and present in others; their import ignores are used only where
# the package is missing.
unused-ignore-comment = "ignore"
