x-seat: &seat
  user: agent
  working_dir: /home/agent
  command: ["sleep", "infinity"]
  init: true
  depends_on:
    main:
      condition: service_healthy

services:
  main:
    command: ["python3", "/world/world.py"]
    environment:
      SEAT_TOKENS: "{\"1b96242f2e0f86aa0f76374f8c2cfe51\": \"s1\", \"34ef96a1cabbd989e49bb278d999a3fd\": \"s4\", \"41c2d200daacc2d50ac8fd4faa45791e\": \"s3\", \"643f82366568b61f985c7ffcdc7e8ccd\": \"auditor\", \"b0a0894e9055a32c7cd6aade65b8da9f\": \"lead\", \"dc77521d359a49e299461bc412108c7b\": \"s2\"}"
    networks:
      lead-world:
        aliases: [world]
      s1-world:
        aliases: [world]
      s2-world:
        aliases: [world]
      s3-world:
        aliases: [world]
      s4-world:
        aliases: [world]
      auditor-world:
        aliases: [world]
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health', timeout=2)"]
      interval: 2s
      timeout: 5s
      retries: 15
      start_period: 2s
  lead:
    <<: *seat
    build: ./seat_lead
    networks: [lead-world]
    environment:
      SEAT: "lead"
      SEAT_TOKEN: "b0a0894e9055a32c7cd6aade65b8da9f"
      WORLD: "http://world:8080"
  s1:
    <<: *seat
    build: ./seat_s1
    networks: [s1-world]
    environment:
      SEAT: "s1"
      SEAT_TOKEN: "1b96242f2e0f86aa0f76374f8c2cfe51"
      WORLD: "http://world:8080"
  s2:
    <<: *seat
    build: ./seat_s2
    networks: [s2-world]
    environment:
      SEAT: "s2"
      SEAT_TOKEN: "dc77521d359a49e299461bc412108c7b"
      WORLD: "http://world:8080"
  s3:
    <<: *seat
    build: ./seat_s3
    networks: [s3-world]
    environment:
      SEAT: "s3"
      SEAT_TOKEN: "41c2d200daacc2d50ac8fd4faa45791e"
      WORLD: "http://world:8080"
  s4:
    <<: *seat
    build: ./seat_s4
    networks: [s4-world]
    environment:
      SEAT: "s4"
      SEAT_TOKEN: "34ef96a1cabbd989e49bb278d999a3fd"
      WORLD: "http://world:8080"
  auditor:
    <<: *seat
    build: ./seat_auditor
    networks: [auditor-world]
    environment:
      SEAT: "auditor"
      SEAT_TOKEN: "643f82366568b61f985c7ffcdc7e8ccd"
      WORLD: "http://world:8080"

networks:
  lead-world:
    internal: true
    enable_ipv4: false
    enable_ipv6: true
  s1-world:
    internal: true
    enable_ipv4: false
    enable_ipv6: true
  s2-world:
    internal: true
    enable_ipv4: false
    enable_ipv6: true
  s3-world:
    internal: true
    enable_ipv4: false
    enable_ipv6: true
  s4-world:
    internal: true
    enable_ipv4: false
    enable_ipv6: true
  auditor-world:
    internal: true
    enable_ipv4: false
    enable_ipv6: true
