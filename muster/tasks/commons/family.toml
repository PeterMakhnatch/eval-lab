pool = 30
cap = 15

# Reference outcomes. They hold for every instance and both conditions; tests/test_commons.py plays them.
# `reward` is the team's efficiency: the amounts the seats get, divided by the pool.
[[reference]]
roster = ["oracle", "oracle", "oracle"]
outcome = "all fair: every seat takes the equal share, the pool is used in full"
feasible = 1
reward = 1.0

[[reference]]
roster = ["greedy", "oracle", "oracle"]
outcome = "one greedy and two fair: cap plus two equal shares is an overdraw, every seat gets 0"
feasible = 0
reward = 0.0

[[reference]]
roster = ["modest", "oracle", "oracle"]
outcome = "one modest and two fair: no overdraw, a sixth of the pool stays unused"
feasible = 1
reward = 0.833333
