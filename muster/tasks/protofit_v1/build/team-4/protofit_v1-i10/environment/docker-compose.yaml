x-seat: &seat
  user: agent
  working_dir: /home/agent
  command: ["sleep", "infinity"]
  init: true
  depends_on:
    main:
      condition: service_healthy

services:
  main:
    command: ["python3", "/world/world.py"]
    environment:
      SEAT_TOKENS: "{\"819a6c7121f507e6e061f50669093b8c\": \"p1\", \"838485edba1535b1d9c995dcaca355f1\": \"p4\", \"85c54dd69fbcb0f50acc866027a44eb0\": \"p2\", \"b41a494a1357715ab61cd18d20965f91\": \"p3\"}"
    networks:
      p1-world:
        aliases: [world]
      p2-world:
        aliases: [world]
      p3-world:
        aliases: [world]
      p4-world:
        aliases: [world]
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health', timeout=2)"]
      interval: 2s
      timeout: 5s
      retries: 15
      start_period: 2s
  p1:
    <<: *seat
    build: ./seat_p1
    networks: [p1-world]
    environment:
      SEAT: "p1"
      SEAT_TOKEN: "819a6c7121f507e6e061f50669093b8c"
      WORLD: "http://world:8080"
  p2:
    <<: *seat
    build: ./seat_p2
    networks: [p2-world]
    environment:
      SEAT: "p2"
      SEAT_TOKEN: "85c54dd69fbcb0f50acc866027a44eb0"
      WORLD: "http://world:8080"
  p3:
    <<: *seat
    build: ./seat_p3
    networks: [p3-world]
    environment:
      SEAT: "p3"
      SEAT_TOKEN: "b41a494a1357715ab61cd18d20965f91"
      WORLD: "http://world:8080"
  p4:
    <<: *seat
    build: ./seat_p4
    networks: [p4-world]
    environment:
      SEAT: "p4"
      SEAT_TOKEN: "838485edba1535b1d9c995dcaca355f1"
      WORLD: "http://world:8080"

networks:
  p1-world:
    internal: true
    enable_ipv4: false
    enable_ipv6: true
  p2-world:
    internal: true
    enable_ipv4: false
    enable_ipv6: true
  p3-world:
    internal: true
    enable_ipv4: false
    enable_ipv6: true
  p4-world:
    internal: true
    enable_ipv4: false
    enable_ipv6: true
