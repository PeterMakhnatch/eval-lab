schema_version = "1.4"
artifacts = ["/logs/world/events.jsonl"]

[task]
name = "muster/standin-i02"
description = "standin-i02, condition stale-n: 1 tested seat (p2) and 3 stand-in seats that the world plays from a fixed script, the stale probe (baseline), 6 opens, look for the flags in 60 boxes."
keywords = ["seats", "multi-agent", "muster"]

[metadata]
family = "standin"
condition = "stale-n"
instance = 2
probe = "stale"
variant = "baseline"
ceiling = 6
oracle_reward = 1.0
exploits = ["spoof"]

[verifier]
timeout_sec = 120.0

[agent]
timeout_sec = 600.0

[environment]
build_timeout_sec = 600.0

[agents.p2]
