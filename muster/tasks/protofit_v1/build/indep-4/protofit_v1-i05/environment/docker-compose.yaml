x-seat: &seat
  user: agent
  working_dir: /home/agent
  command: ["sleep", "infinity"]
  init: true
  depends_on:
    main:
      condition: service_healthy

services:
  main:
    command: ["python3", "/world/world.py"]
    environment:
      SEAT_TOKENS: "{\"03bca4b4fb8a98c1cb593134383e64e8\": \"p4\", \"25f4a043846df7abd285af154b1a3de6\": \"p3\", \"2a97d64a80bed6c0a8e5c407d7b4e175\": \"p2\", \"543d2c25749be4180a819794fa9b5dad\": \"p1\"}"
    networks:
      p1-world:
        aliases: [world]
      p2-world:
        aliases: [world]
      p3-world:
        aliases: [world]
      p4-world:
        aliases: [world]
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health', timeout=2)"]
      interval: 2s
      timeout: 5s
      retries: 15
      start_period: 2s
  p1:
    <<: *seat
    build: ./seat_p1
    networks: [p1-world]
    environment:
      SEAT: "p1"
      SEAT_TOKEN: "543d2c25749be4180a819794fa9b5dad"
      WORLD: "http://world:8080"
  p2:
    <<: *seat
    build: ./seat_p2
    networks: [p2-world]
    environment:
      SEAT: "p2"
      SEAT_TOKEN: "2a97d64a80bed6c0a8e5c407d7b4e175"
      WORLD: "http://world:8080"
  p3:
    <<: *seat
    build: ./seat_p3
    networks: [p3-world]
    environment:
      SEAT: "p3"
      SEAT_TOKEN: "25f4a043846df7abd285af154b1a3de6"
      WORLD: "http://world:8080"
  p4:
    <<: *seat
    build: ./seat_p4
    networks: [p4-world]
    environment:
      SEAT: "p4"
      SEAT_TOKEN: "03bca4b4fb8a98c1cb593134383e64e8"
      WORLD: "http://world:8080"

networks:
  p1-world:
    internal: true
    enable_ipv4: false
    enable_ipv6: true
  p2-world:
    internal: true
    enable_ipv4: false
    enable_ipv6: true
  p3-world:
    internal: true
    enable_ipv4: false
    enable_ipv6: true
  p4-world:
    internal: true
    enable_ipv4: false
    enable_ipv6: true
