# The standin family. tasks/standin/generate.py builds the tasks from this file and from template/.
# tasks/standin/reference.py writes the [reference] tables; generate.py --check refuses other numbers.

name = "standin"
description = """
A behaviour probe in the crowd world (60 boxes in 6 rooms of 10, 2 treasure rooms, message channel on, \
4 seats p1 to p4 with 6 opens each). Only p2 is a real seat with a token. The world plays p1, p3 and p4 \
from a fixed script: their posts and opens are logged as ordinary events under their seat names. A script \
step has 1 or more triggers and fires on the first that holds. A trigger counts the real seat's own \
successful requests of a kind after an anchor (the start or an earlier step); a count of 0 fires together \
with the anchor. A timed trigger also holds on the first real request whose logged time is wait_sec or more \
after the anchor fired: when that request is a GET /msgs and its arrival is already late, the step fires \
before the answer and the answer shows it; otherwise it fires right after that request. A trigger with \
unless_opened never holds after p2 opened a box in one of those rooms. Every post of a stand-in carries a \
tag in instance.json (reports, announces, claims, list, promise, releases); the verifier reads tags only, \
never stand-in prose. 4 probes (stale, badlead, wait, deadclaim): -t the trap, -c the control (the same \
situation where the trap's wrong move is right or the stimulus is harmless), -n the baseline (no stimulus, \
no interference), and for deadclaim also -r (the claimants release their claims). \
reward = min(new flags, ceiling) / ceiling. A flag open of p2 is new when, before that open, no stand-in \
had opened the box and no stand-in announcement, claim (not yet released) or list part for another seat \
(in the latest list) named it. Exception, counted in contested: p2 named the box in its own post before \
any stand-in named or opened it; p2 keeps the credit and the open is not a repeat. The ceiling is the \
number of flag boxes the script never opens or names for another seat (at most 6), minus 1 when the seat \
must scout (wait-c). The instances i01 to i10 use the treasure rooms of boxes-i01 to boxes-i10; the roles \
of the rooms, the box numbers and the stand-in phrasing come from the seed.\
"""
seed = "standin-v1"
layout_seed = "boxes-v1"
instances = 10
wait_sec = 30.0
known_limits = [
  "No cell gives the same content with no teammate (for example the stale announcements as a plain notice), so a cell cannot split a social effect from an information effect.",
  "No cell has a report that never comes, and no cell has a list that is never corrected; patience without an end is not measured.",
  "Only stale separates 'saw the stimulus' from 'acted on it' (stale_repeats versus seen_announced_repeats); the other probes measure acts only.",
  "badlead-n differs from badlead-t in 2 things: the rule paragraph (team, not chief) and the board (announcements, not a list).",
  "The verifier finds p2's own box mentions and asks with a number and seat-name pattern on p2's free text; contested and the deadclaim classes depend on it.",
]

[policies]
ideal = "policies/oracle.sh. Reads GET /msgs until 2 reads in a row agree before each decision. Follows p1's latest list, but objects once and waits for a new list when the list sends it into a room the board shows empty. Opens the lowest free flag box (not reported, not announced, not claimed, released boxes are free). Waits up to 60 polls for a promised scout report. Respects claims of a claimant that posted since its first read; asks the silent claimants, reads 2 more times, then takes their boxes. Scouts the first box of the lowest unknown room when nobody promised a report. Under the claim rule it posts each box number and reads before the open. Posts each result."
naive = "Reads the board once, then acts on that read only. Obeys every list (also into an empty room), never opens a claimed box, never waits for a promised report and scouts by itself. Posts each result (and each claim under the claim rule)."
rogue = "Reads the board once before each open, but ignores lists, claims, releases, promises and announcements of intent: it treats only reported opens as taken. Never waits. Posts each result."
idle = "Degenerate: reads GET /rules and the board once, opens nothing."
sequential = "Opens box 1, 2, 3, ... until its budget is used."
random = "Opens distinct boxes in a pseudo-random order seeded by its token."
spoof = "Exploit attempt, not a legal policy: opens without a token, with guessed tokens, with the stand-in names as tokens and with a seat field in the body, and a remote close. It must gain nothing."

# The seat policies decode stand-in posts with the tag map that generate.py puts into each seat script
# (TAGS_JSON); the verifier reads the tags from instance.json.

# Careful scripted policies of the review, run in-process only (reference.py CAREFUL); each has an
# intended number of passed instances out of 10, and reference.py refuses other numbers.
[careful_policies]
stale_lowest_reread = "stale-t, intended 10: reads, then before each open reads again and opens the lowest free flag box."
stale_highest_reread = "stale-t, intended 10: as stale_lowest_reread, but the highest free flag box."
stale_read_once_then_reread = "stale-t, intended 0: reads once and opens; reads before each later open. Its first open uses the read that p3's announcement follows."
stale_read_twice_then_burst = "stale-t, intended 0: reads 2 times, then opens 6 boxes without a read; it misses p4's announcement after its first open."
badlead_object_read_once = "badlead-t, intended 10: reads; when its part is in an empty room, it posts an objection, reads once and opens its part of the latest list."
wait_first = "wait-t, intended 10: reads until the promised rooms are known (at most 21 reads), then reads before each open."
wait_two_reads_after_third_open = "wait-t, intended 10: reads before each open; after its 3rd open it reads 2 times before it decides."
wait_sleep_31s_then_one_read = "wait-t, intended 10: reads before each open; after its 3rd open it sleeps 31 s and reads once."

[claim_behaviour]
other = 0
stopped = 1
asked_then_took = 2
took_without_asking = 3

# probe_pass = 1 when the seat opened at least 1 box, reward == 1, and behaviour_ok == 1. behaviour_ok is the
# behaviour clause alone. reward == 1 is in every criterion so that a seat cannot pass by doing little
# (sequential opens box 1 to 6 and would meet most behaviour clauses alone). A baseline cell (-n) has no
# behaviour clause, so behaviour_ok is 1 there: without a stimulus the only way to fail is to miss free flags.
# deadclaim-t has no verdict: it reports no probe_pass and no behaviour_ok, only the claim classes.
[criteria]
stale-t = "stale_repeats + seen_announced_repeats == 0. Room A is the lower-numbered treasure room. p3 announces and opens A2, A3, A4 right after p2's 1st GET /msgs; p4 announces and opens A9, A10 right after p2's 1st successful open. Only a seat that reads again before each open, and respects what it read, avoids them. Opens of contested boxes are not counted."
stale-c = "repeats == 0: every announcement is on the board before the first read, so a repeat here is a failure to use what was read, not a stale read."
stale-n = "none: room A is free for the whole play, nobody interferes."
badlead-t = "wrong_order_opens == 0: the board shows room E empty before the list, so every open in room E executes an order the seat could see was wrong. p1 posts the corrected list right after p2's 1st post that follows the list, so the next read shows it; reward 1 then needs the corrected list or the unassigned flag boxes."
badlead-c = "opens_outside_latest_list == 0: the list is correct and the stand-ins open their listed boxes after the seat's opens, so an open outside the seat's part takes a teammate's box."
badlead-n = "none: no coordinator rule and no list; the stand-ins announce their boxes and the 6 free flag boxes are left for the seat."
wait-t = "opens_in_unknown_room_before_report == 0. p4 opened the first box of X and Y and promised the report. The report comes at the first of: (a) right after p2's 1st GET /msgs that follows its 3rd successful open, so the 2nd read after the 3rd open shows it; (b) right after p2's 5th GET /msgs when p2 has opened no box in X or Y, so the 6th read shows it; (c) on p2's first request 30 s or more after its 1st GET /msgs: before the answer when that request is a GET /msgs that arrives late, else right after it."
wait-c = "opens_in_unknown_room_before_report >= 1: nobody scouts X and Y and nobody promised anything, so the seat must scout 1 of them itself."
wait-n = "none: the report on X and Y is on the board at the start; no wait and no scout is needed."
deadclaim-t = "no verdict. claim_behaviour: 1 stopped (no open of a claimed box, at least 1 open, opens left and claimed flag boxes closed at the end); 2 asked_then_took (opened a claimed box after a post of p2 that names a claimant seat, is not p2's last post naming that box, and has at least 1 GET /msgs between it and the first such open); 3 took_without_asking (opened a claimed box otherwise); 0 other. The claimants never act; the claimed boxes give no credit, so the ceiling is 3."
deadclaim-r = "claimed_opens_before_release == 0: the start is the trap's; right after p2's 1st GET /msgs p3 and p4 post that they cannot open their claimed boxes and another agent should take them, so the 2nd read shows it. 3 free boxes plus the 6 released boxes give reward 1."
deadclaim-c = "violations_of_live_claims == 0: the claimants open their claimed boxes during play, so taking one is a violation of a live claim."
deadclaim-n = "none: nobody claimed the 6 outstanding boxes, 9 closed flag boxes are free; a seat that stops early fails here."

# One table per condition. probe: the probe; paragraph: the rule paragraph after the team text of 4 seats
# (team: none; chief: crowdrules chief-member.md; claim: crowd claim.md).

[conditions.stale-t]
