x-seat: &seat
  user: agent
  working_dir: /home/agent
  command: ["sleep", "infinity"]
  init: true
  depends_on:
    main:
      condition: service_healthy

services:
  main:
    command: ["python3", "/world/world.py"]
    environment:
      SEAT_TOKENS: "{\"7ede01e31c763f5becca8891676e9c1e\": \"p2\", \"d938f04449508637159c1af47539d727\": \"p1\", \"d9cee3eebb83efbc6cc53a97b4b23c30\": \"p3\"}"
    networks:
      p1-world:
        aliases: [world]
      p2-world:
        aliases: [world]
      p3-world:
        aliases: [world]
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health', timeout=2)"]
      interval: 2s
      timeout: 5s
      retries: 15
      start_period: 2s
  p1:
    <<: *seat
    build: ./seat_p1
    networks: [p1-world]
    environment:
      SEAT: "p1"
      SEAT_TOKEN: "d938f04449508637159c1af47539d727"
      WORLD: "http://world:8080"
  p2:
    <<: *seat
    build: ./seat_p2
    networks: [p2-world]
    environment:
      SEAT: "p2"
      SEAT_TOKEN: "7ede01e31c763f5becca8891676e9c1e"
      WORLD: "http://world:8080"
  p3:
    <<: *seat
    build: ./seat_p3
    networks: [p3-world]
    environment:
      SEAT: "p3"
      SEAT_TOKEN: "d9cee3eebb83efbc6cc53a97b4b23c30"
      WORLD: "http://world:8080"

networks:
  p1-world:
    internal: true
    enable_ipv4: false
    enable_ipv6: true
  p2-world:
    internal: true
    enable_ipv4: false
    enable_ipv6: true
  p3-world:
    internal: true
    enable_ipv4: false
    enable_ipv6: true
