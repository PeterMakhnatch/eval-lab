name: deepplanning-canary

on:
  pull_request:
    branches: [main]
    paths:
      - "library/external/deepplanning-v1/**"
      - "src/evallab/deepplanning.py"
      - "tests/test_deepplanning.py"
      - "tests/test_deepplanning_canary.py"
      - ".github/workflows/deepplanning.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  canary-controls:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Install uv and Python
        run: |
          python3 -m pip install --user uv==0.9.24
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          uv tool install "harbor==0.21.0"
          uv python install 3.12
          uv sync --locked
      - name: Verify deterministic materialization
        run: |
          cp -a library/tasks/experimental/deepplanning-v1/travel-lisbon-002 "$RUNNER_TEMP/travel-lisbon-first"
          uv run python library/external/deepplanning-v1/materialize.py --task-id travel-lisbon-002
          diff -ru "$RUNNER_TEMP/travel-lisbon-first" library/tasks/experimental/deepplanning-v1/travel-lisbon-002
      - name: Run focused tests
        run: uv run pytest tests/test_deepplanning.py tests/test_deepplanning_canary.py -q
      - name: Run deterministic local controls
        run: bash library/external/deepplanning-v1/run_controls.sh
      - name: Run durable Harbor registration controls
        run: |
          harbor run --path library/tasks/experimental/deepplanning-v1/travel-lisbon-002 --agent oracle --env docker --job-name deepplanning-travel-lisbon-registry-oracle --jobs-dir runs/deepplanning-registry --n-concurrent 1 --n-attempts 1 -y
          harbor run --path library/tasks/experimental/deepplanning-v1/travel-lisbon-002 --agent nop --env docker --job-name deepplanning-travel-lisbon-registry-nop --jobs-dir runs/deepplanning-registry --n-concurrent 1 --n-attempts 1 -y
          python3 scripts/agentabstain/assert_reward.py runs/deepplanning-registry/deepplanning-travel-lisbon-registry-oracle 1
          python3 scripts/agentabstain/assert_reward.py runs/deepplanning-registry/deepplanning-travel-lisbon-registry-nop 0
      - name: Run Linux task-workbench controls
        run: uv run python library/external/deepplanning-v1/workbench.py | tee "$RUNNER_TEMP/deepplanning-workbench.json"
      - name: Upload certification packet
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: deepplanning-workbench-packet
          path: |
            research/registration/candidates/
            runs/task-workbench/
            runs/deepplanning-registry/
            ${{ runner.temp }}/deepplanning-workbench.json
          if-no-files-found: error
