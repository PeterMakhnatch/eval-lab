name: agentabstain-linux

# Ubuntu is required for Harbor's separate no-network verifier. The agent side
# remains the public-network baseline, explicitly avoiding a false isolation claim.
on:
  pull_request:
    branches: [main]
    paths:
      - "library/adapters/agentabstain/**"
      - "scripts/agentabstain/**"
      - "tests/test_agentabstain_lean.py"
      - ".github/workflows/agentabstain-linux.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  HARBOR_TELEMETRY: "off"
  # uv retries index HTTP requests 3 times by default (HAR-252).
  UV_HTTP_RETRIES: "5"

jobs:
  canary-controls:
    # HAR-345: deepplanning-canary and tau-knowledge-lean also had a job named
    # canary-controls, so their check runs shared one name and a red run here
    # read as a flake next to a green one there. Keep check names unique.
    name: agentabstain-linux-canary-controls
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install Python 3.12
        # HAR-339: uv's managed cpython download served 504 and reddened main
        # (perf run 42582557769, mcp-wheelhouse-platform run 42582557805).
        # setup-python resolves the runner toolcache before any download;
        # only-system keeps uv on that interpreter.
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Pin uv to the provisioned interpreter
        run: |
          echo "UV_PYTHON=3.12" >> "$GITHUB_ENV"
          echo "UV_PYTHON_PREFERENCE=only-system" >> "$GITHUB_ENV"
      - name: Install uv 0.9.24
        run: |
          python3 -m pip install --user uv==0.9.24
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Install Harbor 0.21.0
        run: uv tool install "harbor==0.21.0"
      - name: Cache locked Python packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        env:
          SEGMENT_DOWNLOAD_TIMEOUT_MINS: 2
        with:
          path: ~/.cache/uv
          key: uv-0.9.24-${{ runner.os }}-${{ runner.arch }}-3.12-agentabstain-${{ hashFiles('uv.lock', '.github/workflows/agentabstain-linux.yml') }}
          restore-keys: uv-0.9.24-${{ runner.os }}-${{ runner.arch }}-3.12-test-${{ hashFiles('uv.lock', '.github/workflows/ci.yml') }}
      - name: Materialize, regenerate, and run local controls
        # HAR-345: ci.py imports evallab, which needs PyYAML. Bare python3 found it
        # only in the Ubuntu system interpreter (apt python3-yaml); a setup-python
        # toolcache interpreter has none (run 42590293974). Run it in the locked env.
        run: uv run --locked --no-dev python scripts/agentabstain/ci.py
      - name: Locate generated canary
        id: generated
        run: echo "path=$(find derived/harbor-tasks/agentabstain -mindepth 1 -maxdepth 1 -type d -print -quit)" >> "$GITHUB_OUTPUT"
      - name: Harbor act oracle
        run: |
          harbor run --path "${{ steps.generated.outputs.path }}/agentabstain-ambiguous-action-preview-002-act" --agent oracle --env docker --job-name agentabstain-act-oracle --jobs-dir runs/agentabstain-linux --n-concurrent 1 --n-attempts 1 -y
          python3 scripts/agentabstain/assert_reward.py runs/agentabstain-linux/agentabstain-act-oracle 1
      - name: Harbor act NOP
        run: |
          harbor run --path "${{ steps.generated.outputs.path }}/agentabstain-ambiguous-action-preview-002-act" --agent nop --env docker --job-name agentabstain-act-nop --jobs-dir runs/agentabstain-linux --n-concurrent 1 --n-attempts 1 -y
          python3 scripts/agentabstain/assert_reward.py runs/agentabstain-linux/agentabstain-act-nop 0
      - name: Harbor abstain oracle
        run: |
          harbor run --path "${{ steps.generated.outputs.path }}/agentabstain-ambiguous-action-preview-002-abstain" --agent oracle --env docker --job-name agentabstain-abstain-oracle --jobs-dir runs/agentabstain-linux --n-concurrent 1 --n-attempts 1 -y
          python3 scripts/agentabstain/assert_reward.py runs/agentabstain-linux/agentabstain-abstain-oracle 1
      - name: Harbor abstain NOP
        run: |
          harbor run --path "${{ steps.generated.outputs.path }}/agentabstain-ambiguous-action-preview-002-abstain" --agent nop --env docker --job-name agentabstain-abstain-nop --jobs-dir runs/agentabstain-linux --n-concurrent 1 --n-attempts 1 -y
          python3 scripts/agentabstain/assert_reward.py runs/agentabstain-linux/agentabstain-abstain-nop 1
      - name: Harbor abstain mutant
        run: |
          cp "${{ steps.generated.outputs.path }}/agentabstain-ambiguous-action-preview-002-abstain/workbench/mutant.sh" "${{ steps.generated.outputs.path }}/agentabstain-ambiguous-action-preview-002-abstain/solution/solve.sh"
          chmod +x "${{ steps.generated.outputs.path }}/agentabstain-ambiguous-action-preview-002-abstain/solution/solve.sh"
          harbor run --path "${{ steps.generated.outputs.path }}/agentabstain-ambiguous-action-preview-002-abstain" --agent oracle --env docker --job-name agentabstain-abstain-mutant --jobs-dir runs/agentabstain-linux --n-concurrent 1 --n-attempts 1 -y
          python3 scripts/agentabstain/assert_reward.py runs/agentabstain-linux/agentabstain-abstain-mutant 0
      - name: Reject committed generated corpus and reports
        run: |
          test -z "$(git ls-files 'derived/harbor-tasks/**' 'library/adapters/agentabstain/raw/**' 'library/adapters/agentabstain/reports/**' 'library/tasks/agentabstain-*' 'library/tasks/agentabstain-*/**')"
      - name: Upload immutable raw CAS jobs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: agentabstain-linux-cas
          path: runs/agentabstain-linux/
          if-no-files-found: warn
