schema_version = "1.4"

[task]
name = "fx-c2/release-ledger-order"
version = "1.0.0"
description = "Read the migrated release-history export and return release ids in ledger row order"
keywords = ["python", "release-history", "tsv-export"]

[metadata]
category = "Python"
domain = "code"
difficulty = "medium"

[agent]
timeout_sec = 900.0

[verifier]
timeout_sec = 300.0
user = "root"

[environment]
workdir = "/app"
cpus = 2
memory_mb = 4096
storage_mb = 4096
network_mode = "public"
build_timeout_sec = 1200.0
