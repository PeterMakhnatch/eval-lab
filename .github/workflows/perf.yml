name: perf

# Median-budget ratchet for the SPEED harness. Fails when a path exceeds
# the committed budget by more than tolerance_pct. See docs/engineering.md.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  profile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18.4-alpine3.24
        env:
          POSTGRES_DB: evallab_speed_prof
          POSTGRES_USER: evallab
          POSTGRES_PASSWORD: profile-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U evallab -d evallab_speed_prof"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    env:
      EVAL_LAB_PROFILE_DATABASE_URL: postgresql://evallab:profile-only@127.0.0.1:5432/evallab_speed_prof
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install uv 0.9.24 from PyPI
        run: |
          python3 -m pip install --user uv==0.9.24
          echo "$HOME/.local/bin" >> $GITHUB_PATH
      - name: Install Python 3.12
        run: |
          uv python install 3.12
          echo "UV_PYTHON=3.12" >> $GITHUB_ENV
      - run: uv sync --locked --no-default-groups
      - name: profile harness
        run: |
          chmod +x scripts/profile/gh_stub.sh
          uv run python scripts/profile/harness.py \
            --output-dir runs/_speed \
            --warmup 1 \
            --reps 5
      - name: budget ratchet
        run: uv run python scripts/profile/check_budgets.py runs/_speed/profile-report.json
      - name: upload report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: speed-profile-report
          path: runs/_speed/profile-report.*
