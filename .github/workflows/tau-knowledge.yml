name: tau-knowledge-lean

on:
  pull_request:
    paths:
      - "library/benchmarks/tau-knowledge/**"
      - "scripts/tau_knowledge/**"
      - "tests/test_tau_knowledge_lean.py"
      - ".github/workflows/tau-knowledge.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  canary-controls:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Reject committed generated corpus
        run: |
          python3 -c 'import subprocess,sys; p=subprocess.check_output(["git","ls-files"],text=True).splitlines(); bad=[x for x in p if x.startswith(("library/benchmarks/tau-knowledge/generated/","library/benchmarks/tau-knowledge/evidence/trials/","library/benchmarks/tau-knowledge/evidence/luna/")) or (x.startswith("library/benchmarks/tau-knowledge/") and x.endswith(".parquet"))]; print("forbidden tracked paths:", bad); sys.exit(bool(bad))'
      - name: Install uv
        run: |
          python3 -m pip install --user uv==0.9.24
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Pin tau2 source and Harbor adapter
        run: |
          git clone --depth 1 --branch v1.0.1 https://github.com/sierra-research/tau2-bench.git "$RUNNER_TEMP/tau2-bench"
          git -C "$RUNNER_TEMP/tau2-bench" checkout fc0055dc4e0a316c3f83133267fbd6faaa770992
          git clone --filter=blob:none https://github.com/harbor-framework/harbor.git "$RUNNER_TEMP/harbor"
          git -C "$RUNNER_TEMP/harbor" checkout 636a2d0295d3ee233666bcd7d77fa81f7f090a19
          uv sync --locked --project "$RUNNER_TEMP/harbor"
      - name: Materialize canary and prove deterministic regeneration
        env:
          TAU2_BENCH_ROOT: ${{ runner.temp }}/tau2-bench
          TAU3_BENCH_ADAPTER_ROOT: ${{ runner.temp }}/harbor
        run: |
          mkdir -p derived/harbor-tasks/tau
          python3 scripts/tau_knowledge/materialize.py --task-id task_001 --output-root "$GITHUB_WORKSPACE/derived/harbor-tasks/tau" > "$RUNNER_TEMP/task-root.txt"
          task_root="$(cat "$RUNNER_TEMP/task-root.txt")"
          cp -a "$task_root" "$RUNNER_TEMP/tau-first"
          python3 scripts/tau_knowledge/materialize.py --task-id task_001 --output-root "$GITHUB_WORKSPACE/derived/harbor-tasks/tau" --overwrite > /dev/null
          diff -ru "$RUNNER_TEMP/tau-first" "$task_root"
          test -f "$task_root/tau3-banking_knowledge-task-001/task.toml"
          echo "TASK_ROOT=$task_root" >> "$GITHUB_ENV"
      - name: Run oracle, nop, and mutant controls
        env:
          HARBOR_ROOT: ${{ runner.temp }}/harbor
          # Required only for task.toml interpolation; endpoint is unreachable and unused by controls.
          OPENAI_API_KEY: ci-unused-marker
          OPENAI_BASE_URL: http://127.0.0.1:9/v1
          TAU_TRIALS_ROOT: ${{ runner.temp }}/tau-trials
        run: |
          cd "$HARBOR_ROOT"
          python3 "$GITHUB_WORKSPACE/scripts/tau_knowledge/controls.py" --task "$TASK_ROOT/tau3-banking_knowledge-task-001" --mode oracle --trials-dir "$TAU_TRIALS_ROOT/oracle" --expect-reward 1
          python3 "$GITHUB_WORKSPACE/scripts/tau_knowledge/controls.py" --task "$TASK_ROOT/tau3-banking_knowledge-task-001" --mode nop --trials-dir "$TAU_TRIALS_ROOT/nop" --expect-reward 0
          python3 "$GITHUB_WORKSPACE/scripts/tau_knowledge/controls.py" --task "$TASK_ROOT/tau3-banking_knowledge-task-001" --mode mutant --trials-dir "$TAU_TRIALS_ROOT/mutant" --expect-reward 0
