# Standing approvals: what may run WITHOUT a human in the loop.
#
# `auto_run` may only ever list free local controls. A billable agent (anything
# other than oracle/nop) is refused by `PolicyGate.decide` before any standing
# rule is consulted, and is admitted only against an authorisation recorded in
# `queue/events.jsonl` by `uv run evallab approve <spec-id> --actor <you>`.
# Adding a billable agent below therefore grants nothing; it only misstates
# what this lab does. See docs/operations.md, "Paid execution requires a
# recorded authorisation".
#
# Dollar ceilings constrain proposed execution; API-key trials spend actual
# provider balance, while subscription-backed trials consume provider quota.
# Neither a list-price estimate nor a subscription quota reading substitutes
# for the other. Preserve unknown charges and explicit per-trial limits.
#
# `refuse_billable_at_used_percent` is the lab's OWN threshold, below the
# provider's limit. It was deliberately unset until the 2026-10-13 overnight
# subscription-agent work, which Peter approved with an explicit pause rule:
# billable dispatch refuses when the provider-reported weekly window is above
# 60% used. 60 trades the risk of a mid-campaign lockout (the shared account,
# ~5 other tabs, moves the same counter in whole points) against the certainty
# of work that will not happen. Billable dispatch refuses at or above 60%
# account-wide `used_percent` under reason code `subscription_quota_ceiling`,
# kept distinct from the provider's own `subscription_quota_exhausted` so
# `queue/reasons/` never records a lab policy as the provider's statement.
# `0` is refused at load rather than accepted, because it reads as "off" while
# meaning "refuse all paid work". Lower the number to tighten; raising it or
# returning it to `null` is a spend decision for Peter.
version: 1
daily_cost_ceiling_usd: 20
daily_cost_ceiling_overrides:
  - utc_date: 2026-10-01
    ceiling_usd: 35
    expires_at: 2026-10-02T00:00:00Z
    approved_by: Research-Harbor HAR-126 ruling 2026-10-01T08:42Z
    approval_quote: Peter 2026-10-01 ~03:55Z "i approve like a $30 budget for runs total", from 04:00Z, plus ~$5 approved earlier on HAR-116
    card: HAR-126
per_job_cost_ceiling_usd: 3
quiet_failure_rule: 3
refuse_billable_at_used_percent: 60
auto_run:
  - name: local-controls
    agents: [oracle, nop]
escalate_to_human:
  - any_billable_agent
  - new_task_registration
  - cloud_or_remote_environment
  - anything_exceeding_ceilings
  - subscription_quota_exhausted
