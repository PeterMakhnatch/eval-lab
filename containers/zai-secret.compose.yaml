services:
  main:
    environment:
      ZAI_CODING_PLAN_API_KEY: evallab-proxy-placeholder
      ZAI_API_KEY: evallab-proxy-placeholder
      ZAI_BASE_URL: http://zai-secret-proxy:8080
      OPENAI_BASE_URL: http://zai-secret-proxy:8080
      OPENAI_API_BASE: http://zai-secret-proxy:8080
    depends_on:
      zai-secret-proxy:
        condition: service_healthy

  zai-secret-proxy:
    image: python:3.12.11-slim@sha256:47ae396f09c1303b8653019811a8498470603d7ffefc29cb07c88f1f8cb3d19f
    user: "${EVALLAB_PROXY_UID:?}:${EVALLAB_PROXY_GID:?}"
    command: ["python", "/opt/evallab/zai_secret_proxy.py"]
    networks:
      - default
      - workbench-internal
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
      EVALLAB_ZAI_SECRET_PATH: /run/secrets/evallab_zai_api_key
      EVALLAB_ZAI_UPSTREAM: ${EVALLAB_ZAI_UPSTREAM:-https://api.z.ai}
      EVALLAB_ZAI_PROXY_CAPABILITY: ${EVALLAB_ZAI_PROXY_CAPABILITY:?proxy capability required}
      EVALLAB_ZAI_CAPABILITY_EXPIRES_AT: ${EVALLAB_ZAI_CAPABILITY_EXPIRES_AT:-}
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    volumes:
      - "${EVALLAB_ZAI_PROXY_SCRIPT:?proxy script path required}:/opt/evallab/zai_secret_proxy.py:ro"
      - "${EVALLAB_ZAI_SECRET_FILE:?Z.ai secret file path required}:/run/secrets/evallab_zai_api_key:ro"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=2)",
        ]
      interval: 2s
      timeout: 2s
      retries: 15
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

networks:
  workbench-internal:
    internal: true
