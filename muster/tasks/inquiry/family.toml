name = "inquiry"
description = """
A desk clerk files exact stock figures using replies from scripted colleagues.
Every reply is true for its stated scope, but the scope can differ from the question.
The clerk can name fields to correct within a shared question budget.
The probe arm uses sentences; fields uses structured replies; flagged identifies differences.
The solo arm supplies the settling records without colleagues.
The committed card.json (muster card inquiry --write) is the reference.
"""
seed = "inquiry-v2.4"
instances = 10
facets = ["plain", "month", "part", "range", "silent", "mixed"]
arms = ["probe", "fields", "flagged", "solo"]
policies = ["oracle", "truster", "persistent", "idle"]
known_limits = [
    "It does not show that any model fails. The prior work suggests that some frontier models pass single defects; mixed is where the headroom is. A loss in mixed can also come from more chances to err: the per-kind shares and the single facets on the same instances separate that.",
    "The sentences are fixed forms that state the scope in full. Free conversation, where the mismatch is implied, is harder. This family tests the check and the correction, not the reading of loose prose.",
    "It has 1 real agent. It is a probe of 1 side of communication, like standin, not a team run.",
    "The flagged arm tells the agent what differs; it does not force a correct filing. It measures the total effect of the hint under fixed conditions.",
    "The chain case adapts to the fields that the clerk names. It is a designed adversary, not a natural colleague. Its seeded next mismatch can be guessed by chance, and unit conversion can resolve a crate reply without a correction. It says nothing about how often real colleagues introduce a new mismatch.",
    "A failure can have other causes: arithmetic and filing (the solo arm separates it), reading the sentence (the fields arm separates it), tool calls sent in 1 batch before any reply is read (the step join of muster events separates it), an exhausted budget (refused_for_budget).",
    "The blind fixed-field baselines pass their own single facet on some instances by chance. A single-facet result on few instances must be read against those baselines.",
]

[skills]
match = "Check the month against the question."
cover = "Check that the reply covers every part of the site."
exact = "Require an exact figure instead of a range."
retry = "Ask again when no reply came."
convert = "Convert crates to kg."
recheck = "Check the scope of a corrected reply again."

[needs]
plain = []
month = ["match"]
part = ["cover"]
range = ["exact"]
silent = ["retry"]
mixed = ["match", "cover", "exact", "convert", "recheck"]
