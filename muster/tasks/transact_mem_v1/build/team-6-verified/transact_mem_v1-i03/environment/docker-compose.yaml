x-seat: &seat
  user: agent
  working_dir: /home/agent
  command: ["sleep", "infinity"]
  init: true
  depends_on:
    main:
      condition: service_healthy

services:
  main:
    command: ["python3", "/world/world.py"]
    environment:
      SEAT_TOKENS: "{\"299d9acb40e54bf6c30f3915645c0b06\": \"lead\", \"502c5eb5a61cf01e8be48a0e08c2386e\": \"s3\", \"61486dc2f1c961a4a27d419faecf2159\": \"s4\", \"7d38d2a84a74491adfe3eea8d881de0d\": \"auditor\", \"992b6e480a9cfd7e29e5bb198b6f1b48\": \"s2\", \"b457ada09bc9cf4ea69d89b10357e8f5\": \"s1\"}"
    networks:
      lead-world:
        aliases: [world]
      s1-world:
        aliases: [world]
      s2-world:
        aliases: [world]
      s3-world:
        aliases: [world]
      s4-world:
        aliases: [world]
      auditor-world:
        aliases: [world]
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health', timeout=2)"]
      interval: 2s
      timeout: 5s
      retries: 15
      start_period: 2s
  lead:
    <<: *seat
    build: ./seat_lead
    networks: [lead-world]
    environment:
      SEAT: "lead"
      SEAT_TOKEN: "299d9acb40e54bf6c30f3915645c0b06"
      WORLD: "http://world:8080"
  s1:
    <<: *seat
    build: ./seat_s1
    networks: [s1-world]
    environment:
      SEAT: "s1"
      SEAT_TOKEN: "b457ada09bc9cf4ea69d89b10357e8f5"
      WORLD: "http://world:8080"
  s2:
    <<: *seat
    build: ./seat_s2
    networks: [s2-world]
    environment:
      SEAT: "s2"
      SEAT_TOKEN: "992b6e480a9cfd7e29e5bb198b6f1b48"
      WORLD: "http://world:8080"
  s3:
    <<: *seat
    build: ./seat_s3
    networks: [s3-world]
    environment:
      SEAT: "s3"
      SEAT_TOKEN: "502c5eb5a61cf01e8be48a0e08c2386e"
      WORLD: "http://world:8080"
  s4:
    <<: *seat
    build: ./seat_s4
    networks: [s4-world]
    environment:
      SEAT: "s4"
      SEAT_TOKEN: "61486dc2f1c961a4a27d419faecf2159"
      WORLD: "http://world:8080"
  auditor:
    <<: *seat
    build: ./seat_auditor
    networks: [auditor-world]
    environment:
      SEAT: "auditor"
      SEAT_TOKEN: "7d38d2a84a74491adfe3eea8d881de0d"
      WORLD: "http://world:8080"

networks:
  lead-world:
    internal: true
    enable_ipv4: false
    enable_ipv6: true
  s1-world:
    internal: true
    enable_ipv4: false
    enable_ipv6: true
  s2-world:
    internal: true
    enable_ipv4: false
    enable_ipv6: true
  s3-world:
    internal: true
    enable_ipv4: false
    enable_ipv6: true
  s4-world:
    internal: true
    enable_ipv4: false
    enable_ipv6: true
  auditor-world:
    internal: true
    enable_ipv4: false
    enable_ipv6: true
