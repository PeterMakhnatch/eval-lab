name: mcp-funcdag-v1

on:
  push:
    branches: [main]
    paths:
      - "library/benchmarks/mcp-funcdag-v1/**"
      - "scripts/mcp_funcdag/**"
      - "tests/test_mcp_funcdag_v1.py"
      - ".github/workflows/mcp-funcdag.yml"
  pull_request:
    branches: [main]
    paths:
      - "library/benchmarks/mcp-funcdag-v1/**"
      - "scripts/mcp_funcdag/**"
      - "tests/test_mcp_funcdag_v1.py"
      - ".github/workflows/mcp-funcdag.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract-and-controls:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Reject committed generated task corpus
        run: |
          python3 -c 'import subprocess, sys; p = subprocess.check_output(["git", "ls-files"], text=True).splitlines(); bad = [x for x in p if x.startswith(("derived/harbor-tasks/mcp-funcdag/", "library/benchmarks/mcp-funcdag-v1/derived/"))]; print("forbidden tracked paths:", bad); sys.exit(bool(bad))'
      - name: Run CI contract (regeneration, oracle, NOP, mutants)
        run: python3 library/benchmarks/mcp-funcdag-v1/ci_contract.py
      - name: Run Campaign 0 calibration grid
        run: python3 scripts/mcp_funcdag/run_calibration.py
      - name: Run focused pytest suite
        run: |
          pip install pytest
          pytest tests/test_mcp_funcdag_v1.py -v
