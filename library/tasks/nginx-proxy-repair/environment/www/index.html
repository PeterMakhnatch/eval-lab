<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Acme Status</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <h1>Acme Status</h1>
  <p id="status">Loading…</p>
  <script>
    fetch("/api/health")
      .then(r => r.json())
      .then(d => { document.getElementById("status").textContent = "Backend: " + d.status; })
      .catch(() => { document.getElementById("status").textContent = "Backend unreachable"; });
  </script>
</body>
</html>
