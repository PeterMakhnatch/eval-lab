description: Squad plan with two 3-step chains, max active steps 2, retry policy, fake agents, and real omp call
max_active_steps: 2

params:
  LEDGER: /Users/petermakhnatch/Developer/eval-lab-results/2026-11-02/F8/dagu/squad-ledger.jsonl
  REPORT_DIR: /Users/petermakhnatch/Developer/eval-lab-results/2026-11-02/F8/dagu/squad-reports
  ITEM_SECONDS: 20

steps:
  # Chain A
  - id: step_a1
    name: "Chain A - Step 1"
    run: python3 /Users/petermakhnatch/Developer/eval-lab/.worktrees/on-f8-dagu-trial-20261102/research/experiments/on-dagu-trial-20261102/fake_agent.py --id A1 --ledger "${LEDGER}" --report "${REPORT_DIR}/A1.md" --seconds ${ITEM_SECONDS}
    retry_policy:
      limit: 2
      interval_sec: 1

  - id: step_a2
    name: "Chain A - Step 2"
    depends: [step_a1]
    run: python3 /Users/petermakhnatch/Developer/eval-lab/.worktrees/on-f8-dagu-trial-20261102/research/experiments/on-dagu-trial-20261102/fake_agent.py --id A2 --ledger "${LEDGER}" --report "${REPORT_DIR}/A2.md" --seconds ${ITEM_SECONDS}
    retry_policy:
      limit: 2
      interval_sec: 1

  - id: step_a3
    name: "Chain A - Step 3"
    depends: [step_a2]
    run: python3 /Users/petermakhnatch/Developer/eval-lab/.worktrees/on-f8-dagu-trial-20261102/research/experiments/on-dagu-trial-20261102/fake_agent.py --id A3 --ledger "${LEDGER}" --report "${REPORT_DIR}/A3.md" --seconds ${ITEM_SECONDS}
    retry_policy:
      limit: 2
      interval_sec: 1

  # Chain B
  - id: step_b1
    name: "Chain B - Step 1"
    run: python3 /Users/petermakhnatch/Developer/eval-lab/.worktrees/on-f8-dagu-trial-20261102/research/experiments/on-dagu-trial-20261102/fake_agent.py --id B1 --ledger "${LEDGER}" --report "${REPORT_DIR}/B1.md" --seconds ${ITEM_SECONDS}
    retry_policy:
      limit: 2
      interval_sec: 1

  - id: step_b2
    name: "Chain B - Step 2"
    depends: [step_b1]
    run: python3 /Users/petermakhnatch/Developer/eval-lab/.worktrees/on-f8-dagu-trial-20261102/research/experiments/on-dagu-trial-20261102/fake_agent.py --id B2 --ledger "${LEDGER}" --report "${REPORT_DIR}/B2.md" --seconds ${ITEM_SECONDS}
    retry_policy:
      limit: 2
      interval_sec: 1

  - id: step_b3
    name: "Chain B - Step 3"
    depends: [step_b2]
    run: python3 /Users/petermakhnatch/Developer/eval-lab/.worktrees/on-f8-dagu-trial-20261102/research/experiments/on-dagu-trial-20261102/fake_agent.py --id B3 --ledger "${LEDGER}" --report "${REPORT_DIR}/B3.md" --seconds ${ITEM_SECONDS}
    retry_policy:
      limit: 2
      interval_sec: 1

  # Real omp agent step
  - id: step_real_agent
    name: "Real OMP Agent (gemini-3.8-flash)"
    depends: [step_a3, step_b3]
    run: |
      omp -p "Summarize in one sentence that squad plan tasks A1..A3 and B1..B3 have completed." \
        --model google-antigravity/gemini-3.8-flash \
        --config /Users/petermakhnatch/Developer/research-context/bridge/2026-11-02-overnight/wf/worker.yml \
        --no-skills \
        --no-tools \
        --session-dir /Users/petermakhnatch/Developer/eval-lab-results/2026-11-02/F8/dagu/omp-sessions
