schema_version = "1.4"
artifacts = ["/logs/world/events.jsonl"]

[task]
name = "muster/replan_v1-i06"
description = "replan_v1-i06, condition indep-3: 3 silent seats without a channel, 3 commits per seat, adapt to mid-flight Epoch 2 replan without committing stale Epoch 1 records."
keywords = ["seats", "multi-agent", "muster"]

[metadata]
family = "replan_v1"
condition = "indep-3"
instance = 6
seats_count = 3
channel = false
notices = false
epoch_fence = false
oracle_reward = 0.3
exploits = ["spoof"]

[verifier]
timeout_sec = 120.0

[agent]
timeout_sec = 600.0

[environment]
build_timeout_sec = 600.0

[environment.env]
COMPOSE_BAKE = "false"

[agents.p1]

[agents.p2]

[agents.p3]
