services:
  continuous-operator:
    build:
      context: ../..
      dockerfile: containers/continuous-operator/Dockerfile
    restart: "no"
    profiles: ["manual"]
    user: "65532:65532"
    read_only: true
    environment:
      EVAL_LAB_OPERATOR_STATE: /var/lib/evallab-operator
    tmpfs:
      - /tmp:mode=0700
      - /var/lib/evallab-operator:mode=0700
    command: ["validate", "--state-dir", "/var/lib/evallab-operator"]
