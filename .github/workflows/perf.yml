name: perf

# Keep the profile check visible even when a proven documentation-only diff skips it.
on:
  pull_request:
    branches: [main, "integrate/**"]
  push:
    branches: [main, "integrate/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # uv retries index HTTP requests 3 times by default (HAR-252).
  UV_HTTP_RETRIES: "5"

jobs:
  scope:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      profile: ${{ steps.changes.outputs.profile }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Classify exact change set
        id: changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 scripts/profile/change_scope.py "$BASE_SHA" "$HEAD_SHA" >> "$GITHUB_OUTPUT"

  profile:
    needs: scope
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        # An empty image disables the service; docs-only runs do not start PostgreSQL.
        # mirror.gcr.io is Google's public pull-through mirror of Docker Hub library
        # images (same tags); avoids anonymous Docker Hub auth from GitHub runners.
        image: ${{ needs.scope.outputs.profile == 'true' && 'mirror.gcr.io/library/postgres:18.4-alpine3.24' || '' }}
        env:
          POSTGRES_DB: evallab_speed_prof
          POSTGRES_USER: evallab
          POSTGRES_PASSWORD: profile-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U evallab -d evallab_speed_prof"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    env:
      EVAL_LAB_PROFILE_DATABASE_URL: postgresql://evallab:profile-only@127.0.0.1:5432/evallab_speed_prof
    steps:
      - name: Document safe profiling omission
        if: needs.scope.outputs.profile == 'false'
        run: |
          echo "Documentation-only diff: no performance service or profiling run needed."
          echo "Documentation and governance remain required in the quality workflow." >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        if: needs.scope.outputs.profile == 'true'
        with:
          fetch-depth: 0
      - name: Install Python 3.12
        if: needs.scope.outputs.profile == 'true'
        # HAR-339: uv's managed cpython download served 504 and reddened main
        # (perf run 42582557769, mcp-wheelhouse-platform run 42582557805).
        # setup-python resolves the runner toolcache before any download;
        # only-system keeps uv on that interpreter.
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Pin uv to the provisioned interpreter
        if: needs.scope.outputs.profile == 'true'
        run: |
          echo "UV_PYTHON=3.12" >> $GITHUB_ENV
          echo "UV_PYTHON_PREFERENCE=only-system" >> $GITHUB_ENV
      - name: Install uv 0.9.24 from PyPI
        if: needs.scope.outputs.profile == 'true'
        run: |
          python3 -m pip install --user uv==0.9.24
          echo "$HOME/.local/bin" >> $GITHUB_PATH
      - name: Cache locked Python packages
        if: needs.scope.outputs.profile == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        env:
          SEGMENT_DOWNLOAD_TIMEOUT_MINS: 2
        with:
          path: ~/.cache/uv
          key: uv-0.9.24-${{ runner.os }}-${{ runner.arch }}-3.12-perf-${{ hashFiles('uv.lock', '.github/workflows/perf.yml') }}
          restore-keys: uv-0.9.24-${{ runner.os }}-${{ runner.arch }}-3.12-test-${{ hashFiles('uv.lock', '.github/workflows/ci.yml') }}
      - name: Install profiling dependencies
        if: needs.scope.outputs.profile == 'true'
        run: uv sync --locked --no-default-groups
      - name: profile harness
        if: needs.scope.outputs.profile == 'true'
        # The exporters fsync every table they publish (16 fsyncs per 'projection' rep, 24
        # per 'facts' rep). On a shared runner the disk's fsync latency varies 10-30x between
        # jobs, so scratch lives on tmpfs and the gate measures the code, not the disk.
        run: |
          chmod +x scripts/profile/gh_stub.sh
          uv run --no-sync python scripts/profile/harness.py \
            --output-dir runs/_speed \
            --scratch-dir /dev/shm/evallab-speed \
            --warmup 1 \
            --reps 5
      - name: budget ratchet
        if: needs.scope.outputs.profile == 'true'
        # A single breach is re-profiled once -- only the breached paths, with the same
        # corpus pin, warmup and reps -- before it fails the run. Both medians land in
        # runs/_speed/profile-report.json: shared-runner spikes were reddening main with
        # medians the other 29 runs of the same code never reproduced.
        run: |
          uv run --no-sync python scripts/profile/check_budgets.py \
            runs/_speed/profile-report.json \
            --reprofile
      - name: upload report
        if: always() && needs.scope.outputs.profile == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: speed-profile-report
          path: runs/_speed/profile-report.*
