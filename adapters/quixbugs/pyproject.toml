[project]
name = "harbor-quixbugs-adapter"
version = "0.1.0"
description = "Reproducible Harbor adapter for the QuixBugs program-repair benchmark"
readme = "README.md"
authors = [
    { name = "Peter Makhnatch", email = "p.makhnatch@gmail.com" }
]
requires-python = ">=3.11"
dependencies = []

[project.scripts]
quixbugs = "quixbugs.main:main"

[build-system]
requires = ["uv_build>=0.9.24,<0.10.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "quixbugs"
