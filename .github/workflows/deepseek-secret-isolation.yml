name: deepseek-secret-isolation

on:
  pull_request:
    paths:
      - "src/evallab/harbor_deepseek.py"
      - "src/evallab/execution_contracts.py"
      - "src/evallab/runner.py"
      - "containers/deepseek-v4-flash-secret.compose.yaml"
      - "containers/deepseek_secret_proxy.py"
      - "tests/test_harbor_deepseek.py"
      - "tests/test_deepseek_v4_flash_lane.py"
      - ".github/workflows/deepseek-secret-isolation.yml"
  push:
    branches: [main]
    paths:
      - "src/evallab/harbor_deepseek.py"
      - "src/evallab/execution_contracts.py"
      - "src/evallab/runner.py"
      - "containers/deepseek-v4-flash-secret.compose.yaml"
      - "containers/deepseek_secret_proxy.py"
      - "tests/test_harbor_deepseek.py"
      - "tests/test_deepseek_v4_flash_lane.py"
      - ".github/workflows/deepseek-secret-isolation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install uv 0.9.24 from PyPI
        run: |
          python3 -m pip install --user uv==0.9.24
          echo "$HOME/.local/bin" >> $GITHUB_PATH
      - name: Install Python 3.12
        run: |
          uv python install 3.12
          echo "UV_PYTHON=3.12" >> $GITHUB_ENV
      - run: uv sync --locked --no-group observability
      - run: uv run --no-sync ruff check src/evallab/harbor_deepseek.py src/evallab/execution_contracts.py src/evallab/runner.py containers/deepseek_secret_proxy.py tests/test_harbor_deepseek.py tests/test_deepseek_v4_flash_lane.py tests/test_execution_contracts.py
      - name: ty check
        run: uvx ty@0.0.71 check src/evallab/harbor_deepseek.py src/evallab/execution_contracts.py src/evallab/runner.py containers/deepseek_secret_proxy.py --output-format=concise
      - run: uv run --no-sync pytest -q -n 0 tests/test_harbor_deepseek.py tests/test_deepseek_v4_flash_lane.py tests/test_execution_contracts.py
      - name: Linux Docker proxy smoke
        run: |
          set -euo pipefail
          secret="$(mktemp -d)"
          chmod 700 "$secret"
          printf 'smoke-secret-must-not-leak\n' > "$secret/key"
          chmod 400 "$secret/key"
          python3 - <<'PY' &
          from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer
          from pathlib import Path
          class H(BaseHTTPRequestHandler):
              def log_message(self, format, *args):
                  return
              def do_POST(self):
                  length = int(self.headers.get("Content-Length", "0"))
                  self.rfile.read(length)
                  auth = self.headers.get("Authorization", "")
                  Path("/tmp/evallab-upstream-auth").write_text(auth)
                  body = b'{"choices":[{"message":{"content":"ok"}}],"usage":{"prompt_tokens":1,"completion_tokens":1}}'
                  self.send_response(200)
                  self.send_header("Content-Length", str(len(body)))
                  self.end_headers()
                  self.wfile.write(body)
          ThreadingHTTPServer(("0.0.0.0", 8099), H).serve_forever()
          PY
          upstream_pid=$!
          proxy_uid="$(id -u)"
          proxy_gid="$(id -g)"
          docker run --rm -d --name evallab-deepseek-proxy-smoke \
            --user "$proxy_uid:$proxy_gid" \
            --read-only \
            --tmpfs /tmp:size=16m,mode=1777 \
            --security-opt no-new-privileges \
            --cap-drop ALL \
            -e EVALLAB_DEEPSEEK_UPSTREAM=http://172.17.0.1:8099 \
            -e EVALLAB_DEEPSEEK_SECRET_PATH=/run/secrets/evallab_deepseek_api_key \
            -e EVALLAB_DEEPSEEK_PROXY_CAPABILITY=smoke-capability-token-32b-minimum \
            -e EVALLAB_DEEPSEEK_ALLOWED_MODEL=deepseek-v4-flash \
            -e EVALLAB_DEEPSEEK_MAX_REQUESTS=2 \
            -e EVALLAB_DEEPSEEK_MAX_INPUT_TOKENS=128 \
            -e EVALLAB_DEEPSEEK_MAX_OUTPUT_TOKENS=16 \
            -e EVALLAB_DEEPSEEK_MAX_COST_MICROS=1000 \
            -e EVALLAB_DEEPSEEK_INPUT_COST_MICROS_PER_MILLION=1 \
            -e EVALLAB_DEEPSEEK_OUTPUT_COST_MICROS_PER_MILLION=1 \
            -e EVALLAB_DEEPSEEK_CAPABILITY_EXPIRES_AT=4102444800 \
            -v "$PWD/containers/deepseek_secret_proxy.py:/opt/evallab/deepseek_secret_proxy.py:ro" \
            -v "$secret/key:/run/secrets/evallab_deepseek_api_key:ro" \
            -p 18080:8080 python:3.12-alpine \
            python /opt/evallab/deepseek_secret_proxy.py
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18080/healthz >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:18080/healthz | grep -qx ok
          curl -fsS -H 'Authorization: Bearer smoke-capability-token-32b-minimum' \
            -H 'Content-Type: application/json' \
            --data '{"model":"deepseek-v4-flash","max_tokens":1,"messages":[{"role":"user","content":"hi"}]}' \
            http://127.0.0.1:18080/v1/chat/completions | grep -q ok
          grep -qx 'Bearer smoke-secret-must-not-leak' /tmp/evallab-upstream-auth
          if curl -fsS -H 'Authorization: Bearer smoke-capability-token-32b-minimum' \
            -H 'Content-Type: application/json' \
            --data '{"model":"deepseek-chat","max_tokens":1}' \
            http://127.0.0.1:18080/v1/chat/completions; then
            echo 'wrong model was proxied' >&2
            exit 1
          fi
          if docker exec evallab-deepseek-proxy-smoke printenv | grep -F 'smoke-secret-must-not-leak'; then
            echo 'provider key leaked into proxy process environment' >&2
            exit 1
          fi
          docker rm -f evallab-deepseek-proxy-smoke
          wrong="$(mktemp)"
          printf 'wrong-owner-secret\n' > "$wrong"
          chmod 400 "$wrong"
          sudo chown 65534:65534 "$wrong"
          docker run --rm -d --name evallab-deepseek-proxy-wrong \
            --user "$proxy_uid:$proxy_gid" \
            --read-only \
            --tmpfs /tmp:size=16m,mode=1777 \
            --security-opt no-new-privileges \
            --cap-drop ALL \
            -e EVALLAB_DEEPSEEK_UPSTREAM=http://172.17.0.1:8099 \
            -e EVALLAB_DEEPSEEK_SECRET_PATH=/run/secrets/evallab_deepseek_api_key \
            -e EVALLAB_DEEPSEEK_PROXY_CAPABILITY=smoke-capability-token-32b-minimum \
            -e EVALLAB_DEEPSEEK_ALLOWED_MODEL=deepseek-v4-flash \
            -e EVALLAB_DEEPSEEK_MAX_REQUESTS=2 \
            -e EVALLAB_DEEPSEEK_MAX_INPUT_TOKENS=128 \
            -e EVALLAB_DEEPSEEK_MAX_OUTPUT_TOKENS=16 \
            -e EVALLAB_DEEPSEEK_MAX_COST_MICROS=1000 \
            -e EVALLAB_DEEPSEEK_INPUT_COST_MICROS_PER_MILLION=1 \
            -e EVALLAB_DEEPSEEK_OUTPUT_COST_MICROS_PER_MILLION=1 \
            -e EVALLAB_DEEPSEEK_CAPABILITY_EXPIRES_AT=4102444800 \
            -v "$PWD/containers/deepseek_secret_proxy.py:/opt/evallab/deepseek_secret_proxy.py:ro" \
            -v "$wrong:/run/secrets/evallab_deepseek_api_key:ro" \
            -p 18081:8080 python:3.12-alpine \
            python /opt/evallab/deepseek_secret_proxy.py
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18081/healthz >/dev/null; then break; fi
            sleep 1
          done
          if curl -fsS -H 'Authorization: Bearer smoke-capability-token-32b-minimum' \
            -H 'Content-Type: application/json' \
            --data '{"model":"deepseek-v4-flash","max_tokens":1,"messages":[{"role":"user","content":"hi"}]}' \
            http://127.0.0.1:18081/v1/chat/completions; then
            echo 'wrong-owner secret was accepted' >&2
            exit 1
          fi
          docker rm -f evallab-deepseek-proxy-wrong
          rm -f "$wrong"
          kill "$upstream_pid"
          rm -rf "$secret"
