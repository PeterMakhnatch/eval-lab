[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "harbor-experiment-lab"
version = "0.1.0"
description = "Reproducible local infrastructure and analysis for Harbor evaluations"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.5.5",
    "psycopg[binary]>=3.2,<4",
    "pyarrow>=25.0.1",
    "pydantic>=2.13.4",
    "pyyaml>=6.0.3",
]

[project.scripts]
harbor-lab = "harbor_lab.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.4,<9",
    "ruff>=0.12,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/harbor_lab"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["tasks/terminal-bench-html-js-filter"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tasks/query-optimize/**" = ["B011", "B905"]
