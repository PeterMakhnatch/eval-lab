x-seat: &seat
  build: ./seat
  user: agent
  working_dir: /home/agent
  command: ["sleep", "infinity"]
  init: true
  depends_on:
    main:
      condition: service_healthy

services:
  main:
    command: ["python3", "/world/world.py"]
    environment:
      SEAT_TOKENS: "{\"4d8bce8a0ee8555d10603538ec7b200c\": \"verifier\", \"caaffe109fc60e9cb25712f1c7320fbe\": \"builder\", \"fe0aa281a8cb49d62a2224e7337ab23f\": \"planner\"}"
    networks:
      planner-world:
        aliases: [world]
      builder-world:
        aliases: [world]
      verifier-world:
        aliases: [world]
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health', timeout=2)"]
      interval: 2s
      timeout: 5s
      retries: 15
      start_period: 2s
  planner:
    <<: *seat
    networks: [planner-world]
    environment:
      SEAT: "planner"
      SEAT_TOKEN: "fe0aa281a8cb49d62a2224e7337ab23f"
      WORLD: "http://world:8080"
  builder:
    <<: *seat
    networks: [builder-world]
    environment:
      SEAT: "builder"
      SEAT_TOKEN: "caaffe109fc60e9cb25712f1c7320fbe"
      WORLD: "http://world:8080"
  verifier:
    <<: *seat
    networks: [verifier-world]
    environment:
      SEAT: "verifier"
      SEAT_TOKEN: "4d8bce8a0ee8555d10603538ec7b200c"
      WORLD: "http://world:8080"

networks:
  planner-world:
    internal: true
    enable_ipv4: false
    enable_ipv6: true
  builder-world:
    internal: true
    enable_ipv4: false
    enable_ipv6: true
  verifier-world:
    internal: true
    enable_ipv4: false
    enable_ipv6: true
