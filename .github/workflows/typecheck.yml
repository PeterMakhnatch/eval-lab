name: typecheck

# Static type checking stays in its own workflow so the zero-diagnostic
# gate is independently visible. See docs/engineering.md.

on:
  pull_request:
    branches: [main, "integrate/**"]
  push:
    branches: [main, "integrate/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # Zero-diagnostic gate. Any ty diagnostic fails the job.
  TY_BASELINE: 0

jobs:
  ty:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install uv 0.9.24 from PyPI
        run: |
          python3 -m pip install --user uv==0.9.24
          echo "$HOME/.local/bin" >> $GITHUB_PATH
      - name: Install Python 3.12
        run: |
          uv python install 3.12
          echo "UV_PYTHON=3.12" >> $GITHUB_ENV
      - run: uv sync --locked

      - name: ty check
        run: |
          # ty is pre-1.0; pin it so a checker release cannot turn CI red on its own.
          # With TY_BASELINE=0, any diagnostic, startup failure, or missing executable
          # fails the gate. Real checker exit is preserved for parity with premerge.sh.
          set +e
          uvx ty@0.0.71 check src/ --output-format=concise > ty.txt 2>&1
          ty_exit=$?
          set -e

          cat ty.txt

          {
            echo "## ty — exit $ty_exit, baseline $TY_BASELINE"
            echo
            echo '```'
            cat ty.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$ty_exit" -ne 0 ]; then
            echo "::error::ty check failed with exit code $ty_exit."
            exit "$ty_exit"
          fi

          echo "ty at or below baseline (0 <= $TY_BASELINE)."
