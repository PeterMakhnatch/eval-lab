name: mcp-recovery-workbench-certification

on:
  pull_request:
    paths:
      - "library/benchmarks/mcp-recovery-v1/**"
      - "scripts/mcp_recovery/**"
      - "src/evallab/mcp_substrate.py"
      - "src/evallab/benchmark_program_contracts.py"
      - "tests/test_mcp_recovery_v1.py"
      - ".github/workflows/mcp-recovery.yml"
  push:
    branches:
      - main
    paths:
      - "library/benchmarks/mcp-recovery-v1/**"
      - "scripts/mcp_recovery/**"
      - "tests/test_mcp_recovery_v1.py"
      - ".github/workflows/mcp-recovery.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  certify:
    name: certify-mcp-recovery-${{ matrix.fault_mode }}-p${{ matrix.persistence }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        fault_mode:
          - transient-http-5xx
          - transient-network-timeout
          - persistent-schema-mismatch
          - persistent-signature-error
          - silent-wrong-payload
        persistence: [1, 2]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install uv 0.9.24
        run: |
          python3 -m pip install --user uv==0.9.24
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Install Python 3.12
        run: |
          uv python install 3.12
          echo "UV_PYTHON=3.12" >> "$GITHUB_ENV"
      - name: Install Harbor 0.21.0
        run: uv tool install "harbor==0.21.0"
      - name: Resolve and record canonical target wheelhouse
        run: |
          set -euo pipefail
          mkdir -p /tmp/fastmcp3_wheelhouse
          python3 -m pip download --only-binary=:all: --implementation cp --python-version 3.12 --abi cp312 --platform manylinux_2_17_x86_64 --dest /tmp/fastmcp3_wheelhouse fastmcp==3.4.7
          uv run python - <<'PY'
          import json
          from pathlib import Path
          from evallab.mcp_substrate import WheelhouseTarget, record_prepackaging_provenance
          provenance = record_prepackaging_provenance(
              Path("/tmp/fastmcp3_wheelhouse"),
              WheelhouseTarget("cp312", "manylinux_2_17_x86_64"),
          )
          Path("/tmp/fastmcp3-resolver-provenance.json").write_text(
              json.dumps(provenance.to_dict(), sort_keys=True) + "\n", encoding="utf-8"
          )
          PY
          echo "MCP_RECOVERY_WHEELHOUSE=/tmp/fastmcp3_wheelhouse" >> "$GITHUB_ENV"
          echo "MCP_RECOVERY_RESOLVER_PROVENANCE=/tmp/fastmcp3-resolver-provenance.json" >> "$GITHUB_ENV"
      - name: Materialize task cell
        id: materialize
        env:
          FAULT_MODE: ${{ matrix.fault_mode }}
          PERSISTENCE: ${{ matrix.persistence }}
        run: |
          set -euo pipefail
          uv run python - <<'PY' >> "$GITHUB_OUTPUT"
          import os
          import sys
          from pathlib import Path
          sys.path.insert(0, str(Path("library/benchmarks/mcp-recovery-v1").resolve()))
          from materializer import materialize_task, output_path
          fault_mode = os.environ["FAULT_MODE"]
          persistence = int(os.environ["PERSISTENCE"])
          path = materialize_task(
              output_path(seed=42, fault_mode=fault_mode, persistence=persistence),
              seed=42,
              fault_mode=fault_mode,
              persistence=persistence,
          )
          print(f"task_path={path}")
          PY
      - name: Freeze candidate plan
        id: plan
        env:
          FAULT_MODE: ${{ matrix.fault_mode }}
          PERSISTENCE: ${{ matrix.persistence }}
          TASK_PATH: ${{ steps.materialize.outputs.task_path }}
        run: |
          set -euo pipefail
          source_uri="eval-lab/benchmarks/mcp-recovery/${FAULT_MODE}-p${PERSISTENCE}"
          source_ref="local/eval-lab/benchmarks/mcp-recovery@1.0.0"
          mkdir -p "artifacts/${FAULT_MODE}-p${PERSISTENCE}"
          uv run python -m evallab.task_workbench plan "$TASK_PATH" \
            --repo-root . \
            --source-uri "$source_uri" \
            --source-ref "$source_ref" \
            --license MIT \
            --zone 03-synthetic \
            | tee "artifacts/${FAULT_MODE}-p${PERSISTENCE}/plan.json"
          candidate_id="$(jq -r '.candidate.candidate_id' "artifacts/${FAULT_MODE}-p${PERSISTENCE}/plan.json")"
          test "$candidate_id" != null
          echo "candidate_id=$candidate_id" >> "$GITHUB_OUTPUT"
      - name: Run fixed Harbor controls
        env:
          FAULT_MODE: ${{ matrix.fault_mode }}
          PERSISTENCE: ${{ matrix.persistence }}
          TASK_PATH: ${{ steps.materialize.outputs.task_path }}
        run: |
          set -euo pipefail
          source_uri="eval-lab/benchmarks/mcp-recovery/${FAULT_MODE}-p${PERSISTENCE}"
          source_ref="local/eval-lab/benchmarks/mcp-recovery@1.0.0"
          uv run python -m evallab.task_workbench check "$TASK_PATH" \
            --repo-root . \
            --source-uri "$source_uri" \
            --source-ref "$source_ref" \
            --license MIT \
            --zone 03-synthetic \
            --run-controls \
            | tee "artifacts/${FAULT_MODE}-p${PERSISTENCE}/check.json"
      - name: Write certification packet
        env:
          FAULT_MODE: ${{ matrix.fault_mode }}
          PERSISTENCE: ${{ matrix.persistence }}
          TASK_PATH: ${{ steps.materialize.outputs.task_path }}
          CANDIDATE_ID: ${{ steps.plan.outputs.candidate_id }}
        run: |
          set -euo pipefail
          source_uri="eval-lab/benchmarks/mcp-recovery/${FAULT_MODE}-p${PERSISTENCE}"
          source_ref="local/eval-lab/benchmarks/mcp-recovery@1.0.0"
          controls="runs/task-workbench/${CANDIDATE_ID}/controls.json"
          packet_root="research/registration/candidates/ci/${GITHUB_RUN_ID}/${FAULT_MODE}-p${PERSISTENCE}"
          test -s "$controls"
          uv run python -m evallab.task_workbench packet "$TASK_PATH" \
            --repo-root . \
            --source-uri "$source_uri" \
            --source-ref "$source_ref" \
            --license MIT \
            --zone 03-synthetic \
            --controls "$controls" \
            --output-root "$packet_root" \
            | tee "artifacts/${FAULT_MODE}-p${PERSISTENCE}/packet.json"
          test "$(jq -r '.disposition' "artifacts/${FAULT_MODE}-p${PERSISTENCE}/packet.json")" = "certified_for_review"
      - name: Produce durable cell registry controls
        env:
          FAULT_MODE: ${{ matrix.fault_mode }}
          PERSISTENCE: ${{ matrix.persistence }}
          TASK_PATH: ${{ steps.materialize.outputs.task_path }}
        run: |
          set -euo pipefail
          jobs="research/evidence/runs"
          harbor run --path "$TASK_PATH" \
            --agent oracle \
            --env docker \
            --job-name "mcp-recovery-${FAULT_MODE}-p${PERSISTENCE}-oracle-${GITHUB_RUN_ID}" \
            --jobs-dir "$jobs" \
            --n-concurrent 1 \
            --n-attempts 1 \
            --yes
          harbor run --path "$TASK_PATH" \
            --agent nop \
            --env docker \
            --job-name "mcp-recovery-${FAULT_MODE}-p${PERSISTENCE}-nop-${GITHUB_RUN_ID}" \
            --jobs-dir "$jobs" \
            --n-concurrent 1 \
            --n-attempts 1 \
            --yes
          uv run python - <<'PY'
          from pathlib import Path
          import os
          from evallab.registry import discover_control_evidence
          evidence = discover_control_evidence(Path(os.environ["TASK_PATH"]), Path.cwd())
          assert evidence.oracle.reward == 1.0
          assert evidence.nop.reward == 0.0
          PY
      - name: Upload review packet and retained evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mcp-recovery-${{ matrix.fault_mode }}-p${{ matrix.persistence }}-workbench
          path: |
            artifacts/${{ matrix.fault_mode }}-p${{ matrix.persistence }}/
            runs/task-workbench/${{ steps.plan.outputs.candidate_id }}/
            research/registration/candidates/ci/${{ github.run_id }}/${{ matrix.fault_mode }}-p${{ matrix.persistence }}/
            research/evidence/runs/
          if-no-files-found: error
