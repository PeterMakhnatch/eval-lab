x-seat: &seat
  build: ./seat
  user: agent
  working_dir: /home/agent
  command: ["sleep", "infinity"]
  init: true
  depends_on:
    main:
      condition: service_healthy

services:
  main:
    command: ["python3", "/world/world.py"]
    environment:
      SEAT_TOKENS: "{\"32a3a3db6600bc288fb7d67f8bcf0830\": \"acct_b\", \"dab4fb23a070f551c050ef943b3efade\": \"acct_a\", \"e2d2d04f13b84964766f64fb70a7669b\": \"auditor\"}"
    networks:
      acct_a-world:
        aliases: [world]
      acct_b-world:
        aliases: [world]
      auditor-world:
        aliases: [world]
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health', timeout=2)"]
      interval: 2s
      timeout: 5s
      retries: 15
      start_period: 2s
  acct_a:
    <<: *seat
    networks: [acct_a-world]
    environment:
      SEAT: "acct_a"
      SEAT_TOKEN: "dab4fb23a070f551c050ef943b3efade"
      WORLD: "http://world:8080"
  acct_b:
    <<: *seat
    networks: [acct_b-world]
    environment:
      SEAT: "acct_b"
      SEAT_TOKEN: "32a3a3db6600bc288fb7d67f8bcf0830"
      WORLD: "http://world:8080"
  auditor:
    <<: *seat
    networks: [auditor-world]
    environment:
      SEAT: "auditor"
      SEAT_TOKEN: "e2d2d04f13b84964766f64fb70a7669b"
      WORLD: "http://world:8080"

networks:
  acct_a-world:
    internal: true
    enable_ipv4: false
    enable_ipv6: true
  acct_b-world:
    internal: true
    enable_ipv4: false
    enable_ipv6: true
  auditor-world:
    internal: true
    enable_ipv4: false
    enable_ipv6: true
